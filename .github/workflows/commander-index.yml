name: Commander index

# The commander index, built ONCE on staging and copied to production (card-data replicate plan,
# 2026-09-28). A build is ~4,750 rate-limited EDHREC requests over hours; making them twice for
# one result was the waste the plan removes.
#
# Four jobs, in order: `gate` decides whether a build is due, `build` makes it on staging and
# records it in the ledger, `prose` writes staging's sentences for it, and `copy` publishes the
# index and then the sentences to production. Chained on the daily `Catalog refresh` rather than a
# cron, because the build resolves EDHREC's names against a catalog that must be current.
on:
  workflow_run:
    workflows: [Catalog refresh]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: Build on staging then copy, or copy staging's last good build only
        type: choice
        options: [build+copy, copy-only]
        default: build+copy
      resume_since:
        description: >-
          ISO timestamp; commanders recomputed at or after it are skipped. Set this
          to the start time of an aborted run to resume it instead of restarting.
        type: string
        default: ''

# ONE group for the workflow: never a second EDHREC request stream, and never two copies at once.
concurrency:
  group: commander-index
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.COMMANDER_INDEX_ENABLED == 'true' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'schedule')
    runs-on: ubuntu-latest
    environment: catalog-staging
    outputs:
      due: ${{ steps.due.outputs.due }}
    defaults:
      run:
        shell: bash
    env:
      DATABASE_URL: ${{ secrets.CATALOG_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A dispatch is always due. A chained run asks staging's own sets and ledger: monthly from
      # the 3rd, or 14 days after an expansion or commander set releases (`indexDue`).
      - id: due
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            pnpm --silent db:index-due | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.due == 'true' && github.event.inputs.mode != 'copy-only'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: catalog-staging
    defaults:
      run:
        shell: bash
    env:
      DATABASE_URL: ${{ secrets.CATALOG_DATABASE_URL }}
      RESUME_SINCE: ${{ github.event.inputs.resume_since || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The ledger row a copy reads: `start` records the catalog this build runs against, and
      # `finish ... ok` is written only when both builders succeeded.
      - name: Record the build
        run: pnpm --silent db:catalog-build start index
      - name: Build the commander index
        id: index
        # Bounded below the job's 180 minutes, so a run that overstays is stopped HERE and the
        # stamp step below still has time to run. A job-level timeout kills the whole job, and
        # no later step, not even an `always()` one, is guaranteed to run after it.
        timeout-minutes: 170
        run: |
          {
            echo "## Commander index"
            echo ""
            echo "- Target: \`catalog-staging\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          pnpm --silent db:build:index | tee -a "$GITHUB_STEP_SUMMARY"

      # The script stamps the catalog on every exit it controls (pass, failed floor, throw). A
      # step killed by its timeout or cancelled never reaches that code, and it has still written
      # part of an index and may have cleared every reader's scores, so the stamp runs here too.
      # Only when the build did not succeed: on success the script has already stamped.
      - name: Retire cached readers after a build that did not finish
        if: always() && steps.index.outcome != 'success' && steps.index.outcome != 'skipped'
        timeout-minutes: 5
        run: pnpm --silent db:stamp:catalog

      - name: Derive the format staples
        run: |
          {
            echo ""
            echo "## Format staples"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          pnpm --silent db:build:staples | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Close the build as ok
        if: success()
        run: pnpm --silent db:catalog-build finish index ok
      - name: Close the build as failed
        if: failure()
        run: pnpm --silent db:catalog-build finish index failed

  prose:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: catalog-staging
    defaults:
      run:
        shell: bash
    env:
      DATABASE_URL: ${{ secrets.CATALOG_DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate commander prose
        run: |
          {
            echo "## Commander prose"
            echo ""
            echo "- Target: \`catalog-staging\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          pnpm --silent db:build:prose | tee -a "$GITHUB_STEP_SUMMARY"

  copy:
    needs: [gate, build, prose]
    # `!cancelled()` lets a failed or skipped `prose` through: the index copy never depends on
    # the sentences, and `db:copy:prose` installs whichever ones exist.
    if: >-
      ${{ !cancelled() && needs.gate.outputs.due == 'true' &&
      (needs.build.result == 'success' ||
       (github.event.inputs.mode == 'copy-only' && needs.build.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: catalog-production
    defaults:
      run:
        shell: bash
    env:
      CATALOG_COPY_SOURCE_URL: ${{ secrets.CATALOG_COPY_SOURCE_URL }}
      CATALOG_COPY_TARGET_URL: ${{ secrets.CATALOG_DATABASE_URL }}
      # Production's Neon branch. A guard, not a credential: the target must report exactly this.
      CATALOG_COPY_TARGET_BRANCH: br-noisy-violet-a6vw4ess
      # The score clear's module imports `src/db`, which needs this set; nothing queries it.
      DATABASE_URL: ${{ secrets.CATALOG_DATABASE_URL }}
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Fail loudly without the copy secret
        run: |
          if [ -z "$CATALOG_COPY_SOURCE_URL" ]; then
            echo "::error::CATALOG_COPY_SOURCE_URL is not set in the catalog-production environment."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Copy the index to production
        run: |
          echo "## Index copy — staging to \`catalog-production\`" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          pnpm --silent db:copy:index 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Copy the sentences to production
        run: |
          echo "## Prose copy — staging to \`catalog-production\`" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          pnpm --silent db:copy:prose 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
