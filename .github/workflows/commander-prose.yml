name: Commander prose

# One generated sentence per commander, for "Why this commander". ~3,300 serial
# model calls with up to three attempts each is well past a Vercel function's
# 300s maxDuration, so it runs here for the same reason commander-index.yml does.
#
# DISPATCH ONLY since the card-data replicate plan (2026-09-28). The scheduled sentences are
# written on staging by the `prose` job inside `Commander index`, straight after the build whose
# tags they describe, and copied to production by that workflow's `copy` job (`db:copy:prose`), so
# each sentence costs one model call, once. This workflow stays for generating against one
# database by hand.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Which database to write sentences to
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: commander-prose-${{ github.event.inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prose:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Serial by design, and dominated by model latency rather than compute. A run
    # that times out mid-batch needs no resume input: every sentence is written as
    # it is accepted, and a re-dispatch skips each row whose stored hash still
    # matches its inputs, so the next run picks up where this one stopped.
    timeout-minutes: 240
    # Reuses the catalog-* environments for the same reason the index does: same
    # database, same secret, and a third environment holding an identical value is
    # one more thing to keep in sync for no benefit.
    environment: catalog-${{ github.event.inputs.target }}
    defaults:
      run:
        # GitHub expands `shell: bash` to `bash -eo pipefail`. Without it the generate step's
        # exit status would be `tee`'s, so a failed run would report the job as green.
        shell: bash
    env:
      DATABASE_URL: ${{ secrets.CATALOG_DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate commander prose
        run: |
          {
            echo "## Commander prose"
            echo ""
            echo "- Target: \`catalog-${{ github.event.inputs.target }}\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          pnpm --silent db:build:prose | tee -a "$GITHUB_STEP_SUMMARY"
