name: Combo refresh

# Commander Spellbook, built ONCE on staging and copied to production (card-data replicate plan,
# 2026-09-28). Spellbook's sweep is ~40 rate-limited requests and its bulk file is 656MB; fetching
# both twice for one result was the waste the plan removes.
#
# Chained on the daily `Catalog refresh` rather than carrying a cron: the ingest resolves variants
# against `cards`, so it has to follow a catalog refresh, and a cron only orders jobs until GitHub
# runs one late. It fires on every successful SCHEDULED catalog run and builds on Mondays alone.
on:
  workflow_run:
    workflows: [Catalog refresh]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: Build on staging then copy, or copy staging's last good build only
        type: choice
        options: [build+copy, copy-only]
        default: build+copy

# ONE group for the workflow, so two runs' copies can never overlap on production.
concurrency:
  group: combo-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.COMBO_REFRESH_ENABLED == 'true' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'schedule')
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.day.outputs.run }}
    steps:
      - id: day
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          # The catalog run's own start, not this job's clock: a catalog run GitHub started late on
          # a Monday is still Monday's.
          STARTED: ${{ github.event.workflow_run.run_started_at }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u -d "$STARTED" +%u)" = "1" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not a Monday catalog run ($STARTED); nothing to build."
          fi

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true' && github.event.inputs.mode != 'copy-only'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: catalog-staging
    defaults:
      run:
        shell: bash
    env:
      DATABASE_URL: ${{ secrets.CATALOG_DATABASE_URL }}
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The ingest records its own ledger row (`recordBuild`), finished ok only when it succeeded,
      # so a copy never publishes a refused or half-run build.
      - name: Refresh combos
        run: |
          echo "### Combo refresh — \`catalog-staging\`" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          pnpm --silent db:seed:combos | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  copy:
    needs: [gate, build]
    # `!cancelled()` so a SKIPPED build (copy-only) does not skip this job too.
    if: >-
      ${{ !cancelled() && needs.gate.outputs.run == 'true' &&
      (needs.build.result == 'success' ||
       (github.event.inputs.mode == 'copy-only' && needs.build.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: catalog-production
    defaults:
      run:
        shell: bash
    env:
      CATALOG_COPY_SOURCE_URL: ${{ secrets.CATALOG_COPY_SOURCE_URL }}
      CATALOG_COPY_TARGET_URL: ${{ secrets.CATALOG_DATABASE_URL }}
      # Production's Neon branch. A guard, not a credential: the target must report exactly this.
      CATALOG_COPY_TARGET_BRANCH: br-noisy-violet-a6vw4ess
      # The publish bodies' module imports `src/db`, which needs this set; nothing queries it.
      DATABASE_URL: ${{ secrets.CATALOG_DATABASE_URL }}
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Fail loudly without the copy secret
        run: |
          if [ -z "$CATALOG_COPY_SOURCE_URL" ]; then
            echo "::error::CATALOG_COPY_SOURCE_URL is not set in the catalog-production environment."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Copy combos to production
        run: |
          echo "### Combo copy — staging to \`catalog-production\`" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          pnpm --silent db:copy:combos 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
