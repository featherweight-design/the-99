name: Upstream contract checks

# Runs ahead of the daily catalog refresh, so an upstream shape change is known before the ingest
# fails on it (#103, when the refresh was weekly and a break could surface 7 days late). This canary
# hits the bulk-data index and the first line of each bulk download daily. No database, no secrets.
#
# The ManaPool check rides along rather than taking a workflow of its own: same daily cadence,
# same reasoning, and neither check needs a secret.
on:
  schedule:
    # 07:00 UTC daily, two hours ahead of the 09:00 catalog refresh, so a break is known before
    # the refresh itself runs.
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:scryfall
      # always(), so a Scryfall failure does not hide a simultaneous ManaPool one.
      - name: Check the ManaPool contract
        if: always()
        # The canary buffers and parses the whole ~51MB feed, so it needs the
        # same headroom the daily ingest gets. Without it a growing feed would
        # OOM here and report a crash where it should report a clean contract break.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm check:manapool
      # always(), so a Scryfall or ManaPool failure does not hide a Spellbook one — the three
      # upstreams are independent and one alert should report the whole picture.
      - name: Check the Commander Spellbook contract
        if: always()
        run: pnpm check:spellbook
