name: Price refresh

# No schedule since 2026-09-28: prices are the last step of the daily `Catalog refresh`, in both
# legs, so a day's prices always follow that day's catalog. This workflow stays for a one-off
# dispatch. The body is ~51MB, past a Vercel function's practical reach, so it runs on a runner.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Which database to price
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

jobs:
  # Resolves which databases this run prices. A scheduled run fans out over both environments;
  # a manual dispatch prices only the one it names. This has to be a separate job because a
  # matrix can only be built from a `needs` output — the alternative, an expression on
  # `environment`, is what this workflow shipped with, and it let staging sit 11 days stale
  # while production refreshed on schedule every Monday. Catalog refresh learned the same
  # lesson first; this is that fix, ported.
  plan:
    # Dispatch only; the daily prices run inside `Catalog refresh`.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.pick.outputs.targets }}
    steps:
      - id: pick
        shell: bash
        env:
          # Read through the environment rather than interpolating into the script body, so the
          # input cannot inject shell. The `case` re-validates what the `choice` type already
          # constrains, because `github.event.inputs` is unset — not defaulted — off dispatch.
          TARGET: ${{ github.event.inputs.target }}
        run: |
          case "$TARGET" in
            staging|production) targets="[\"$TARGET\"]" ;;
            '') targets='["staging","production"]' ;;
            *) echo "Unrecognised target: $TARGET" >&2; exit 1 ;;
          esac
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "Pricing: $targets"

  refresh:
    needs: plan
    strategy:
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
      # The two environments are independent databases. A staging ingest that fails must not
      # cancel the production one, which is the environment the app actually serves.
      fail-fast: false
    runs-on: ubuntu-latest
    concurrency:
      # Per target: the two environments hold different databases, so a manual staging refresh
      # has no reason to queue behind — or delay — the scheduled production one. Never cancel
      # in progress; the upsert walks the feed in batches and a half-applied run leaves the
      # table split across two `as_of` stamps, which is what liveness is read from.
      group: price-refresh-${{ matrix.target }}
      cancel-in-progress: false
    timeout-minutes: 60
    # GitHub environment names are `catalog-staging` / `catalog-production` — see the note in
    # catalog-refresh.yml. Each holds its own CATALOG_DATABASE_URL, so this is what routes the
    # ingest at one database rather than the other.
    environment: catalog-${{ matrix.target }}
    defaults:
      run:
        # GitHub expands `shell: bash` to `bash -eo pipefail`. Without it the seed step's exit
        # status would be `tee`'s, so a failed ingest would report the job as green.
        shell: bash
    env:
      DATABASE_URL: ${{ secrets.CATALOG_DATABASE_URL }}
      # The feed buffers whole (see fetchManapoolSingles) — ~51MB of JSON text
      # expands well past Node's default headroom once parsed into objects.
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Refresh prices
        run: |
          {
            echo "## Price refresh"
            echo ""
            echo "- Target: \`catalog-${{ matrix.target }}\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          pnpm --silent db:seed:prices | tee -a "$GITHUB_STEP_SUMMARY"
