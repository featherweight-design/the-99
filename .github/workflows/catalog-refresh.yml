name: Catalog refresh

# Replaces the Vercel cron that hit /api/cron/scryfall-refresh: the bulk files are ~24MB and
# ~77MB gzipped and expand to hundreds of MB, which outgrew the cron's 300s maxDuration. A
# runner gives us hours instead of minutes.
on:
  schedule:
    # 09:00 UTC DAILY (card-data replicate plan, 2026-09-28). A full run takes ~1 minute, so
    # daily costs nothing, and it is the one root every replicated job hangs off: `Combo refresh`
    # and `Commander index` chain on its success by `workflow_run`, never by cron spacing, because
    # GitHub runs a cron hours late when it is busy. Prices are this workflow's last step, so a
    # day's prices always follow that day's catalog.
    - cron: '0 9 * * *'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Which catalog database to refresh
        type: choice
        options: [staging, production]
        default: staging
      job:
        # `printings` alone exists to re-run a failed printings ingest against an oracle
        # catalog already known to be current. Against a stale one, genuinely new printings
        # are filtered out as FK orphans, so that run reports its orphan count loudly.
        description: Which ingest to run (`printings` alone assumes a current oracle catalog)
        type: choice
        options: [all, sets, printings, oracle, prices]
        default: all

permissions:
  contents: read

jobs:
  # Resolves which databases this run refreshes. A scheduled or release run fans out over both
  # environments; a manual dispatch refreshes only the one it names. This has to be a separate
  # job because a matrix can only be built from a `needs` output — the alternative, an
  # expression on `environment`, is what let staging go unrefreshed for five weeks.
  plan:
    # Kill switch for the automatic triggers; a manual dispatch always runs. Set the
    # CATALOG_REFRESH_ENABLED repository variable to 'true' or scheduled refresh never fires.
    if: vars.CATALOG_REFRESH_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.pick.outputs.targets }}
    steps:
      - id: pick
        shell: bash
        env:
          # Read through the environment rather than interpolating into the script body, so the
          # input cannot inject shell. The `case` re-validates what the `choice` type already
          # constrains, because `github.event.inputs` is unset — not defaulted — off dispatch.
          TARGET: ${{ github.event.inputs.target }}
        run: |
          case "$TARGET" in
            staging|production) targets="[\"$TARGET\"]" ;;
            '') targets='["staging","production"]' ;;
            *) echo "Unrecognised target: $TARGET" >&2; exit 1 ;;
          esac
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "Refreshing: $targets"

  refresh:
    needs: plan
    strategy:
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
      # The two environments are independent databases. A staging ingest that fails must not
      # cancel the production one, which is the environment the app actually serves.
      fail-fast: false
    runs-on: ubuntu-latest
    concurrency:
      # Per target: the two environments hold different databases, so a manual staging refresh
      # has no reason to queue behind — or delay — the scheduled production one. Never cancel
      # in progress; a half-applied ingest leaves the representative pass unrun.
      group: catalog-refresh-${{ matrix.target }}
      cancel-in-progress: false
    # The printings bulk download timeout alone is 30 minutes, before any
    # parsing or upserting. A timeout here aborts mid-ingest and skips the representative
    # recompute, so leave generous headroom rather than trimming to the expected runtime.
    timeout-minutes: 180
    # GitHub environment names are `catalog-staging` / `catalog-production`: a bare
    # `production` environment cannot be created because Vercel already owns `Production`
    # and the names are case-insensitively unique. Each holds its own CATALOG_DATABASE_URL,
    # so this is what routes the ingest at one database rather than the other.
    environment: catalog-${{ matrix.target }}
    defaults:
      run:
        # GitHub expands `shell: bash` to `bash -eo pipefail`. Without it the seed steps' exit
        # status would be `tee`'s, so a failed ingest would report the job as green.
        shell: bash
    env:
      # Each environment holds its own CATALOG_DATABASE_URL, following the
      # MIGRATE_DATABASE_URL precedent of a separate, explicitly-scoped connection string.
      DATABASE_URL: ${{ secrets.CATALOG_DATABASE_URL }}
      JOB: ${{ github.event.inputs.job || 'all' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start run summary
        run: |
          {
            echo "## Catalog refresh"
            echo ""
            echo "- Target: \`catalog-${{ matrix.target }}\`"
            echo "- Job: \`$JOB\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refresh sets
        if: env.JOB == 'all' || env.JOB == 'sets'
        run: |
          echo "### Sets" >> "$GITHUB_STEP_SUMMARY"
          pnpm --silent db:seed:sets | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Refresh oracle cards
        # Must precede printings: printings.oracle_id has an FK to cards.oracle_id, so a
        # stale cards table would have every new printing filtered out as an orphan.
        if: env.JOB == 'all' || env.JOB == 'oracle'
        run: |
          echo "### Oracle cards" >> "$GITHUB_STEP_SUMMARY"
          pnpm --silent db:seed | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Refresh printings
        if: env.JOB == 'all' || env.JOB == 'printings'
        run: |
          echo "### Printings" >> "$GITHUB_STEP_SUMMARY"
          if [ "$JOB" = "printings" ]; then
            echo "> Oracle cards were **not** refreshed in this run. Printings whose card is" \
                 "missing from the oracle catalog are counted below as orphans, not imported." \
                 >> "$GITHUB_STEP_SUMMARY"
          fi
          pnpm --silent db:seed:printings | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Refresh prices
        if: env.JOB == 'all' || env.JOB == 'prices'
        run: |
          echo "### Prices" >> "$GITHUB_STEP_SUMMARY"
          pnpm --silent db:seed:prices | tee -a "$GITHUB_STEP_SUMMARY"
