name: Card labels

# Labels new or changed cards' jobs and their limits, weekly.
#
# SHIPS DISABLED. `CARD_LABELS_ENABLED` must be set to 'true' for the schedule to fire, and
# that flip is Hugh's: this is the first job in the repository that SPENDS MONEY on a cron, and
# he approved a one-time backfill rather than a standing weekly charge. Until he switches it on,
# only a manual dispatch runs.
#
# STAGING ONLY, with no matrix. Every other refresh job here fans out over both catalog
# environments; this one must not, because a label costs a model call to produce and nothing to
# move — so `db:copy:labels` carries the result to production and the fan-out would double the
# bill for an identical outcome. Hugh's pay-once ruling, 2026-09-26. The exception is about money
# rather than correctness, which is why it reads as one beside its siblings.
on:
  schedule:
    # WEEKLY, Tuesdays at 21:17 UTC (Hugh, 2026-10-03). It labels what the input hash says has
    # moved. That is normally a new set, and sets release weekly at most; a catalog correction to
    # a card's text, or a prompt or model change, moves the hash too and waits for the same run. Tuesday is the
    # day after Monday's combo build, and 21:17 is twelve hours after that day's `Catalog refresh`
    # (09:00, daily), because a card the catalog has not ingested cannot be labelled. The margin is
    # wide because GitHub starts a cron hours late when it is busy (17:27Z for 09:00 on
    # 2026-09-28). A set ingested after this run waits for next Tuesday's: that is the cost of
    # weekly, and the price of the weekly cap binding one run. Its own cron rather than a `workflow_run` chain on the catalog refresh: a weekly
    # job chained on a daily one would need a day-of-week gate to do what this line already says.
    #
    # It used to run DAILY, so a run that timed out mid-batch would be resumed the next day under
    # the same ISO-week id. Most of that reason is gone: resume is keyed on an intent's CONTENT, so
    # any run id collects a batch another run paid for, and next week's run collects every batch
    # this week's left open, at no second charge. One run per ISO week means the weekly cap and
    # pause ($9, $5) bound each run.
    #
    # THE ONE CASE WEEKLY DOES NOT RESUME ON ITS OWN: a crash between a batch's `create` and the
    # write that records its id leaves an intent with no batch id, and only its OWN run id may
    # resolve that (`reconcile`, scripts/lib/card-labels-build.ts). The cron never runs that id
    # again, so its cards stay unplanned and later weekly runs stop red, naming it. Recover by
    # DISPATCHING with every box blank in the same ISO week, which computes the same id. A
    # dispatch cannot name a past week's id (the run_id rule below), so after the week ends it
    # needs a code change. The window is the seconds around one API call.
    - cron: '17 21 * * 2'
  workflow_dispatch:
    inputs:
      cap:
        description: 'Hard stop in USD for this run (max 65). Blank uses the weekly 9.'
        required: false
        default: ''
      pause:
        description: 'Pause and report if the projection passes this (max 65). Blank uses the weekly 5.'
        required: false
        default: ''
      run_id:
        description: 'Backfill run id, e.g. backfill-2026-09-28. Blank uses this ISO week (the cron behaviour).'
        required: false
        default: ''
      scope:
        description: 'Which cards: all, in-use, or deck:<uuid> (one deck''s stand-ins pool, the labels trial). Blank is all.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  label:
    # Kill switch for the cron; a manual dispatch always runs.
    if: vars.CARD_LABELS_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      # ONE group for the whole workflow, not per target, because there is no target: staging is
      # the only database this writes. The group exists so two runs cannot put two batch streams
      # on the API or race the same staging table. Never cancel in progress — an abort between
      # submitting a batch and recording its intent is the one window that costs money twice.
      group: card-labels
      cancel-in-progress: false
    outputs:
      # Set once the build has STARTED, whatever it then exits with. Read by `copy`, below.
      ran: ${{ steps.build.outputs.ran }}
    # Batches are asynchronous and this job POLLS until they are collected and published, so the
    # window has to cover the provider's turnaround. Measured on the sample: a 43-request batch
    # ended within minutes, but the API's stated ceiling is 24 hours and a set week is ~75
    # requests. Three hours is generous for the real case and still bounded; a run that times out
    # leaves its intents recorded, and nothing is re-submitted: the next scheduled run (a new
    # week's id) collects any batch that has an id, and a dispatch in the same ISO week resumes
    # the rest.
    timeout-minutes: 180
    environment: catalog-staging
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve the spend bounds
        id: bounds
        shell: bash
        # WHY THIS IS A SEPARATE STEP AND NOT LEFT TO `boundedNumber`, stated carefully because an
        # earlier version of this comment got it backwards and claimed `boundedNumber` CLAMPS. It
        # does not — `src/lib/labels/plan.ts` throws on a non-finite or out-of-range value, and
        # `plan.test.ts` pins 5500 throwing. So a wildly mistyped figure already fails loudly and
        # this step is not what saves it.
        #
        # What this step adds is two things `boundedNumber` cannot:
        #
        #   1. THE CEILINGS. `boundedNumber`'s range for both figures is 0 to 100, which is a
        #      sanity bound rather than Hugh's. His are 65 and 65 (below), and they are two
        #      different questions: the hard stop on what a run may spend, and where it stops and
        #      reports instead of continuing. A dispatch may ask for LESS of either and never for
        #      more. 70 would pass `boundedNumber` and must not pass here.
        #   2. THE TIMING. `boundedNumber` runs inside the script, so its refusal lands after the
        #      job has installed and connected. Refusing here is free, and reads as a bad input
        #      rather than as a failed run.
        #
        # An in-range typo is the case neither of us would otherwise catch: 5.5 meant as 55 is a
        # legal figure that silently truncates the wave to almost nothing.
        #
        # The ceilings are Hugh's, and they are two different bounds rather than one: the hard
        # stop on what a run may spend, and where it stops and reports instead of continuing. A
        # dispatch may ask for LESS of either. It may never ask for more. Both are 65 since Hugh
        # approved the full backfill at ~$61.1 with the stop raised to ~$65 (2026-10-03): its
        # projection sits near $61, so a pause ceiling of 50 would refuse the run he approved.
        env:
          # `github.event.inputs` rather than `inputs`, which is what all six sibling workflows in
          # this repository use and is defined on every event rather than only on a dispatch.
          #
          # Read through `env:` rather than interpolated into the script body. A `${{ }}` inside a
          # `run:` is substituted as TEXT before bash sees it, so a crafted input becomes script.
          # Nothing here is attacker-reachable — dispatch needs write access — but the habit is
          # what keeps it that way, and it costs nothing.
          RAW_CAP: ${{ github.event.inputs.cap }}
          RAW_PAUSE: ${{ github.event.inputs.pause }}
          RAW_RUN_ID: ${{ github.event.inputs.run_id }}
          RAW_SCOPE: ${{ github.event.inputs.scope }}
        run: |
          # An empty input is the CRON PATH, and also a dispatch that left the box alone: both
          # take the weekly figures. `inputs.*` is empty (never absent) on a schedule, so one
          # branch covers both and there is no `github.event_name` test to get wrong.
          cap="${RAW_CAP:-9}"
          pause="${RAW_PAUSE:-5}"

          # Two steps, and they are genuinely two: bash's `=~` decides whether the value IS a
          # decimal number, and awk decides whether it is in range. `$(( ))` cannot do the second
          # because it is integer-only, which is why awk is here at all rather than everywhere.
          check() {
            local name="$1" value="$2" ceiling="$3"
            # `[[ =~ ]]` rather than `grep -E`, because GREP IS LINE-ORIENTED: `^...$` matches any
            # single LINE of a multi-line value, so `$'5\ncap=999'` passes the parse. That is not
            # cosmetic here — the accepted figure is published with
            # `echo "cap=$cap" >> "$GITHUB_OUTPUT"`, so a newline inside it writes a SECOND,
            # unvalidated output line, and the spending step reads whichever the runner resolves
            # last. Bash anchors `=~` to the whole string and rejects it. Both measured, in bash
            # rather than in the interactive shell: zsh's `=~` accepts `1e3` against this same
            # pattern and bash does not, so a reading taken in the wrong shell would have argued
            # for the wrong fix.
            if [[ ! "$value" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
              echo "::error::$name must be a number, got '$value'"
              return 1
            fi
            if ! awk -v v="$value" -v c="$ceiling" 'BEGIN{exit !(v>0 && v<=c)}'; then
              echo "::error::$name must be greater than 0 and at most $ceiling, got '$value'"
              return 1
            fi
          }

          # Both are checked before either failure exits, so a dispatch that got both wrong is
          # told both times rather than once per attempt.
          ok=0
          check 'cap'   "$cap"   65 || ok=1
          check 'pause' "$pause" 65 || ok=1
          [ "$ok" -eq 0 ] || exit 1

          # THE RUN ID, and why a backfill must name its own rather than take the calendar's.
          #
          # `LABEL_RUN_ID` names the intents a run writes and the BUDGET it spends from. Since the
          # wave-publish change the cap binds a budget FAMILY rather than one id (`budgetFamily`):
          # every `backfill-YYYY-MM-DD` dispatch shares one budget per prompt version (Hugh's ~$65),
          # and each cron run named for its ISO week keeps its OWN weekly cap. So a backfill
          # re-dispatched under a later date continues the same budget instead of starting a fresh one,
          # the weekly budget stays weekly, and the two kinds of run never spend from each other's.
          #
          # What used to make a run id costly no longer does: each collected batch publishes its own
          # cards in the transaction that collects it, and any run id collects another run's open
          # batch (same model and prompt) and leaves those cards out of its own plan. A new id does
          # not re-pay for collected work. The one thing still owned by a single id is an intent
          # whose batch id was lost: only its own run resolves it, and its cards stay out of every
          # other run's plan until it does.
          #
          # The pattern is narrow ON PURPOSE, and anchored. It must not be possible to type a
          # weekly-looking id and land in the cron's ledger — that would merge a backfill's spend
          # into a weekly run's budget and make its publish depend on work nobody dispatched. The
          # anchors also matter because the value is published with `echo >> "$GITHUB_OUTPUT"`, so
          # an unanchored match would let a newline write a second, unvalidated line.
          run_id="${RAW_RUN_ID:-}"
          if [ -n "$run_id" ]; then
            if ! [[ "$run_id" =~ ^backfill-[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::run_id must look like backfill-YYYY-MM-DD, got '$run_id'"
              exit 1
            fi
          else
            # RESOLVED HERE, so the value published is never empty and the step that spends can
            # REFUSE an empty one. Left to the consumer as `${RESOLVED_RUN_ID:-weekly-…}`, an empty
            # value was ambiguous: it means "the cron" and it also means "this wiring is broken".
            # Actions sets the env var to the empty string when an output is missing, so a renamed
            # or reordered bounds step would silently put a NAMED backfill onto the weekly id — the
            # same double-pay the timeout message was just corrected for. One place computes the id.
            run_id="weekly-$(date -u +%G-W%V)"
          fi

          # THE SCOPE (`src/lib/labels/scope.ts`), anchored for the same reason as the run id: the
          # value is published with `echo >> "$GITHUB_OUTPUT"`. The build parses it again and
          # refuses anything else, so this is the early, readable refusal rather than the only one.
          scope="${RAW_SCOPE:-all}"
          if ! [[ "$scope" =~ ^(all|in-use|deck:[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$ ]]; then
            echo "::error::scope must be all, in-use or deck:<uuid>, got '$scope'"
            exit 1
          fi
          # A DECK TRIAL NEEDS ITS OWN BACKFILL ID. Under the weekly id, a timed-out trial would be
          # resumed by the next scheduled run, which passes no scope and so labels every card, on
          # the weekly budget, under the trial's intents.
          if [[ "$scope" == deck:* && "$run_id" != backfill-* ]]; then
            echo "::error::a deck scope needs a backfill-YYYY-MM-DD run_id, got '$run_id'"
            exit 1
          fi

          echo "cap=$cap"     >> "$GITHUB_OUTPUT"
          echo "pause=$pause" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          {
            echo "### Spend bounds"
            echo ""
            echo "| | value | ceiling |"
            echo "|---|---|---|"
            echo "| hard stop | \$$cap | \$65 |"
            echo "| pause and report | \$$pause | \$65 |"
            echo "| scope | $scope | |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if awk -v p="$pause" -v c="$cap" 'BEGIN{exit !(p>c)}'; then
            echo "Note: the pause is above the hard stop, so the cap truncates each wave before" \
                 "the projection can ever refuse one. That is safe but probably not intended." \
                 >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Label new and changed cards
        id: build
        # `shell: bash` expands to `bash -eo pipefail`. WITHOUT IT the script's exit code is
        # swallowed by `tee`, and the job reports green over a refused run — which would make the
        # spend cap and the publish floor, the two guards this job has, invisible in the only
        # place anyone looks.
        shell: bash
        env:
          # CATALOG_DATABASE_URL is the only database secret the catalog-* environments carry;
          # `secrets.DATABASE_URL` is empty there and `requireEnv` would refuse.
          DATABASE_URL: ${{ secrets.CATALOG_DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # A PER-RUN CAP sized to a release week, not to the backfill's ~$65.
          #
          # Measured over recent sets on the real catalog: a single set brings 65-616
          # Commander-legal cards (median 193), and a release WEEK can bring several — 2026-06-26
          # brought 897 across two, which is 75 requests and a worst case of $6.07. $9 covers that
          # and still refuses anything resembling a backfill, which would be $217.
          #
          # WHAT THIS ACTUALLY DOES, computed from the build's own `REQUEST_WORST_USD` ($0.0809 a
          # request at the 5,000-token ceiling) and `MEASURED_PER_CARD` ($0.001902), against the
          # weekly $9 cap and $5 pause — an earlier version of this comment claimed 1,200 cards
          # would "refuse and report", and that is false:
          #
          #    897 cards  ( 75 req)  worst $6.07   submits in full   projection $1.71
          #  1,200 cards  (100 req)  worst $8.09   submits in full   projection $2.28
          #  1,332 cards  (111 req)  worst $8.98   submits in full   projection $2.53
          #  2,000 cards  (167 req)  worst $13.52  wave TRUNCATES to 111 requests
          #  2,700 cards  (225 req)  worst $18.21  PAUSES on the projection ($5.14)
          #
          # So the cap truncates above ~1,332 cards and the projection is what refuses, from
          # ~2,630. That is the right shape for a weekly job: a heavy release week goes through,
          # a backfill-sized surprise stops and reports. It is NOT a hard refusal at 1,200, and
          # saying so would have left somebody trusting a bound that does not exist. A truncated
          # wave is not lost: it published what it collected, and the next run asks for the rest.
          # THE LITERALS MOVED to the `Resolve the spend bounds` step above, which validates a
          # dispatch's overrides and echoes what it settled on. They are read from that step's
          # OUTPUTS rather than from `$GITHUB_ENV`, because a step-level `env:` block WINS over
          # the job environment — so writing them there and leaving the literals here would have
          # left the dispatch inputs silently inert, the ninth instance in this feature of a
          # correct rule wired to nothing.
          # The kill switch, so the TIMEOUT message can say truthfully whether anything will
          # resume the run. Absent or anything but 'true' means the cron is skipped.
          CRON_ENABLED: ${{ vars.CARD_LABELS_ENABLED }}
          RESOLVED_RUN_ID: ${{ steps.bounds.outputs.run_id }}
          LABEL_CAP_USD: ${{ steps.bounds.outputs.cap }}
          LABEL_REPORT_AT_USD: ${{ steps.bounds.outputs.pause }}
          LABEL_SCOPE: ${{ steps.bounds.outputs.scope }}
        run: |
          # A STABLE RUN ID, and a LOOP that branches on the script's EXIT CODE.
          #
          # The id first: `db:build:labels` submits a wave and exits, because batches are
          # asynchronous — so collection happens on a LATER invocation, and the intent ledger,
          # `alreadySpent` and the publish are all scoped to `LABEL_RUN_ID`. With a fresh timestamp
          # per run and no re-invocation, a scheduled run submitted a wave, exited, and its results
          # were never collected: the same cards were PAID FOR AGAIN every week while nothing was
          # ever published. The CRON's id is the ISO week and it runs once a week, so a blank
          # dispatch in the same week resumes it; a dispatch that named `run_id` resumes THAT id
          # instead, and the timeout message says so.
          #
          # And the branching is on the CODE, not on the output. Reading stdout produced three
          # findings in three rounds — `published` also matched "nothing published" on the waiting
          # line, and "nothing to do" also meant "every stale card is unlabelable" — each fixed
          # with a better pattern, which was treating the symptom. Every message the script printed
          # was load-bearing for this loop's control flow. Now:
          #
          #    0   done, published or nothing stale
          #   75   more work: a wave went out, or batches are still processing — call again
          #    *   stop and look: refused, paused, or nothing labelable
          # REFUSE AN EMPTY BOUND rather than inheriting a default. `boundedNumber` returns its
          # FALLBACK for an absent or empty variable, and those fallbacks are 65 and 65 — the
          # backfill's ceilings, not this job's 9 and 5. (Not the widest it would allow, which is
          # 100; the point is that they are the wrong figures for a cron, not extreme ones.) So if
          # the bounds step is ever reordered after this one, renamed or dropped, these expressions
          # resolve to empty and a weekly cron quietly acquires the backfill's ceilings. That
          # is the exact failure this feature has shipped nine times: a correct rule wired to
          # nothing, invisible in every dry run. Two lines close it at the seam.
          : "${LABEL_CAP_USD:?empty — the bounds step did not run or did not publish its outputs}"
          : "${LABEL_REPORT_AT_USD:?empty — the bounds step did not run or did not publish its outputs}"

          # FAIL CLOSED. The bounds step resolves this for both paths — a validated
          # `backfill-YYYY-MM-DD` or the ISO week — so it is never legitimately empty, and an empty
          # value means the wiring broke rather than "use the weekly id". Guessing the weekly id
          # here would put a named backfill's cards under a different run id and pay for them twice.
          : "${RESOLVED_RUN_ID:?empty — the bounds step did not run or did not publish run_id}"
          export LABEL_RUN_ID="$RESOLVED_RUN_ID"
          # From here on the build may publish, so the copy job carries whatever it published.
          echo "ran=true" >> "$GITHUB_OUTPUT"
          echo "### Card labels — \`catalog-staging\` — run \`$LABEL_RUN_ID\`" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          for attempt in $(seq 1 40); do
            echo "--- pass $attempt ---" | tee -a "$GITHUB_STEP_SUMMARY"
            # `set +e` around the call only: the script's code is the signal, and `-e` would abort
            # the loop on the 75 that means "call me again".
            set +e
            pnpm --silent db:build:labels 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
            code=${PIPESTATUS[0]}
            set -e
            case "$code" in
              0)  echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 0 ;;
              75) ;;  # more work; fall through to the sleep
              *)  echo '```' >> "$GITHUB_STEP_SUMMARY"; exit "$code" ;;
            esac
            # Batches are minutes rather than seconds.
            sleep 120
          done
          {
            # WHAT RESUMES THIS DEPENDS ON THE SWITCH, and saying otherwise strands the run. This
            # used to claim "TOMORROW's scheduled run … no dispatch needed" unconditionally — but
            # the schedule is gated on `CARD_LABELS_ENABLED`, which is UNSET today, so the cron is
            # skipped and nothing resumes anything. An operator reading that waits for a run that
            # never happens, on a backfill that is half paid for.
            # RESUME BY THE RUN ID THIS RUN ACTUALLY USED, which is not always the ISO week any
            # more. This message used to say "any later run computing the same ISO-week id finds
            # them" and "dispatch again, in the same ISO week" — true for the cron and FALSE for a
            # named backfill. A blank box on the next dispatch produces `weekly-…`, which collects
            # the backfill's paid batches but then plans the rest against the WEEKLY budget rather
            # than the backfill's, so the backfill is continued under the wrong cap.
            echo "gave up after 40 passes (~80 minutes). Intents are recorded under"
            echo "$LABEL_RUN_ID, and nothing is re-submitted: a later run using THAT SAME id"
            echo "finds them and carries on."
            if [[ "$LABEL_RUN_ID" == backfill-* ]]; then
              echo ""
              echo "This run was dispatched with a named run id. To continue it, dispatch again"
              echo "and enter run_id=$LABEL_RUN_ID and scope=$LABEL_SCOPE. Leaving run_id blank starts"
              echo "a DIFFERENT run under this ISO week, which would spend the rest from the weekly"
              echo "budget; leaving scope blank means every card, which would turn a deck trial into"
              echo "the full backfill under the trial's run id."
            elif [ "$CRON_ENABLED" = "true" ]; then
              # Next week's run has a NEW id, so it collects this run's open batches (resume is by
              # content) but does not take over this id's own plan. Sooner is a blank dispatch now.
              echo "The schedule is ON, so next week's run collects these batches at no second charge."
              echo "To finish sooner, dispatch again in the same ISO week with run_id left blank."
            else
              echo "THE SCHEDULE IS OFF — CARD_LABELS_ENABLED is not 'true', so nothing will resume"
              echo "this on its own. Dispatch again in the same ISO week to continue."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit 1

  # Staging's labels, installed on production by the catalog copy harness. PAY ONCE: this job
  # never calls a model; `db:copy:labels` installs a label only when its input hash matches the
  # hash production's own card text produces.
  copy:
    needs: label
    # WHENEVER THE BUILD RAN, not only when it succeeded. Each batch publishes in its own
    # transaction behind its own floor, so a run stopped at its cap, paused on its projection or
    # killed by an unexpected error has still published labels that passed — and a backfill
    # family that spends its cap stops every later run too, so a success-only copy would never
    # carry those labels to production. The label job stays red for every non-zero exit, so a
    # failure still blocks and still reads as one; this job only moves what already passed,
    # and installs a label only when production's own hash matches it.
    if: ${{ !cancelled() && needs.label.outputs.ran == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: catalog-production
    concurrency:
      group: card-labels-copy
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      CATALOG_COPY_SOURCE_URL: ${{ secrets.CATALOG_COPY_SOURCE_URL }}
      CATALOG_COPY_TARGET_URL: ${{ secrets.CATALOG_DATABASE_URL }}
      # Production's Neon branch. A guard, not a credential: the target must report exactly this.
      CATALOG_COPY_TARGET_BRANCH: br-noisy-violet-a6vw4ess
      # The harness's stamp module imports `src/db`, which throws at load without this; nothing
      # queries through it.
      DATABASE_URL: ${{ secrets.CATALOG_DATABASE_URL }}
    steps:
      - name: Fail loudly without the copy secret
        run: |
          if [ -z "$CATALOG_COPY_SOURCE_URL" ]; then
            echo "::error::CATALOG_COPY_SOURCE_URL is not set in the catalog-production environment."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Copy labels to production
        run: |
          echo "### Label copy — staging to \`catalog-production\`" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          pnpm --silent db:copy:labels 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
