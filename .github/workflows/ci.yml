name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Copy drift
        run: pnpm check:copy-drift

      - name: CSS tokens
        run: pnpm check:tokens

      # A constraint name Postgres would truncate is invisible to every other step here:
      # drizzle-kit compares its own snapshots, and the failure only appears when the
      # migration RUNS — on a real deployment, the Vercel production build.
      - name: Migration constraint names
        run: pnpm check:constraints

      # A route that renders a figure out of collection_items and is not invalidated
      # by the collection replace serves a stale count until its cache expires. The
      # list it checks against was built by reading and was wrong three rounds running.
      - name: Collection route invalidation
        run: pnpm check:collection-routes

      # Routes meant to carry the same control have to render the same component, not
      # a lookalike. Every inventory is passed; one with no `shares` block is a no-op.
      - name: Shared components
        run: |
          for inventory in docs/superpowers/inventories/*.json; do
            pnpm -s check:shared "$inventory" || exit 1
          done

      - name: Test
        run: pnpm test

      # The same suite with the clock moved forward, so a test that pins "today"
      # fails here instead of in an unrelated PR on the day it rots. b1 found two
      # that way (#996); this makes the walk happen on demand rather than by
      # calendar accident.
      #
      # ONE offset, not three. Measured on 2026-09-25, +90, +400 and +1500 days
      # all pass the whole suite — #996 fixed the only rot there was — so no
      # offset earns its ~2.5 minutes by finding more than another today. +400 is
      # the brief's floor and crosses a year boundary, which is where most date
      # pinning breaks. The other offsets stay one env var away:
      # `CLOCK_SHIFT_DAYS=1500 pnpm test` locally.
      #
      # `scripts/clock-shift.test.mts` asserts the shift APPLIED, so a preload
      # that silently stopped patching Date fails this step rather than passing it.
      - name: Test with the clock moved forward
        env:
          CLOCK_SHIFT_DAYS: "400"
        run: |
          # Echoed here rather than from the shim: vitest captures a setup
          # file's stdout and the default reporter does not print it, so the
          # shim's own announce is invisible under `pnpm test`. Without this
          # line the log does not say what date the run believed in.
          echo "Running the suite as if today were $(date -u -d "+${CLOCK_SHIFT_DAYS} days" +%Y-%m-%d) (+${CLOCK_SHIFT_DAYS} days)"
          pnpm test:clock

      - name: Build
        env:
          # next build only needs the var to exist — no queries run at build time.
          DATABASE_URL: postgres://stub:stub@localhost/stub
        run: pnpm build
