name: CI

on:
  pull_request:
    # `labeled` so adding `ci:full` re-runs with the full suite forced.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

permissions:
  contents: read

# A push to a PR supersedes the run before it, so cancel that one instead of queueing eight more jobs
# behind it (measured: median queue 4s but p90 345s with several lanes pushing). Main never cancels:
# every merge commit keeps its own full run (the group is keyed on the sha, because a group holds
# only one pending run and would otherwise drop a middle push). The gate reads check-runs for the head sha only, so a
# cancelled run on an older sha is never judged.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which tests this PR would need. SHADOW: it prints the decision to the job summary and gates
  # nothing but its own success; the full suite below still runs. `vitest related` alone skips the
  # guards that READ the tree instead of importing it (measured: 23 of the last 25 merged PRs), so
  # the selection is related UNION every fs-reading test, or the full suite when a global file moves.
  # A failure here fails `checks`, so a broken selector can never read as a pass.
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge base has to be reachable.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select tests
        env:
          CI_BASE_REF: origin/${{ github.base_ref || 'main' }}
          CI_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') && '1' || '' }}
        run: node scripts/ci-select.mjs

  # Static checks and the build. Tests run in their own sharded job so the slowest step of the old
  # single job (about 80% of its wall clock) no longer serialises behind everything else.
  static:
    runs-on: ubuntu-latest
    # A hang fails here in minutes instead of sitting until GitHub's 6-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Copy drift
        run: pnpm check:copy-drift

      - name: CSS tokens
        run: pnpm check:tokens

      # `border-r` and `border-b` are also the mana tokens --r and --b, so a bare one paints a red or
      # black edge where a neutral divider was meant. Nothing else sees it: no type, no lint rule,
      # and jsdom computes no styles.
      - name: Border color collisions
        run: pnpm check:border-collision

      # A constraint name Postgres would truncate is invisible to every other step here:
      # drizzle-kit compares its own snapshots, and the failure only appears when the
      # migration RUNS — on a real deployment, the Vercel production build.
      - name: Migration constraint names
        run: pnpm check:constraints

      # A route that renders a figure out of collection_items and is not invalidated
      # by the collection replace serves a stale count until its cache expires. The
      # list it checks against was built by reading and was wrong three rounds running.
      - name: Collection route invalidation
        run: pnpm check:collection-routes

      # Routes meant to carry the same control have to render the same component, not
      # a lookalike. Every inventory is passed; one with no `shares` block is a no-op.
      - name: Shared components
        run: |
          for inventory in docs/superpowers/inventories/*.json; do
            pnpm -s check:shared "$inventory" || exit 1
          done

      - name: Build
        env:
          # next build only needs the var to exist — no queries run at build time.
          DATABASE_URL: postgres://stub:stub@localhost/stub
        run: pnpm build

      # A server chunk carrying its own copy of the Neon driver's Pool makes `db.transaction` run
      # its statements on different connections. Only the built output shows it.
      - name: One Neon driver copy
        run: pnpm check:db-pool

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # A failing shard must not cancel the others: a rerun of one red shard is cheaper than
      # losing the results of three that were still running.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test (shard ${{ matrix.shard }}/6)
        run: pnpm test --shard=${{ matrix.shard }}/6

  # The one status the rest of the process looks at keeps its old name, `checks`, and is green
  # only when every job above is. `always()` so a skipped or cancelled dependency fails it
  # rather than leaving it skipped, which a reader would take for passing.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [select, static, test]
    if: ${{ always() }}
    steps:
      - name: Every job succeeded
        run: |
          [ "${{ needs.select.result }}" = success ] && [ "${{ needs.static.result }}" = success ] && [ "${{ needs.test.result }}" = success ]
