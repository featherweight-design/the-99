name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Copy drift
        run: pnpm check:copy-drift

      - name: CSS tokens
        run: pnpm check:tokens

      # A constraint name Postgres would truncate is invisible to every other step here:
      # drizzle-kit compares its own snapshots, and the failure only appears when the
      # migration RUNS — on a real deployment, the Vercel production build.
      - name: Migration constraint names
        run: pnpm check:constraints

      # A route that renders a figure out of collection_items and is not invalidated
      # by the collection replace serves a stale count until its cache expires. The
      # list it checks against was built by reading and was wrong three rounds running.
      - name: Collection route invalidation
        run: pnpm check:collection-routes

      # Routes meant to carry the same control have to render the same component, not
      # a lookalike. Every inventory is passed; one with no `shares` block is a no-op.
      - name: Shared components
        run: |
          for inventory in docs/superpowers/inventories/*.json; do
            pnpm -s check:shared "$inventory" || exit 1
          done

      - name: Test
        run: pnpm test

      - name: Build
        env:
          # next build only needs the var to exist — no queries run at build time.
          DATABASE_URL: postgres://stub:stub@localhost/stub
        run: pnpm build
