name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Copy drift
        run: pnpm check:copy-drift

      - name: Test
        run: pnpm test

      - name: Build
        env:
          # next build only needs the var to exist — no queries run at build time.
          DATABASE_URL: postgres://stub:stub@localhost/stub
        run: pnpm build
