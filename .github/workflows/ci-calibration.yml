# One-time (and re-runnable) calibration of the CI test selector. For each file in
# scripts/ci-calibration-cases.json: break it, ask the selector what it would run, run the WHOLE
# suite, and fail the case when a test went red that the selector did not choose. Dispatch-only:
# every case is a full suite run (about 27 runner-minutes), so 22 legs are roughly 600 minutes.
# Plan: boards/plan-ci-affected-tests-2026-10-12.md.
name: CI selector calibration

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Run just the cases whose path contains this text (empty = all)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-calibration
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cases: ${{ steps.cases.outputs.cases }}
    steps:
      - uses: actions/checkout@v4
      - id: cases
        env:
          ONLY: ${{ inputs.only }}
        run: |
          cases=$(node -e '
            const all = JSON.parse(require("fs").readFileSync("scripts/ci-calibration-cases.json", "utf8"));
            const only = process.env.ONLY || "";
            // One leg per (file, mutation). A source file a guard reads as text gets both a throw and a half.
            const picked = all.filter((c) => c.path.includes(only))
              .flatMap((c) => (c.modes ?? ["auto"]).map((mode) => ({ file: c.path, mode })));
            if (picked.length === 0) { console.error("no case matches"); process.exit(1); }
            console.log(JSON.stringify(picked));
          ')
          echo "cases=$cases" >> "$GITHUB_OUTPUT"

  case:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # A full suite each; keep clear of the CI runners the PRs are queueing for.
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.cases) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Break the file and commit it
        env:
          FILE: ${{ matrix.file }}
          MODE: ${{ matrix.mode }}
        run: |
          git config user.name calibration
          git config user.email calibration@example.invalid
          node scripts/ci-calibrate.mjs mutate "$FILE" "$MODE"
          git commit -qam "calibration: break $FILE ($MODE)"

      # GITHUB_* variables cannot be overridden through a step `env:` block (the runner ignores it), so
      # the event is set on the command itself. Without it the selector sees `workflow_dispatch`, takes
      # its non-PR branch, selects everything, and every case "passes" having tested nothing.
      - name: Ask the selector
        id: select
        run: GITHUB_EVENT_NAME=pull_request CI_BASE_REF=HEAD~1 node scripts/ci-select.mjs

      # `affected` is the only answer that tests the selection. `full` because vitest could not read the
      # import graph (a syntactically broken file, invalid JSON) is the selector working as designed: the
      # whole suite then runs, so nothing can be missed and the leg passes with a note. Any other `full`
      # means the leg tested nothing.
      - name: The selector made a real selection
        env:
          MODE: ${{ steps.select.outputs.mode }}
          REASON: ${{ steps.select.outputs.reason }}
        run: |
          if [ "$MODE" = affected ]; then exit 0; fi
          case "$MODE/$REASON" in
            full/"import graph unreadable"*)
              echo "::notice::graph unreadable, so the selector chose the full suite: $REASON"
              echo "### Calibration leg: the selector fell back to the full suite ($REASON)" >> "$GITHUB_STEP_SUMMARY"
              echo "FALLBACK_FULL=1" >> "$GITHUB_ENV" ;;
            *)
              echo "::error::the selector answered '$MODE' ($REASON), not 'affected': this leg would test nothing"
              exit 1 ;;
          esac

      - name: Run the whole suite
        if: ${{ env.FALLBACK_FULL != '1' }}
        run: pnpm exec vitest run --passWithNoTests --reporter=json --outputFile=calibration-results.json || true

      - name: Compare
        if: ${{ env.FALLBACK_FULL != '1' }}
        env:
          FILE: ${{ matrix.file }}
          MODE: ${{ matrix.mode }}
        run: node scripts/ci-calibrate.mjs compare ci-selection.txt calibration-results.json "$FILE ($MODE)"
