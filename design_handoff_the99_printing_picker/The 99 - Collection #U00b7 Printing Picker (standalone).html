document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

olor:#EDE6D8;padding:40px;background:#100D0A;background-image:radial-gradient(1400px 700px at 30% -300px, rgba(201,162,75,0.06), transparent 70%);min-height:100vh;\">\n\n  <section style=\"max-width:1400px;margin:0 0 26px;\">\n    <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap;\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:#14110E;background:#C9A24B;border-radius:6px;padding:4px 10px;letter-spacing:0.08em;\">/collection?card=<\u002Fspan>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.32em;text-transform:uppercase;color:#8E8269;\">R3 · #105 per-printing art selection · feat/printings-and-sets<\u002Fdiv>\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#6FA368;border:1px solid #35502F;background:#1B2418;border-radius:999px;padding:4px 11px;\">Rebuilt against card-modal.tsx<\u002Fspan>\n    <\u002Fdiv>\n    <h1 style=\"font-family:'Cinzel',serif;font-weight:800;font-size:34px;margin:0 0 10px;color:#EDE6D8;\">You own four Forests. One of them is the one you like.<\u002Fh1>\n    <p style=\"max-width:940px;font-size:15px;line-height:1.7;color:#C6B79A;margin:0;\">An addendum to the shipped card detail modal. When you own more than one printing of a card, the <b style=\"color:#EDE6D8;font-weight:600;\">Set field becomes a disclosure<\u002Fb> and opens a region of every printing you own, inside the modal's scrolling content column. <b style=\"color:#EDE6D8;font-weight:600;\">2,368 of 2,470 cards own exactly one printing<\u002Fb> — those render the modal <i>byte-identical to today<\u002Fi>, per locked decision 6. Every state leads with the phone (392px), desktop (1060px) beside it.<\u002Fp>\n  <\u002Fsection>\n\n  <div style=\"border:1px solid #6E4A2A;border-left:3px solid #E0913C;border-radius:12px;background:#241B12;padding:18px 22px;margin-bottom:22px;max-width:1400px;\">\n    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#E0913C;margin-bottom:10px;\">R3 — four corrections after reading the repo<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px 26px;font-size:13.5px;color:#C6B79A;line-height:1.6;\">\n      <div><b style=\"color:#EDE6D8;font-weight:600;\">Mobile does have an art header.<\u002Fb> <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;\">card-modal.tsx<\u002Fspan> renders a <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;\">md:hidden<\u002Fspan> art header with a 180px card image. The <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;\">hidden md:flex<\u002Fspan> at :180 is the <i>desktop art column<\u002Fi>. The spec's §Open item 5 says mobile \"shows no card image today\" — <b style=\"color:#EDE6D8;font-weight:600;\">that is factually wrong about the shipped component<\u002Fb>, and I propagated it into R2. The Collection handoff was right; I called it stale in error. Art header restored.<\u002Fdiv>\n      <div><b style=\"color:#EDE6D8;font-weight:600;\">The modal height is fixed and must stay fixed.<\u002Fb> <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;\">md:h-[620px] md:max-h-[85vh]<\u002Fspan>, with a source comment explaining why: paging Prev/Next through cards with different oracle lengths resized the dialog under the cursor. R2 grew it to 980px on expand — that reintroduces the exact bug. <b style=\"color:#EDE6D8;font-weight:600;\">The region now lives inside the content column, which already scrolls.<\u002Fb><\u002Fdiv>\n      <div><b style=\"color:#EDE6D8;font-weight:600;\">The trigger is the existing Set field.<\u002Fb> <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;\">MetaField label=\"Set\" value={printingCaption(card)}<\u002Fspan> already names the printing. R1/R2 invented a second caption under the art, which would have contradicted it. The Set field gains a third line and becomes the button.<\u002Fdiv>\n      <div><b style=\"color:#EDE6D8;font-weight:600;\">One printing = no change at all.<\u002Fb> Decision 6 is explicit: \"one owned printing renders the modal <i>exactly as it does today<\u002Fi>.\" R1/R2 added a caption to all 2,470 cards and argued it earned its place. That argument is against a locked decision — withdrawn. State 1 is now the shipped modal, untouched.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"border:1px solid #2A241D;border-radius:14px;background:#1A160F;padding:20px 24px;margin-bottom:38px;max-width:1400px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px 26px;\">\n    <div><div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#8E8269;margin-bottom:6px;\">Where it lives<\u002Fdiv><div style=\"font-size:13.5px;color:#C6B79A;line-height:1.5;\">Inside the modal's <b style=\"color:#EDE6D8;font-weight:600;\">scrolling content column<\u002Fb>, below the meta row. The art column and Prev/Next never move.<\u002Fdiv><\u002Fdiv>\n    <div><div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#8E8269;margin-bottom:6px;\">Entry point<\u002Fdiv><div style=\"font-size:13.5px;color:#C6B79A;line-height:1.5;\">The existing <b style=\"color:#EDE6D8;font-weight:600;\">Set field<\u002Fb> — <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;\">MetaField<\u002Fspan> on desktop, promoted out of the 2×2 <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;\">MetaCell<\u002Fspan> grid on mobile, and only at 2+.<\u002Fdiv><\u002Fdiv>\n    <div><div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#8E8269;margin-bottom:6px;\">Chosen vs default<\u002Fdiv><div style=\"font-size:13.5px;color:#C6B79A;line-height:1.5;\">Solid brass ring + filled ✓ + <b style=\"color:#EDE6D8;font-weight:600;\">Your pick<\u002Fb>. The resolver's fallback gets a dashed ring + hollow ◇ + <b style=\"color:#EDE6D8;font-weight:600;\">Shown now<\u002Fb> — decision 10, never dressed as a choice.<\u002Fdiv><\u002Fdiv>\n    <div><div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#8E8269;margin-bottom:6px;\">Overflow<\u002Fdiv><div style=\"font-size:13.5px;color:#C6B79A;line-height:1.5;\">Past <b style=\"color:#EDE6D8;font-weight:600;\">{{ overflowThreshold }} entries<\u002Fb>: <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;\">SearchField<\u002Fspan>, finish chips, set headers. 54 Forests — the measured worst case.<\u002Fdiv><\u002Fdiv>\n    <div><div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#8E8269;margin-bottom:6px;\">Finish<\u002Fdiv><div style=\"font-size:13.5px;color:#C6B79A;line-height:1.5;\">One entry per collector number (decision 3). Finish is a text detail, and <b style=\"color:#EDE6D8;font-weight:600;\">plain nonfoil shows nothing<\u002Fb> (decision 9).<\u002Fdiv><\u002Fdiv>\n    <div><div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#8E8269;margin-bottom:6px;\">Commit<\u002Fdiv><div style=\"font-size:13.5px;color:#C6B79A;line-height:1.5;\">Immediate (decision 7). No Save, no confirm. Only escape hatch: <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;\">Use the default again<\u002Fspan>.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:52px;max-width:1900px;\">\n\n  <!-- ===================== ANATOMY ===================== -->\n  <div>\n    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:#8E8269;margin-bottom:16px;border-top:1px solid #2A241D;padding-top:18px;\">Anatomy · <span style=\"color:#C9A24B;\">the Set field, the tile, the fixed-height composition<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;\">\n\n      <div style=\"width:440px;flex:none;background:#1A160F;border:1px solid #2A241D;border-radius:14px;padding:26px 28px;\">\n        <div style=\"font-family:'Cinzel',serif;font-weight:600;font-size:19px;color:#EDE6D8;margin-bottom:4px;\">The Set field is the control<\u002Fdiv>\n        <div style=\"font-size:13px;color:#A89B84;line-height:1.6;margin-bottom:22px;\">It already renders <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;\">printingCaption(card)<\u002Fspan>. At one printing it stays exactly as shipped. At two or more it grows a third line and becomes a <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;\">button[aria-expanded]<\u002Fspan> — no second caption is introduced, so decision 8's \"art and caption never disagree\" holds by construction.<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:16px;\">\n          <div>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#8E8269;margin-bottom:8px;\">One printing — shipped MetaField, untouched<\u002Fdiv>\n            <div style=\"background:#14110E;border:1px solid #2A241D;border-radius:10px;padding:14px 16px;\">\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8E8269;\">Set<\u002Fdiv>\n              <div style=\"font-size:14px;color:#EDE6D8;margin-top:5px;\">Return to Ravnica <span style=\"font-family:'IBM Plex Mono',monospace;color:#8E8269;font-size:12px;\">· RTR<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#8E8269;margin-bottom:8px;\">Two or more — collapsed<\u002Fdiv>\n            <button style=\"width:100%;text-align:left;font-family:'IBM Plex Sans',sans-serif;background:#221D16;border:1px solid #3A3229;border-radius:10px;padding:12px 16px;cursor:pointer;\">\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8E8269;\">Set<\u002Fdiv>\n              <div style=\"font-size:14px;color:#EDE6D8;margin-top:5px;\">Ravnica Remastered <span style=\"font-family:'IBM Plex Mono',monospace;color:#8E8269;font-size:12px;\">· RVR<\u002Fspan><\u002Fdiv>\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#C9A24B;margin-top:6px;\">3 printings you own ▾<\u002Fdiv>\n            <\u002Fbutton>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#8E8269;margin-bottom:8px;\">Expanded · focus-visible · pinned<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:10px;\">\n              <button style=\"width:100%;text-align:left;font-family:'IBM Plex Sans',sans-serif;background:#2A241D;border:1px solid #4A4033;border-radius:10px;padding:12px 16px;cursor:pointer;\">\n                <div style=\"font-size:14px;color:#EDE6D8;\">Ravnica Remastered <span style=\"font-family:'IBM Plex Mono',monospace;color:#8E8269;font-size:12px;\">· RVR<\u002Fspan><\u002Fdiv>\n                <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#C9A24B;margin-top:6px;\">3 printings you own ▴<\u002Fdiv>\n              <\u002Fbutton>\n              <button style=\"width:100%;text-align:left;font-family:'IBM Plex Sans',sans-serif;background:#221D16;border:1px solid #3A3229;border-radius:10px;padding:12px 16px;outline:2px solid #C9A24B;outline-offset:2px;cursor:pointer;\">\n                <div style=\"font-size:14px;color:#EDE6D8;\">Ravnica Remastered <span style=\"font-family:'IBM Plex Mono',monospace;color:#8E8269;font-size:12px;\">· RVR<\u002Fspan><\u002Fdiv>\n                <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#C9A24B;margin-top:6px;\">3 printings you own ▾<\u002Fdiv>\n              <\u002Fbutton>\n              <button style=\"width:100%;text-align:left;font-family:'IBM Plex Sans',sans-serif;background:#221D16;border:1px solid #3A3229;border-radius:10px;padding:12px 16px;cursor:pointer;\">\n                <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8E8269;\">Set<\u002Fdiv>\n                <div style=\"font-size:14px;color:#EDE6D8;margin-top:5px;\">Return to Ravnica <span style=\"font-family:'IBM Plex Mono',monospace;color:#8E8269;font-size:12px;\">· RTR<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:7px;margin-top:6px;\"><span style=\"width:7px;height:7px;background:#C9A24B;transform:rotate(45deg);display:block;\"><\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#C9A24B;\">Your pick<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8E8269;\">· of 3 ▾<\u002Fspan><\u002Fdiv>\n              <\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"width:470px;flex:none;background:#1A160F;border:1px solid #2A241D;border-radius:14px;padding:26px 28px;\">\n        <div style=\"font-family:'Cinzel',serif;font-weight:600;font-size:19px;color:#EDE6D8;margin-bottom:4px;\">Tile states<\u002Fdiv>\n        <div style=\"font-size:13px;color:#A89B84;line-height:1.6;margin-bottom:20px;\">The collection grid's card tile at a smaller size — same <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;\">63/88<\u002Fspan> frame, same inset hairline. It sits on card art, so every state is carried by a <b style=\"color:#EDE6D8;font-weight:600;\">ring style<\u002Fb>, a <b style=\"color:#EDE6D8;font-weight:600;\">badge shape<\u002Fb> and a <b style=\"color:#EDE6D8;font-weight:600;\">word<\u002Fb> (SC 1.4.1).<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:16px;\">\n          <div>\n            <div style=\"position:relative;aspect-ratio:63/88;border-radius:10px;background:linear-gradient(150deg,#9aa9d6,#4a5590 58%,#2a2c56);box-shadow:inset 0 0 0 1px rgba(0,0,0,0.35);\"><\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#EDE6D8;margin-top:8px;line-height:1.3;\">Rest<\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:#8E8269;margin-top:3px;\">no ring<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"position:relative;aspect-ratio:63/88;border-radius:10px;background:linear-gradient(150deg,#9aa9d6,#4a5590 58%,#2a2c56);box-shadow:inset 0 0 0 1px rgba(0,0,0,0.35);outline:1px dashed #8E8269;outline-offset:3px;\">\n              <span style=\"position:absolute;top:6px;right:6px;width:18px;height:18px;border-radius:5px;background:rgba(10,8,6,0.72);border:1px dashed #8E8269;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#C6B79A;line-height:1;\">◇<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#EDE6D8;margin-top:8px;line-height:1.3;\">Shown now<\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:#8E8269;margin-top:3px;\">dashed, hollow ◇<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"position:relative;aspect-ratio:63/88;border-radius:10px;background:linear-gradient(150deg,#7ba6d0,#2f5a86 58%,#1c3a57);box-shadow:inset 0 0 0 1px rgba(0,0,0,0.35);outline:2px solid #C9A24B;outline-offset:3px;\">\n              <span style=\"position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:5px;background:#C9A24B;display:flex;align-items:center;justify-content:center;font-size:12px;color:#14110E;line-height:1;\">✓<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#EDE6D8;margin-top:8px;line-height:1.3;\">Your pick<\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:#8E8269;margin-top:3px;\">solid 2px, filled ✓<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"position:relative;aspect-ratio:63/88;border-radius:10px;background:linear-gradient(150deg,#9aa9d6,#4a5590 58%,#2a2c56);box-shadow:inset 0 0 0 1px rgba(0,0,0,0.35),0 0 0 2px #14110E,0 0 0 4px #C9A24B;\"><\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#EDE6D8;margin-top:8px;line-height:1.3;\">Focused<\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:#8E8269;margin-top:3px;\">global 2px/+2px<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:9px;margin-top:20px;font-size:12.5px;color:#A89B84;line-height:1.6;\">\n          <div><b style=\"color:#EDE6D8;font-weight:600;\">\"Shown now\", not \"Default\".<\u002Fb> Decision 10 says the fallback-resolved printing must not read as though the user chose it. <i>Shown now<\u002Fi> describes what the app is doing; <i>Default<\u002Fi> starts to sound like a setting you own.<\u002Fdiv>\n          <div><b style=\"color:#EDE6D8;font-weight:600;\">Chosen and focused are different rings<\u002Fb> — the pick hugs the art at <span style=\"font-family:'IBM Plex Mono',monospace;\">+3px<\u002Fspan>; focus is the global <span style=\"font-family:'IBM Plex Mono',monospace;\">:focus-visible<\u002Fspan> from <span style=\"font-family:'IBM Plex Mono',monospace;\">globals.css<\u002Fspan> (<span style=\"font-family:'IBM Plex Mono',monospace;\">2px var(--brass)<\u002Fspan>, offset <span style=\"font-family:'IBM Plex Mono',monospace;\">2px<\u002Fspan>) — not overridden.<\u002Fdiv>\n          <div>Badges sit on <span style=\"font-family:'IBM Plex Mono',monospace;\">rgba(10,8,6,.72)<\u002Fspan> so the glyph clears AA over any art. Brass badge <span style=\"font-family:'IBM Plex Mono',monospace;\">var(--bg) on var(--brass)<\u002Fspan> ≈ 9.4:1.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"width:430px;flex:none;display:flex;flex-direction:column;gap:24px;\">\n        <div style=\"background:#1A160F;border:1px solid #2A241D;border-radius:14px;padding:24px 26px;\">\n          <div style=\"font-family:'Cinzel',serif;font-weight:600;font-size:19px;color:#EDE6D8;margin-bottom:14px;\">The modal does not resize<\u002Fdiv>\n          <div style=\"font-size:13.5px;color:#C6B79A;line-height:1.65;\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;\">md:h-[620px] md:max-h-[85vh]<\u002Fspan>, and the source says why: the dialog used to be <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;\">h-auto<\u002Fspan> and paging Prev/Next through cards with one-line and twelve-line oracle text <b style=\"color:#EDE6D8;font-weight:600;\">resized it under the cursor on every step<\u002Fb>. A picker that grows the modal on expand rebuilds that bug and makes it worse — it would jump 360px under your hand.<\u002Fdiv>\n          <div style=\"font-size:13.5px;color:#C6B79A;line-height:1.65;margin-top:14px;\">So the region goes where the variable-height content already goes: <b style=\"color:#EDE6D8;font-weight:600;\">inside <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;\">.flex-1.overflow-auto<\u002Fspan><\u002Fb>, below the meta row. 54 Forests scroll there the same way twelve lines of oracle text already do. The art column is a flex sibling and never scrolls — so the card stays put no matter how far down the grid you are, which is what decision 4 is protecting.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#1A160F;border:1px solid #2A241D;border-radius:14px;padding:24px 26px;\">\n          <div style=\"font-family:'Cinzel',serif;font-weight:600;font-size:19px;color:#EDE6D8;margin-bottom:14px;\">Roles &amp; keyboard<\u002Fdiv>\n          <div style=\"background:#14110E;border:1px solid #2A241D;border-radius:10px;padding:14px 16px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;line-height:1.75;color:#C6B79A;white-space:pre;overflow-x:auto;\">button[aria-expanded][aria-controls]\ndiv#printings[role=radiogroup]\n  button[role=radio][aria-checked]\n    span.sr-only  \"shown now, not chosen\"<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:9px;margin-top:16px;font-size:12.5px;color:#A89B84;line-height:1.6;\">\n            <div><b style=\"color:#EDE6D8;font-weight:600;\">Radiogroup.<\u002Fb> Arrow keys move and select; <span style=\"font-family:'IBM Plex Mono',monospace;\">Tab<\u002Fspan> leaves. With no pick stored, <b style=\"color:#EDE6D8;font-weight:600;\">no radio is checked<\u002Fb> (decision 10) — roving tabindex starts on the shown-now entry.<\u002Fdiv>\n            <div><b style=\"color:#EDE6D8;font-weight:600;\">Esc collapses the region<\u002Fb> and returns focus to the Set field. <span style=\"font-family:'IBM Plex Mono',monospace;\">useDialogA11y<\u002Fspan> handles the second Esc as it does today — the region adds no handler that would swallow it.<\u002Fdiv>\n            <div>The region is inside the existing dialog, so <b style=\"color:#EDE6D8;font-weight:600;\">the focus trap already covers it<\u002Fb>. No new trap, no new live region.<\u002Fdiv>\n            <div>Tiles ≥ <span style=\"font-family:'IBM Plex Mono',monospace;\">100×140<\u002Fspan>; the mobile Set row is <span style=\"font-family:'IBM Plex Mono',monospace;\">62px<\u002Fspan>.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n\n    <div style=\"display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;margin-top:24px;\">\n      <div style=\"width:934px;flex:none;background:#1A160F;border:1px solid #2A241D;border-radius:14px;padding:26px 28px;\">\n        <div style=\"font-family:'Cinzel',serif;font-weight:600;font-size:19px;color:#EDE6D8;margin-bottom:4px;\">The mobile art header — and what it does when the region opens<\u002Fdiv>\n        <div style=\"font-size:13px;color:#A89B84;line-height:1.6;margin-bottom:22px;max-width:820px;\">The phone has shipped card art all along: a <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;\">md:hidden<\u002Fspan> header at <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;\">card-modal.tsx:146-177<\u002Fspan>, gradient background, <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;\">180px<\u002Fspan> art at <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;\">63/88<\u002Fspan>, close button at <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;\">top 22 / right 18<\u002Fspan>. Property table <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;\">collection.md:761<\u002Fspan> and <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;\">:785<\u002Fspan>. Every phone state on this canvas is drawn on it.<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:22px;\">\n          <div>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#8E8269;margin-bottom:10px;\">Collapsed, and 2–12 printings<\u002Fdiv>\n            <div style=\"border:1px solid #2A241D;border-radius:10px;overflow:hidden;\">\n              <div style=\"position:relative;padding:26px 14px 14px;background:linear-gradient(150deg,#7f9d6b,#476a41 58%,#2c4a2c);box-shadow:inset 0 -40px 40px -28px rgba(0,0,0,0.55);\">\n                <div style=\"position:absolute;top:12px;right:11px;width:22px;height:22px;border-radius:999px;background:rgba(10,8,6,0.55);color:#EDE6D8;display:flex;align-items:center;justify-content:center;font-size:11px;\">✕<\u002Fdiv>\n                <div style=\"width:112px;aspect-ratio:63/88;margin:4px auto 0;border-radius:8px;background:linear-gradient(150deg,#8fae74,#4c7245 58%,#2c4a2c);box-shadow:0 12px 26px rgba(0,0,0,0.5),inset 0 0 0 1px rgba(0,0,0,0.3);\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background:#181410;padding:12px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#8E8269;text-align:center;\">180px art · header stays<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#A89B84;line-height:1.6;margin-top:12px;\">Three tiles fit under a full-height header without a fight. The header stays exactly as shipped — no diff.<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#8E8269;margin-bottom:10px;\">Past {{ overflowThreshold }} — the header collapses<\u002Fdiv>\n            <div style=\"border:1px solid #4A4033;border-radius:10px;overflow:hidden;\">\n              <div style=\"position:relative;padding:26px 14px 10px;background:linear-gradient(150deg,#7f9d6b,#476a41 58%,#2c4a2c);box-shadow:inset 0 -40px 40px -28px rgba(0,0,0,0.55);display:flex;align-items:flex-end;gap:10px;\">\n                <div style=\"position:absolute;top:12px;right:11px;width:22px;height:22px;border-radius:999px;background:rgba(10,8,6,0.55);color:#EDE6D8;display:flex;align-items:center;justify-content:center;font-size:11px;\">✕<\u002Fdiv>\n                <div style=\"width:46px;flex:none;aspect-ratio:63/88;border-radius:7px;background:linear-gradient(150deg,#8fae74,#4c7245 58%,#2c4a2c);box-shadow:0 8px 18px rgba(0,0,0,0.5),inset 0 0 0 1px rgba(0,0,0,0.3);\"><\u002Fdiv>\n                <div style=\"min-width:0;padding-bottom:2px;\"><div style=\"font-family:'Cinzel',serif;font-weight:700;font-size:14px;color:#EDE6D8;text-shadow:0 2px 8px rgba(0,0,0,0.5);\">Forest<\u002Fdiv><div style=\"font-size:9.5px;color:#EDE6D8;opacity:0.86;margin-top:2px;\">Basic Land<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background:#181410;padding:12px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#C9A24B;text-align:center;\">72px art · title moves up beside it<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#A89B84;line-height:1.6;margin-top:12px;\">Same trade as the desktop panel at 54 entries, and the phone has less room to make it in.<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#8E8269;margin-bottom:10px;\">The call, and why<\u002Fdiv>\n            <div style=\"font-size:13px;color:#C6B79A;line-height:1.65;\">The header <b style=\"color:#EDE6D8;font-weight:600;\">collapses to a 72px thumbnail with the title beside it<\u002Fb>, and only at the overflow threshold. Below that it is untouched.<\u002Fdiv>\n            <div style=\"font-size:13px;color:#C6B79A;line-height:1.65;margin-top:12px;\">180px of art plus a 62px Set row plus a search field and three chips leaves roughly one tile row on a 812px phone — you would be choosing between 54 printings through a letterbox. Collapsing recovers a full row and a half.<\u002Fdiv>\n            <div style=\"font-size:13px;color:#C6B79A;line-height:1.65;margin-top:12px;\">It's also the cheapest place to take the space: the art you're looking at is <b style=\"color:#EDE6D8;font-weight:600;\">already the first tile in the grid<\u002Fb>, at 110px, three inches below. The header at full height is showing you the same picture twice.<\u002Fdiv>\n            <div style=\"border-top:1px solid #2A241D;margin-top:14px;padding-top:12px;font-size:12.5px;color:#A89B84;line-height:1.6;\">The title and type line move into the header as it collapses rather than being lost — they were below it, and the space they vacate is what the grid gains. Collapsing back on close is the same transition reversed.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid #2A241D;margin-top:20px;padding-top:16px;font-size:12.5px;color:#A89B84;line-height:1.6;max-width:900px;\"><b style=\"color:#EDE6D8;font-weight:600;\">The Set row's job changed, and it survives it.<\u002Fb> Its <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;\">40×56<\u002Fspan> thumbnail is no longer the only card art on the phone — so it stops substituting for the art and starts doing what the desktop Set field does: naming the printing, next to art that is already showing it. That is a better job than the one R2 gave it, and it needs no redraw.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ===================== 1 · NO PICKER ===================== -->\n  <div>\n    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:#8E8269;margin-bottom:16px;border-top:1px solid #2A241D;padding-top:18px;\">1 · No picker · <span style=\"color:#C9A24B;\">one printing owned — 2,368 of 2,470 cards. Zero diff.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;\">\n\n      <div style=\"width:392px;flex:none;border-radius:46px;padding:12px;background:#0A0806;border:1px solid #2A241D;box-shadow:0 34px 90px rgba(0,0,0,0.55);\"><div style=\"border-radius:34px;overflow:hidden;background:#181410;position:relative;height:812px;display:flex;flex-direction:column;\"><div style=\"position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:26px;background:#0A0806;border-radius:0 0 16px 16px;z-index:5;\"><\u002Fdiv>\n        <div style=\"position:relative;padding:44px 20px 20px;backgro  this canvas with a tweak switch — turn it off and nothing is lost but the shimmer.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"width:520px;flex:none;background:#1A160F;border:1px solid #2A241D;border-radius:14px;padding:26px 28px;\">\n        <div style=\"font-family:'Cinzel',serif;font-weight:600;font-size:19px;color:#EDE6D8;margin-bottom:4px;\">Empty collector number<\u002Fdiv>\n        <div style=\"font-size:13px;color:#A89B84;line-height:1.6;margin-bottom:20px;\">A bare <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;\">Name,Qty<\u002Fspan> import gives every holding <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;\">collector_number = ''<\u002Fspan>. The spec is specific: entries are distinguished by set code alone, and the entry must read correctly with the field absent — <b style=\"color:#EDE6D8;font-weight:600;\">not render a stray separator<\u002Fb>.<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:16px;\">\n          <div>\n            <div style=\"position:relative;aspect-ratio:63/88;border-radius:10px;background:linear-gradient(150deg,#8fae74,#4c7245 58%,#2c4a2c);box-shadow:inset 0 0 0 1px rgba(0,0,0,0.35);outline:1px dashed #8E8269;outline-offset:3px;\">\n              <span style=\"position:absolute;top:6px;right:6px;width:19px;height:19px;border-radius:5px;background:rgba(10,8,6,0.72);border:1px dashed #8E8269;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#C6B79A;line-height:1;\">◇<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:13px;color:#EDE6D8;margin-top:10px;line-height:1.3;\">Bloomburrow<\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8E8269;margin-top:3px;\">×4<\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:0.14em;text-transform:uppercase;color:#A89B84;margin-top:6px;\">Shown now<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"position:relative;aspect-ratio:63/88;border-radius:10px;background:linear-gradient(150deg,#7fa387,#3f6a52 58%,#25423a);box-shadow:inset 0 0 0 1px rgba(0,0,0,0.35);\"><\u002Fdiv>\n            <div style=\"font-size:13px;color:#EDE6D8;margin-top:10px;line-height:1.3;\">Kaldheim<\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8E8269;margin-top:3px;\">×7<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"position:relative;aspect-ratio:63/88;border-radius:10px;background:linear-gradient(150deg,#9ab07d,#5b7a4a 58%,#33502f);box-shadow:inset 0 0 0 1px rgba(0,0,0,0.35);\"><\u002Fdiv>\n            <div style=\"font-size:13px;color:#EDE6D8;margin-top:10px;line-height:1.3;\">Zendikar Rising<\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8E8269;margin-top:3px;\">×3<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid #2A241D;margin-top:20px;padding-top:16px;font-size:12.5px;color:#A89B84;line-height:1.6;\"><b style=\"color:#EDE6D8;font-weight:600;\">No \"no number\" label, no <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;\">#—<\u002Fspan>, no leading separator.<\u002Fb> The mono line is just the quantity. R1 and R2 drew a <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;\">no number<\u002Fspan> caption; on a bare import <i>every<\u002Fi> entry would carry it, which is noise on a line that exists to differentiate. The set name already does the work — and in this import shape the set name is the only thing that can. Accessible name still falls back to <i>no collector number<\u002Fi>.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"width:340px;flex:none;background:#1A160F;border:1px solid #2A241D;border-radius:14px;padding:24px 26px;\">\n        <div style=\"font-family:'Cinzel',serif;font-weight:600;font-size:19px;color:#EDE6D8;margin-bottom:14px;\">Two more the spec names<\u002Fdiv>\n        <div style=\"font-size:13.5px;color:#C6B79A;line-height:1.65;\"><b style=\"color:#EDE6D8;font-weight:600;\">Chosen printing has a NULL image.<\u002Fb> The caption still names it; only the art falls back. Unreachable from this UI — the picker can only offer printings it can render — but if it happens, the Set field keeps saying what you chose.<\u002Fdiv>\n        <div style=\"font-size:13.5px;color:#C6B79A;line-height:1.65;margin-top:14px;\"><b style=\"color:#EDE6D8;font-weight:600;\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;\">reversible_card<\u002Fspan> holdings<\u002Fb> have no <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;\">printings<\u002Fspan> row by design, so they resolve via tier 2 and can't be picked. One exists in the real collection. It renders as state 1 — no picker, no explanation, nothing to explain.<\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ===================== 6 · PICK OUTLIVES THE HOLDING ===================== -->\n  <div>\n    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:#8E8269;margin-bottom:16px;border-top:1px solid #2A241D;padding-top:18px;\">6 · Pick outlives the holding · <span style=\"color:#C9A24B;\">decision 5 — kept; the dormant tile is a ratified exception<\u002Fspan><\u002Fdiv>\n    <div style=\"border:1px solid #6E4A2A;border-left:3px solid #E0913C;border-radius:10px;background:#241B12;padding:14px 18px;margin-bottom:20px;max-width:1400px;font-size:13px;color:#C6B79A;line-height:1.6;\">\n      <b style=\"color:#EDE6D8;font-weight:600;\">Flagging this one for the audit trail.<\u002Fb> Decision 5 says the pick \"falls back <b style=\"color:#EDE6D8;font-weight:600;\">silently<\u002Fb>\", which I read as ruling out any visible dormant treatment — R3 first drew this state as showing nothing at all. Review ruled the opposite: keep the dormant tile and <i>Forget that pick<\u002Fi> as \"additions the spec should have called for and didn't.\" Drawn as ruled. It is a <b style=\"color:#EDE6D8;font-weight:600;\">knowing exception to a locked decision<\u002Fb>, not drift, and decision 5's text should be amended to match so the next audit doesn't flag it.\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;\">\n\n      <div style=\"width:520px;flex:none;background:#1A160F;border:1px solid #2A241D;border-radius:14px;padding:26px 28px;\">\n        <div style=\"font-family:'Cinzel',serif;font-weight:600;font-size:19px;color:#EDE6D8;margin-bottom:4px;\">You sold the Return to Ravnica copy<\u002Fdiv>\n        <div style=\"font-size:13px;color:#A89B84;line-height:1.6;margin-bottom:20px;\">The preference row survives — there's no FK to <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;\">collection_items<\u002Fspan>, which is what implements decision 5. The region shows the two printings you own, and <b style=\"color:#EDE6D8;font-weight:600;\">nothing is checked<\u002Fb>.<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:16px;\">\n          <div>\n            <div style=\"position:relative;aspect-ratio:63/88;border-radius:10px;background:linear-gradient(150deg,#9aa9d6,#4a5590 58%,#2a2c56);box-shadow:inset 0 0 0 1px rgba(0,0,0,0.35);outline:1px dashed #8E8269;outline-offset:3px;\">\n              <span style=\"position:absolute;top:6px;right:6px;width:19px;height:19px;border-radius:5px;background:rgba(10,8,6,0.72);border:1px dashed #8E8269;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#C6B79A;line-height:1;\">◇<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:13px;color:#EDE6D8;margin-top:10px;line-height:1.3;\">Ravnica Remastered<\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8E8269;margin-top:3px;\">#64 · ×1<\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:0.14em;text-transform:uppercase;color:#A89B84;margin-top:6px;\">Shown now<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"position:relative;aspect-ratio:63/88;border-radius:10px;background:linear-gradient(150deg,#8fb0b8,#3d6a72 58%,#20404a);box-shadow:inset 0 0 0 1px rgba(0,0,0,0.35);\"><\u002Fdiv>\n            <div style=\"font-size:13px;color:#EDE6D8;margin-top:10px;line-height:1.3;\">Commander Anthology Volume II<\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8E8269;margin-top:3px;\">#47 · ×1<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"opacity:0.55;\">\n            <div style=\"position:relative;aspect-ratio:63/88;border-radius:10px;background:linear-gradient(150deg,#7ba6d0,#2f5a86 58%,#1c3a57);box-shadow:inset 0 0 0 1px rgba(0,0,0,0.35);outline:2px dashed #C9A24B;outline-offset:3px;filter:grayscale(0.55);\">\n              <span style=\"position:absolute;top:6px;right:6px;width:21px;height:21px;border-radius:5px;background:rgba(10,8,6,0.78);border:1px solid #C9A24B;display:flex;align-items:center;justify-content:center;font-size:12px;color:#C9A24B;line-height:1;\">✓<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:13px;color:#EDE6D8;margin-top:10px;line-height:1.3;\">Return to Ravnica<\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8E8269;margin-top:3px;\">#71 · ×0<\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:0.14em;text-transform:uppercase;color:#C6B79A;margin-top:6px;\">Your pick · not owned now<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:11px;background:#211C15;border:1px solid #3A3229;border-radius:9px;padding:12px 14px;margin-top:18px;\">\n          <span style=\"width:7px;height:7px;background:#8E8269;transform:rotate(45deg);display:block;flex:none;margin-top:5px;\"><\u002Fspan>\n          <div style=\"font-size:12.5px;color:#C6B79A;line-height:1.55;\">You picked the Return to Ravnica printing before. It's not in your collection right now, so we're showing another one you own.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid #2A241D;margin-top:16px;padding-top:14px;display:flex;align-items:center;gap:14px;\">\n          <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:13px;color:#C9A24B;\">Forget that pick<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8E8269;margin-left:auto;\">replaces \"Use the default again\" while dormant<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid #2A241D;margin-top:16px;padding-top:14px;font-size:12.5px;color:#A89B84;line-height:1.6;\">The dormant tile keeps its <b style=\"color:#EDE6D8;font-weight:600;\">position in set order<\u002Fb> rather than moving to the end — you pinned it once, it should be where you left it. Dashed brass ring, outlined ✓ on a dark plate, greyed art, <span style=\"font-family:'IBM Plex Mono',monospace;\">×0<\u002Fspan>. Not selectable: <span style=\"font-family:'IBM Plex Mono',monospace;\">aria-disabled<\u002Fspan>, but still in the radiogroup so the count and reading order stay honest.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"width:520px;flex:none;background:#1A160F;border:1px solid #2A241D;border-radius:14px;padding:26px 28px;\">\n        <div style=\"font-family:'Cinzel',serif;font-weight:600;font-size:19px;color:#EDE6D8;margin-bottom:4px;\">You buy it back<\u002Fdiv>\n        <div style=\"font-size:13px;color:#A89B84;line-height:1.6;margin-bottom:20px;\">The next import restores the holding, the <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;\">preferred<\u002Fspan> join hits again, and the pick is simply live. No re-pinning, no prompt, no announcement.<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:16px;\">\n          <div>\n            <div style=\"position:relative;aspect-ratio:63/88;border-radius:10px;background:linear-gradient(150deg,#9aa9d6,#4a5590 58%,#2a2c56);box-shadow:inset 0 0 0 1px rgba(0,0,0,0.35);\"><\u002Fdiv>\n            <div style=\"font-size:13px;color:#EDE6D8;margin-top:10px;line-height:1.3;\">Ravnica Remastered<\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8E8269;margin-top:3px;\">#64 · ×1<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"position:relative;aspect-ratio:63/88;border-radius:10px;background:linear-gradient(150deg,#8fb0b8,#3d6a72 58%,#20404a);box-shadow:inset 0 0 0 1px rgba(0,0,0,0.35);\"><\u002Fdiv>\n            <div style=\"font-size:13px;color:#EDE6D8;margin-top:10px;line-height:1.3;\">Commander Anthology Volume II<\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8E8269;margin-top:3px;\">#47 · ×1<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"position:relative;aspect-ratio:63/88;border-radius:10px;background:linear-gradient(150deg,#7ba6d0,#2f5a86 58%,#1c3a57);box-shadow:inset 0 0 0 1px rgba(0,0,0,0.35);outline:2px solid #C9A24B;outline-offset:3px;\">\n              <span style=\"position:absolute;top:6px;right:6px;width:21px;height:21px;border-radius:5px;background:#C9A24B;display:flex;align-items:center;justify-content:center;font-size:13px;color:#14110E;line-height:1;\">✓<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:13px;color:#EDE6D8;margin-top:10px;line-height:1.3;font-weight:600;\">Return to Ravnica<\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#C6B79A;margin-top:3px;\">#71 · ×1<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:6px;margin-top:6px;\"><span style=\"width:7px;height:7px;background:#C9A24B;transform:rotate(45deg);display:block;flex:none;\"><\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:0.14em;text-transform:uppercase;color:#C9A24B;\">Your pick<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid #2A241D;margin-top:20px;padding-top:16px;font-size:12.5px;color:#A89B84;line-height:1.6;\">This is the state that justifies keeping the row, and it needs no design at all — the pick is simply live again, the note and the <i>Forget that pick<\u002Fi> button are gone, and nothing announces itself. Whatever decision 5 settles on for the dormant state, <b style=\"color:#EDE6D8;font-weight:600;\">reactivation stays silent<\u002Fb>: there is nothing to tell someone whose card came back and whose art came back with it.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"width:340px;flex:none;background:#1A160F;border:1px solid #2A241D;border-radius:14px;padding:24px 26px;\">\n        <div style=\"font-family:'Cinzel',serif;font-weight:600;font-size:19px;color:#EDE6D8;margin-bottom:14px;\">What a player sees<\u002Fdiv>\n        <div style=\"font-size:13.5px;color:#C6B79A;line-height:1.65;\">Nothing. They sold a card; the art went back to normal. Months later they buy it again and their old choice comes back on its own, which reads as the app remembering rather than the app asking.<\u002Fdiv>\n        <div style=\"border-top:1px solid #2A241D;margin-top:18px;padding-top:16px;font-size:12.5px;color:#A89B84;line-height:1.6;\">Under the ratified exception they see slightly more than nothing: open the region on that card and the old pick is still there, greyed, with one sentence saying why. Nothing surfaces on the review screen after the import, and nothing surfaces anywhere they didn't go looking. The Set field's count drops from <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;\">3 printings<\u002Fspan> to <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;\">2<\u002Fspan>, since the count is of printings you own.<\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;foilSheen&quot;: {\n    &quot;editor&quot;: &quot;boolean&quot;,\n    &quot;default&quot;: true,\n    &quot;tsType&quot;: &quot;boolean&quot;,\n    &quot;section&quot;: &quot;Treatment&quot;,\n    &quot;label&quot;: &quot;Foil sheen on art&quot;\n  },\n  &quot;tileMinWidth&quot;: {\n    &quot;editor&quot;: &quot;int&quot;,\n    &quot;default&quot;: 120,\n    &quot;min&quot;: 90,\n    &quot;max&quot;: 180,\n    &quot;step&quot;: 10,\n    &quot;unit&quot;: &quot;px&quot;,\n    &quot;tsType&quot;: &quot;number&quot;,\n    &quot;section&quot;: &quot;Region grid&quot;,\n    &quot;label&quot;: &quot;Tile minimum width&quot;\n  },\n  &quot;overflowThreshold&quot;: {\n    &quot;editor&quot;: &quot;int&quot;,\n    &quot;default&quot;: 12,\n    &quot;min&quot;: 4,\n    &quot;max&quot;: 40,\n    &quot;step&quot;: 1,\n    &quot;tsType&quot;: &quot;number&quot;,\n    &quot;section&quot;: &quot;Region grid&quot;,\n    &quot;label&quot;: &quot;Search appears at N entries&quot;\n  }\n}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const foilSheen = this.props.foilSheen ?? true;\n    const tileMinWidth = this.props.tileMinWidth ?? 120;\n    const overflowThreshold = this.props.overflowThreshold ?? 12;\n\n    const grad = (a, b, c) => `linear-gradient(150deg,${a},${b} 58%,${c})`;\n    const DASH = '1px dashed #8E8269';\n\n    // Real sets that printed a basic Forest, newest release first — the spec's\n    // measured worst case (54 owned printings of one card).\n    const sets = [\n      ['Bloomburrow', 'BLB', ['282', '283', '284', '285'], ['8fae74', '4c7245', '2c4a2c']],\n      ['Duskmourn: House of Horror', 'DSK', ['271', '272', '273'], ['6f8f66', '3b5c3c', '223626']],\n      ['Ravnica Remastered', 'RVR', ['276', '277'], ['93ae7c', '55764c', '2f4a30']],\n      ['Modern Horizons 3', 'MH3', ['308', '309', '310'], ['86a86f', '4a6f42', '294527']],\n      ['Tales of Middle-earth', 'LTR', ['270', '271', '272', '273'], ['9cb583', '5c7d4f', '35512f']],\n      ['Wilds of Eldraine', 'WOE', ['265', '266', '267'], ['7fa17a', '446b4d', '25412f']],\n      ['March of the Machine', 'MOM', ['277', '278'], ['8ba873', '4f7346', '2c4629']],\n      ['Phyrexia: All Will Be One', 'ONE', ['274', '275'], ['7c9a6c', '43663f', '243f26']],\n      ['Dominaria United', 'DMU', ['265', '266', '267'], ['95af7e', '56784d', '30492e']],\n      ['Streets of New Capenna', 'SNC', ['274', '275'], ['84a271', '486c44', '284429']],\n      ['Kamigawa: Neon Dynasty', 'NEO', ['297', '298', '299'], ['7ea678', '426d4a', '23422d']],\n      ['Innistrad: Midnight Hunt', 'MID', ['276', '277', '278'], ['6f9268', '3c5f3c', '213823']],\n      ['Kaldheim', 'KHM', ['283', '284', '285', '286'], ['8fae74', '4c7245', '2c4a2c']],\n      ['Zendikar Rising', 'ZNR', ['274', '275', '276'], ['9ab07d', '5b7a4a', '33502f']],\n      ['Theros Beyond Death', 'THB', ['253', '254'], ['86a473', '4a6e45', '2a462b']],\n      ['Throne of Eldraine', 'ELD', ['267', '268'], ['7ba172', '406a45', '23402b']],\n      ['Guilds of Ravnica', 'GRN', ['261', '262'], ['90ab79', '53744a', '2e472d']],\n      ['Amonkhet', 'AKH', ['265', '266'], ['a1b183', '627a4e', '3a5030']],\n      ['Battle for Zendikar', 'BFZ', ['270', '271', '272'], ['8aa672', '4d7045', '2b4529']],\n      // Empty-string collector numbers — the bare Name,Qty import case.\n      ['Secret Lair Drop', 'SLD', ['', ''], ['7fa387', '3f6a52', '25423a']],\n    ];\n\n    const foils = { 'KHM-284': 1, 'ZNR-275': 1, 'SLD-2': 2, 'NEO-298': 1, 'LTR-271': 1, 'DMU-266': 1 };\n\n    let first = true;\n    const forestSets = sets.map(([name, code, numbers, art]) => ({\n      label: `${name} · ${code} · ${numbers.length}`,\n      art: grad('#' + art[0], '#' + art[1], '#' + art[2]),\n      items: numbers.map((num, i) => {\n        const key = `${code}-${num || i + 1}`;\n        const foil = foils[key] || 0;\n        const qty = foil && !num ? 2 : foil ? 3 : 1;\n        const shownNow = first;\n        first = false;\n        // Decision 9: plain nonfoil shows nothing beyond the quantity.\n        const finish = foil === qty ? `×${qty} foil` : foil ? `×${qty} · ${foil} foil` : `×${qty}`;\n        return {\n          ring: shownNow ? DASH : 'none',\n          badge: shownNow ? '1' : '0',\n          sheen: foilSheen && foil ? '1' : '0',\n          meta: num ? `#${num} · ${finish}` : finish,\n        };\n      }),\n    }));\n\n    const blur = ['#4A7FB5', '#6FA368', '#C05A48', '#8E8269', '#5B6E8C', '#7A6A4F'];\n    const blurCards = Array.from({ length: 12 }, (_, i) => {\n      const c = blur[i % blur.length];\n      return { art: `linear-gradient(150deg,${c},#2A241D 70%)` };\n    });\n\n    return { forestSets, blurCards, tileMinWidth, overflowThreshold };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
