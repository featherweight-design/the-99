<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ gc }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 16 16" style="display:block;flex:none;color:var(--fact);filter:drop-shadow(0 0 3px color-mix(in srgb, var(--fact) 45%, transparent));"><path d="M9.4 1.5 L4.1 8.8 H7.3 L6.6 14.5 L11.9 7.0 H8.7 Z" fill="currentColor"></path></svg></sc-if><sc-if value="{{ mld }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 16 16" style="display:block;flex:none;color:var(--fact);filter:drop-shadow(0 0 3px color-mix(in srgb, var(--fact) 45%, transparent));"><path d="M1.4 13.4 L6.2 5.2 L9.4 10.6 L11.2 7.8 L14.6 13.4 Z" fill="currentColor"></path><path d="M4.4 2.6 L5.6 2.6 M8.0 1.6 L8.0 3.0 M11.0 2.8 L12.2 2.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.6"></path></svg></sc-if><sc-if value="{{ turn }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 16 16" style="display:block;flex:none;color:var(--fact);filter:drop-shadow(0 0 3px color-mix(in srgb, var(--fact) 45%, transparent));"><path d="M10.98 3.74 A 5.2 5.2 0 1 1 6.65 2.98" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path><path d="M9.0 2.4 L7.1 4.6 L6.2 1.3 Z" fill="currentColor"></path></svg></sc-if><sc-if value="{{ tutor }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 16 16" style="display:block;flex:none;color:var(--fact);filter:drop-shadow(0 0 3px color-mix(in srgb, var(--fact) 45%, transparent));"><path d="M1.8 12.2 H14.2 V14.4 H1.8 Z" fill="currentColor"></path><path d="M8 1.3 L11.7 5.7 H9.2 V10.3 H6.8 V5.7 H4.3 Z" fill="currentColor"></path></svg></sc-if><sc-if value="{{ combo }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 16 16" style="display:block;flex:none;color:var(--fact);filter:drop-shadow(0 0 3px color-mix(in oklab, var(--fact) 45%, transparent));"><path d="M5.2 4.9 A 3.1 3.1 0 1 0 5.2 11.1 C 8.3 11.1 7.7 4.9 10.8 4.9 A 3.1 3.1 0 1 1 10.8 11.1 C 7.7 11.1 8.3 4.9 5.2 4.9 Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg></sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:16,&quot;height&quot;:16},&quot;fact&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;gc&quot;,&quot;mld&quot;,&quot;turn&quot;,&quot;tutor&quot;,&quot;combo&quot;],&quot;default&quot;:&quot;gc&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
// Paths lifted verbatim from src/components/cards/card-fact-mark.tsx and combo-glyph.tsx (main).
class Component extends DCLogic {
  renderVals() {
    const f = this.props.fact;
    return { gc: f === 'gc', mld: f === 'mld', turn: f === 'turn', tutor: f === 'tutor', combo: f === 'combo' };
  }
}
</script>
</body>
</html>
