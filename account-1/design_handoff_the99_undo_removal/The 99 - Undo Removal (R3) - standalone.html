document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ht: 700;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"d39a033c-a1a6-4ad5-b8b5-4a5b50aa727b\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'IBM Plex Sans';\n  font-style: normal;\n  font-weight: 700;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"93f061ef-58ec-461f-93e9-bbfdace15d31\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'IBM Plex Sans';\n  font-style: normal;\n  font-weight: 700;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"05657e5a-65ac-44f2-805e-7bc39087b933\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'IBM Plex Sans';\n  font-style: normal;\n  font-weight: 700;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"82c57e8d-5761-495a-b85d-d3cf3851598f\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  * { box-sizing: border-box; }\n  body { margin: 0; background: #100D0A; }\n  ::selection { background: #C9A24B; color: #14110E; }\n  a { color: #C9A24B; text-decoration: none; }\n  a:hover { color: #D8B25E; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"font-family:'IBM Plex Sans',sans-serif;color:#EDE6D8;padding:40px;background:#100D0A;background-image:radial-gradient(1400px 700px at 30% -300px, rgba(201,162,75,0.06), transparent 70%);min-height:100vh;\">\n\n  <section style=\"max-width:1400px;margin:0 0 26px;\">\n    <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap;\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:#14110E;background:#C9A24B;border-radius:6px;padding:4px 10px;letter-spacing:0.08em;\">R3<\u002Fspan>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.32em;text-transform:uppercase;color:#8E8269;\">Undo a removal · one link that always works<\u002Fdiv>\n    <\u002Fdiv>\n    <h1 style=\"font-family:'Cinzel',serif;font-weight:800;font-size:34px;margin:0 0 10px;color:#EDE6D8;\">A restore cannot be refused, so nothing here refuses.<\u002Fh1>\n    <p style=\"max-width:1040px;font-size:15px;line-height:1.7;color:#C6B79A;margin:0 0 12px;\"><b style=\"color:#EDE6D8;font-weight:600;\">R2 modelled the restore on the pull flow, and that was the wrong parent.<\u002Fb> A pull is contended — it mutates another deck. <b style=\"color:#EDE6D8;font-weight:600;\">A restore mutates only your own draft.<\u002Fb> <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;\">Put back<\u002Fspan> is an add, and in this app adds never refuse on claims — they price them. <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;\">DeckAddRejection<\u002Fspan> is three values, all about legality and identity, and <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;\">addCardToDeck<\u002Fspan> does not read availability at all.<\u002Fp>\n    <p style=\"max-width:1040px;font-size:15px;line-height:1.7;color:#C6B79A;margin:0 0 12px;\"><b style=\"color:#EDE6D8;font-weight:600;\">Every gate is closed by construction.<\u002Fb> A row under <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;\">Going out<\u002Fspan> was in this deck's committed list, so it already passed legality and colour identity; and a commander is not a <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;\">deck_cards<\u002Fspan> row, so <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;\">is-commander<\u002Fspan> cannot fire either. <b style=\"color:#EDE6D8;font-weight:600;\">The claim gates were never open in the first place.<\u002Fb><\u002Fp>\n    <p style=\"max-width:1040px;font-size:15px;line-height:1.7;color:#C6B79A;margin:0 0 12px;\">So R3 deletes both refusal states and everything that existed to serve them: the <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;\">claimed<\u002Fspan> tag word, the commander row's empty-control variant, the 32px shared slot, and the <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;\">Pull it → Pull<\u002Fspan> demotion. <b style=\"color:#EDE6D8;font-weight:600;\">Each of those had exactly one reason to exist, and the reason was a refused row.<\u002Fb> Two review rounds of alignment work on the price column goes with them — there is no second price to align to.<\u002Fp>\n    <p style=\"max-width:1040px;font-size:15px;line-height:1.7;color:#C6B79A;margin:0 0 12px;\"><b style=\"color:#EDE6D8;font-weight:600;\">And R3 drops one more thing the audit did not ask for.<\u002Fb> R2 kept the row through the round trip because the refusal was drawn on it. With no refusal to draw, <b style=\"color:#EDE6D8;font-weight:600;\">that argument retires too<\u002Fb> — so the restore is optimistic, and the in-flight state disappears rather than shrinking. See <a href=\"#whyoptimistic\">3<\u002Fa>.<\u002Fp>\n    <p style=\"max-width:1040px;font-size:14px;line-height:1.7;color:#8E8269;margin:0;\">What is left: <b style=\"color:#C6B79A;font-weight:600;\">one always-succeeding link, one edited string, and the focus ruling.<\u002Fb> Diff against <a href=\"The 99 - Undo Removal (R2).dc.html\">R2<\u002Fa> · <a href=\"README.md\">README<\u002Fa> · <a href=\"STATES-restore.md\">matrix<\u002Fa> · <a href=\"undo-removal - copy strings.ts\">copy<\u002Fa> · <a href=\"READINESS.md\">READINESS<\u002Fa>.<\u002Fp>\n  <\u002Fsection>\n\n  <div style=\"border:1px solid #3A3229;border-left:3px solid #C6533F;border-radius:12px;background:#181410;padding:16px 20px;margin-bottom:20px;max-width:1400px;\">\n    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#C6533F;margin-bottom:12px;\">Deleted in R3 — and the single reason each one existed<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px 26px;\">\n      <div style=\"font-size:13px;color:#A89B84;line-height:1.6;\"><b style=\"color:#EDE6D8;font-weight:600;\">Both refusal states.<\u002Fb> Unreachable: a restore is an add, adds price contention rather than refusing it, and this row already passed every gate an add has.<\u002Fdiv>\n      <div style=\"font-size:13px;color:#A89B84;line-height:1.6;\"><b style=\"color:#EDE6D8;font-weight:600;\">The <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;\">claimed<\u002Fspan> tag word.<\u002Fb> R2's one new word in the whole feature. It named a refusal. <b style=\"color:#EDE6D8;font-weight:600;\">R3 introduces no new vocabulary at all.<\u002Fb><\u002Fdiv>\n      <div style=\"font-size:13px;color:#A89B84;line-height:1.6;\"><b style=\"color:#EDE6D8;font-weight:600;\">The commander row's empty-control variant.<\u002Fb> A commander is not a <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;\">deck_cards<\u002Fspan> row, so it never appears under <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;\">Going out<\u002Fspan> to begin with.<\u002Fdiv>\n      <div style=\"font-size:13px;color:#A89B84;line-height:1.6;\"><b style=\"color:#EDE6D8;font-weight:600;\">The 32px shared slot.<\u002Fb> It existed to put two refused rows' prices in a column. One price does not need a column.<\u002Fdiv>\n      <div style=\"font-size:13px;color:#A89B84;line-height:1.6;\"><b style=\"color:#EDE6D8;font-weight:600;\">The <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;\">Pull it → Pull<\u002Fspan> demotion.<\u002Fb> It bought a refused row one line at 390px. <b style=\"color:#EDE6D8;font-weight:600;\">R3 touches no shipped control<\u002Fb> — the pull keeps its border and its pronoun.<\u002Fdiv>\n      <div style=\"font-size:13px;color:#A89B84;line-height:1.6;\"><b style=\"color:#EDE6D8;font-weight:600;\">“A refusal is a route into the pull flow”<\u002Fb> (R2 §7/§9), and the whole three-outcome framing of pull / buy / leave it out.<\u002Fdiv>\n      <div style=\"font-size:13px;color:#A89B84;line-height:1.6;\"><b style=\"color:#EDE6D8;font-weight:600;\">The money case.<\u002Fb> <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;\">8 to buy · $254.10 → 9 to buy · $263.00<\u002Fspan> comes off the canvas. See <a href=\"#money\">4<\u002Fa> — it was wrong twice over.<\u002Fdiv>\n      <div style=\"font-size:13px;color:#A89B84;line-height:1.6;\"><b style=\"color:#EDE6D8;font-weight:600;\">The in-flight state.<\u002Fb> Not asked for. Its only job was holding a row for a refusal to land on. See <a href=\"#whyoptimistic\">3<\u002Fa>.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size:13px;color:#C6B79A;line-height:1.6;margin-top:13px;padding-top:13px;border-top:1px solid #2A241D;\"><b style=\"color:#EDE6D8;font-weight:600;\">Kept, and not re-opened:<\u002Fb> <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;\">Going out<\u002Fspan> ships alone with #185 untouched · the restored row leaves the list · the focus ruling · the two clocks · two labels · no bulk restore · no motion · no expiry warning · nothing blocks on the cap · <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;\">review.outNote<\u002Fspan>'s edit.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <section data-screen-label=\"01\" style=\"max-width:1400px;margin-bottom:44px;\">\n    <div style=\"display:flex;align-items:baseline;gap:12px;margin-bottom:6px;flex-wrap:wrap;\">\n      <h2 style=\"font-family:'Cinzel',serif;font-weight:700;font-size:24px;margin:0;color:#EDE6D8;\">1 · Going out, with Put back<\u002Fh2>\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#C9A24B;\">the whole of R3 · /decks/[id]/changes<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"max-width:1040px;font-size:14px;line-height:1.7;color:#A89B84;margin:0 0 18px;\">One link in an action slot reserved and empty since R1.2. <b style=\"color:#EDE6D8;font-weight:600;\">Every row carries it and every row's is live<\u002Fb> — there is no variant, no guard, no tag and no absent control. The pull rows in the other column keep <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;\">Pull it<\u002Fspan> exactly as shipped.<\u002Fp>\n\n    <div style=\"background:#14110E;border:1px solid #2A241D;border-radius:14px;padding:22px 24px;\">\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;\">\n        <div style=\"display:flex;align-items:center;gap:8px;background:#1E1A15;border:1px solid #3A3229;border-radius:999px;padding:6px 14px;\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#6FA368;\">19<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#C6B79A;\">in<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px;background:#1E1A15;border:1px solid #3A3229;border-radius:999px;padding:6px 14px;\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#E0913C;\">17<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#C6B79A;\">out<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px;background:#1E1A15;border:1px solid #3A3229;border-radius:999px;padding:6px 14px;\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#E0913C;\">8<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#C6B79A;\">to buy<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#E0913C;\">$254.10<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px;background:#1E1A15;border:1px solid #3A3229;border-radius:999px;padding:6px 14px;\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#C9A24B;\">5<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#C6B79A;\">can be pulled<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:1px solid #2A241D;padding-bottom:10px;margin-bottom:10px;max-width:660px;\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#E0913C;\">Going out · 17<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:#6A6152;\">all back in the pool on commit<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font-size:12.5px;color:#A89B84;line-height:1.6;max-width:660px;margin-bottom:16px;\">All 17 go back in the pool when you commit. <b style=\"color:#EDE6D8;font-weight:600;\">Put one back and it never left<\u002Fb> — the deck takes its copy again if it is still free.<\u002Fdiv>\n\n      <div style=\"max-width:660px;\">\n        <div style=\"display:flex;align-items:baseline;gap:10px;border-bottom:1px solid #574463;padding-bottom:7px;margin-bottom:9px;\"><span style=\"font-family:'Cinzel',serif;font-weight:700;font-size:14px;letter-spacing:0.04em;text-transform:uppercase;color:#EDE6D8;\">Creatures<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8E8269;\">7<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:4px;margin-bottom:16px;\">\n          <div style=\"min-height:44px;background:#1A1713;border:1px solid #26211B;border-radius:7px;padding:0 6px 0 9px;display:flex;al v>\n          <div style=\"min-height:44px;background:#1A1713;border:1px solid #26211B;border-radius:7px;padding:0 6px 0 9px;display:flex;align-items:center;gap:9px;\"><span style=\"width:7px;height:7px;border-radius:999px;background:#6FA368;flex:none;\"><\u002Fspan><span style=\"font-size:13px;color:#EDE6D8;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">Lotleth Troll<\u002Fspan><span style=\"display:flex;align-items:center;justify-content:flex-end;gap:3px;width:90px;flex:none;\"><span style=\"width:18px;height:18px;border-radius:999px;background:#2A241D;border:1px solid #3A3229;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#C6B79A;flex:none;\">1<\u002Fspan><span style=\"width:11px;height:11px;border-radius:999px;background:#5B5566;flex:none;\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:999px;background:#6B9E63;flex:none;\"><\u002Fspan><\u002Fspan><span style=\"font-family:'IBM Plex Sans';font-weight:600;font-size:12px;color:#C9A24B;padding:0 3px;min-height:34px;display:flex;align-items:center;flex:none;\">Put back<\u002Fspan><\u002Fdiv>\n          <div style=\"min-height:44px;background:#1A1713;border:1px solid #26211B;border-radius:7px;padding:0 6px 0 9px;display:flex;align-items:center;gap:9px;\"><span style=\"width:7px;height:7px;border-radius:999px;background:#6FA368;flex:none;\"><\u002Fspan><span style=\"font-size:13px;color:#EDE6D8;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">Necrotic Ooze<\u002Fspan><span style=\"display:flex;align-items:center;justify-content:flex-end;gap:3px;width:90px;flex:none;\"><span style=\"width:18px;height:18px;border-radius:999px;background:#2A241D;border:1px solid #3A3229;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#C6B79A;flex:none;\">2<\u002Fspan><span style=\"width:11px;height:11px;border-radius:999px;background:#5B5566;flex:none;\"><\u002Fspan><\u002Fspan><span style=\"font-family:'IBM Plex Sans';font-weight:600;font-size:12px;color:#C9A24B;padding:0 3px;min-height:34px;display:flex;align-items:center;flex:none;\">Put back<\u002Fspan><\u002Fdiv>\n          <div style=\"min-height:44px;background:#1A1713;border:1px solid #26211B;border-radius:7px;padding:0 6px 0 9px;display:flex;align-items:center;gap:9px;\"><span style=\"width:7px;height:7px;border-radius:999px;background:#6FA368;flex:none;\"><\u002Fspan><span style=\"font-size:13px;color:#EDE6D8;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">Sidisi, Brood Tyrant<\u002Fspan><span style=\"display:flex;align-items:center;justify-content:flex-end;gap:3px;width:90px;flex:none;\"><span style=\"width:18px;height:18px;border-radius:999px;background:#2A241D;border:1px solid #3A3229;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#C6B79A;flex:none;\">1<\u002Fspan><span style=\"width:11px;height:11px;border-radius:999px;background:#5B5566;flex:none;\"><\u002Fspan><\u002Fspan><span style=\"font-family:'IBM Plex Sans';font-weight:600;font-size:12px;color:#C9A24B;padding:0 3px;min-height:34px;display:flex;align-items:center;flex:none;\">Put back<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;align-items:baseline;gap:10px;border-bottom:1px solid #574463;padding-bottom:7px;margin-bottom:9px;\"><span style=\"font-family:'Cinzel',serif;font-weight:700;font-size:14px;letter-spacing:0.04em;text-transform:uppercase;color:#EDE6D8;\">Lands<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8E8269;\">1<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:4px;\">\n          <div style=\"min-height:44px;background:#1A1713;border:1px solid #26211B;border-radius:7px;padding:0 6px 0 9px;display:flex;align-items:center;gap:9px;\"><span style=\"width: flex-wrap:wrap;\">\n      <h2 style=\"font-family:'Cinzel',serif;font-weight:700;font-size:24px;margin:0;color:#EDE6D8;\">4 · The edges<\u002Fh2>\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#8E8269;\">a restore can dissolve the surface it sits on<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px;max-width:1400px;\">\n      <div style=\"background:#181410;border:1px solid #3A3229;border-left:3px solid #6FA368;border-radius:12px;padding:16px 18px;\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#6FA368;margin-bottom:9px;\">No money moves. Ever.<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#E0913C;\">8 to buy · $254.10<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#6A6152;\">unchanged by any restore<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:13px;color:#A89B84;line-height:1.65;\"><b style=\"color:#EDE6D8;font-weight:600;\">R2's headline money case was wrong twice over<\u002Fb>, and the second reason is the deeper one. The money block is scoped to <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;\">draftDiff.adds<\u002Fspan> — but that scoping is not why nothing happens. <b style=\"color:#EDE6D8;font-weight:600;\">A restored card is in neither list:<\u002Fb> putting a cut back returns the draft to <i>no change<\u002Fi> on that card, so it leaves <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;\">Going out<\u002Fspan> and never enters <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;\">Coming in<\u002Fspan>. <b style=\"color:#EDE6D8;font-weight:600;\">Nothing is bought, because the deck already holds it.<\u002Fb><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#181410;border:1px solid #3A3229;border-radius:12px;padding:16px 18px;\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#8E8269;margin-bottom:9px;\">Restoring the last remove<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#E0913C;\">1 out<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#3A3229;\">→<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#6A6152;\">Going out is absent<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:13px;color:#A89B84;line-height:1.65;\">The whole column goes, the <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;\">out<\u002Fspan> chip with it, and <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;\">Coming in<\u002Fspan> takes the full width — matrix state 17, already specified, reached by a new route. <b style=\"color:#EDE6D8;font-weight:600;\">No count of nought is ever drawn.<\u002Fb><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#181410;border:1px solid #3A3229;border-radius:12px;padding:16px 18px;\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#8E8269;margin-bottom:9px;\">Restoring the last <i>change<\u002Fi><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#E0913C;\">−1<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#3A3229;\">→<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#6A6152;\">the banner is not there<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:13px;color:#A89B84;line-height:1.65;\">The draft equals v2 again, so the banner, the caption and the review route all cease — matrix state 12, and the route <b style=\"color:#EDE6D8;font-weight:600;\">redirects to the deck page<\u002Fb> per state 25. <b style=\"color:#EDE6D8;font-weight:600;\">A restore is the only control in the feature that can delete the surface it sits on<\u002Fb>, and now the only one that does it without asking.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#181410;border:1px solid #3A3229;border-radius:12px;padding:16px 18px;\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#8E8269;margin-bottom:9px;\">Over the cap after a restore<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#E0913C;\">102 / 99 · 3 over<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:13px;color:#A89B84;line-height:1.65;\">Putting a card back can push a deck further over 99. <b style=\"color:#EDE6D8;font-weight:600;\">Nothing is blocked and nothing warns<\u002Fb> — the shipped over-99 count moves and that is all. <b style=\"color:#EDE6D8;font-weight:600;\">The cap is a status, not a refusal<\u002Fb>, confirmed by the audit.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#181410;border:1px solid #3A3229;border-radius:12px;padding:16px 18px;\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#8E8269;margin-bottom:9px;\">Another deck holds the copy<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#6FA368;\">restores anyway<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:13px;color:#A89B84;line-height:1.65;\">The row restores and no tag appears. <b style=\"color:#EDE6D8;font-weight:600;\">The deck is taking back a copy it already owns<\u002Fb>, so there is nothing to contend for — and making <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;\">Put back<\u002Fspan> refuse would make a restore <i>stricter<\u002Fi> than adding the same card from the deck page one route away.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#181410;border:1px solid #3A3229;border-radius:12px;padding:16px 18px;\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#8E8269;margin-bottom:9px;\">Discard is untouched<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#C6533F;\">Discard 36 changes?<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:13px;color:#A89B84;line-height:1.65;\">Still the confirm, still unrecoverable, still naming the number and the version it lands on. <b style=\"color:#EDE6D8;font-weight:600;\">The restore does not make discard safer and must not be sold as making it so<\u002Fb> — what changed is that discard is no longer the only reversal.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#181410;border:1px solid #3A3229;border-radius:12px;padding:16px 18px;\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#8E8269;margin-bottom:9px;\">After a commit<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#6A6152;\">no restore anywhere<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:13px;color:#A89B84;line-height:1.65;\">The cut is a version boundary now. The v2→v3 diff shows it under <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;\">Out<\u002Fspan> with <b style=\"color:#EDE6D8;font-weight:600;\">no dot, no price and no control<\u002Fb>, as specified. <b style=\"color:#EDE6D8;font-weight:600;\">“No restore, no revert, no rollback” in history is unchanged.<\u002Fb><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#181410;border:1px solid #3A3229;border-radius:12px;padding:16px 18px;\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#8E8269;margin-bottom:9px;\">A cut, then a reload<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#6A6152;\">#185's receipt is gone; Going out is not<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:13px;color:#A89B84;line-height:1.65;\">The spent slot is decklist state and does not survive the route. <b style=\"color:#EDE6D8;font-weight:600;\">Every cut is still under <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;\">Going out<\u002Fspan><\u002Fb>, so nothing was lost — only the shortcut. This is the clearest case for shipping both, and why no surface warns about a window closing.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#181410;border:1px solid #3A3229;border-radius:12px;padding:16px 18px;\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#8E8269;margin-bottom:9px;\">An un-add<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#6A6152;\">not in Going out at all<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:13px;color:#A89B84;line-height:1.65;\">Cut a card this draft added and <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;\">draftDiff<\u002Fspan> files it as <b style=\"color:#EDE6D8;font-weight:600;\">no change<\u002Fb> — it was never in v2, so nothing went out and no row appears. <b style=\"color:#EDE6D8;font-weight:600;\">#185's receipt still covers the tap.<\u002Fb> Note this is the same mechanism as the money case: a restore produces exactly this no-change state.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <sc-if value=\"{{ showEngNotes }}\" hint-placeholder-val=\"{{ true }}\">\n  <section data-screen-label=\"05\" style=\"max-width:1400px;margin-bottom:20px;\">\n    <div style=\"display:flex;align-items:baseline;gap:12px;margin-bottom:16px;flex-wrap:wrap;\">\n      <h2 style=\"font-family:'Cinzel',serif;font-weight:700;font-size:24px;margin:0;color:#EDE6D8;\">5 · The contract<\u002Fh2>\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#8E8269;\">one link, one edited string, one focus ruling<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;gap:18px;flex-wrap:wrap;\">\n      <div style=\"flex:1;min-width:320px;background:#1A160F;border:1px solid #2A241D;border-radius:12px;padding:16px 18px;\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#8E8269;margin-bottom:12px;\">The whole inventory<\u002Fdiv>\n        <div style=\"background:#1A1713;border:1px solid #26211B;border-radius:9px;padding:12px 14px;margin-bottom:10px;\"><div style=\"display:flex;align-items:center;gap:10px;margin-bottom:7px;flex-wrap:wrap;\"><span style=\"font-family:'IBM Plex Sans';font-weight:600;font-size:12px;color:#C9A24B;padding:0 3px;min-height:34px;display:flex;align-items:center;\">Put back<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:#6FA368;\">the only new thing in R3<\u002Fspan><\u002Fdiv><div style=\"font-size:12.5px;color:#A89B84;line-height:1.6;\">Borderless brass link, 12px 600 <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;\">--accent<\u002Fspan>, 34px tall, 44px square target at 390px, right-aligned in the <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;\">Going out<\u002Fspan> row's reserved action slot. Stops propagation. <b style=\"color:#EDE6D8;font-weight:600;\">One variant. No guard, no tag, no disabled state.<\u002Fb> Calls <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;\">addCardToDeck<\u002Fspan> optimistically.<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#161310;border:1px dashed #3A3229;border-radius:9px;padding:12px 14px;\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#6A6152;margin-bottom:7px;\">Not in R3 — nothing else at all<\u002Fdiv><div style=\"font-size:12.5px;color:#8E8269;line-height:1.6;\">No new token, no new hex, no new tag word, no new vocabulary, no new motion class, no client state, no new storage, no new mutation, no modal, no toast, no confirm, no tooltip, no spinner, no disabled state, no guard branch — and <b style=\"color:#C6B79A;font-weight:600;\">no change to any shipped control<\u002Fb>, including <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;\">Pull it<\u002Fspan>, <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;\">decklist-row.tsx<\u002Fspan> and <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;\">deck-card-undo-tile.tsx<\u002Fspan>.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex:1;min-width:320px;background:#1A160F;border:1px solid #2A241D;border-radius:12px;padding:16px 18px;\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#8E8269;margin-bottom:12px;\">Notes for engineering<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:11px;font-size:12.5px;color:#A89B84;line-height:1.6;\">\n          <div><b style=\"color:#EDE6D8;font-weight:600;\">The restore is <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;\">addCardToDeck<\u002Fspan>, unwrapped<\u002Fb> — the same call #185's undo makes. <b style=\"color:#EDE6D8;font-weight:600;\">No new mutation.<\u002Fb> R2's thin-wrapper escape hatch (“justified only if the guard vocabulary cannot name the holding deck”) is withdrawn: there is no holding deck to name.<\u002Fdiv>\n          <div><b style=\"color:#EDE6D8;font-weight:600;\">No refusal enum, and no refusal handling.<\u002Fb> <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;\">DeckAddRejection<\u002Fspan>'s three values are all closed by construction for a row under <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;\">Going out<\u002Fspan>. If one of them ever fires, it is a bug in the diff and not a state to draw.<\u002Fdiv>\n          <div><b style=\"color:#EDE6D8;font-weight:600;\">Optimistic.<\u002Fb> The row leaves on tap. A transport failure returns it and <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;\">MutationError<\u002Fspan> states it — shipped behaviour, not a designed state.<\u002Fdiv>\n          <div><b style=\"color:#EDE6D8;font-weight:600;\">Revalidation needs nothing new:<\u002Fb> <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;\">revalidateClaims<\u002Fspan> is already what <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;\">addCardToDeck<\u002Fspan> calls, per the audit.<\u002Fdiv>\n          <div><b style=\"color:#EDE6D8;font-weight:600;\">Seniority is free.<\u002Fb> <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;\">versions.ts:175<\u002Fspan> inherits <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;\">since<\u002Fspan> at commit by oracle id, so any restore inside a draft preserves it.<\u002Fdiv>\n          <div><b style=\"color:#EDE6D8;font-weight:600;\">No new storage and no client state.<\u002Fb> <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;\">Going out<\u002Fspan> is <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;\">draftDiff.removes<\u002Fspan>.<\u002Fdiv>\n          <div><b style=\"color:#EDE6D8;font-weight:600;\">One shipped string is edited: <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;\">review.outNote<\u002Fspan><\u002Fb>, whose first clause is now false. <b style=\"color:#EDE6D8;font-weight:600;\">R2's second edit is withdrawn<\u002Fb> — <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;\">review.pull<\u002Fspan> (the correct key; R2 twice called it <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;\">pullCta<\u002Fspan>) keeps <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;\">Pull it<\u002Fspan> unchanged.<\u002Fdiv>\n          <div><b style=\"color:#EDE6D8;font-weight:600;\">Flagged, not edited: <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;\">review.lede<\u002Fspan><\u002Fb> — “nothing here is a decision except the pulls” is now wrong by one, though <b style=\"color:#EDE6D8;font-weight:600;\">less wrong than in R2<\u002Fb>: a restore is a decision but never a contended one. A ratification question.<\u002Fdiv>\n          <div><b style=\"color:#EDE6D8;font-weight:600;\">One live-region message per settle:<\u002Fb> <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;\">Necrotic Ooze is back in the deck. 101 cards, 16 going out.<\u002Fspan> <b style=\"color:#EDE6D8;font-weight:600;\">No motion anywhere.<\u002Fb><\u002Fdiv>\n          <div><b style=\"color:#EDE6D8;font-weight:600;\">Focus after a restore:<\u002Fb> the group heading the row left — never the next row's control. <b style=\"color:#EDE6D8;font-weight:600;\">The one ruling carried intact through all three rounds<\u002Fb>, and the only one left.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#1A160F;border:1px solid #2A241D;border-radius:12px;padding:18px 20px;margin-top:18px;\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#8E8269;margin-bottom:12px;\">Card-row parity<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px 26px;font-size:12.5px;color:#A89B84;line-height:1.6;\">\n        <div><b style=\"color:#EDE6D8;font-weight:600;\">Name + one availability slot:<\u002Fb> held trivially. R3 adds no tag, no price and no second marker to any row.<\u002Fdiv>\n        <div><b style=\"color:#EDE6D8;font-weight:600;\">Every addition names what it displaced:<\u002Fb> the <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;\">Going out<\u002Fspan> action slot was <b style=\"color:#EDE6D8;font-weight:600;\">reserved and empty<\u002Fb> since R1.2. Nothing is displaced, and nothing is added to a decklist row.<\u002Fdiv>\n        <div><b style=\"color:#EDE6D8;font-weight:600;\">No row's grid template changes, no row grows, none is two-line<\u002Fb> — at any width. With one label and no refusal variant, <b style=\"color:#EDE6D8;font-weight:600;\">this now holds by construction rather than by measurement.<\u002Fb><\u002Fdiv>\n        <div><b style=\"color:#EDE6D8;font-weight:600;\">Words, never colour alone:<\u002Fb> the only new element is a text label. No hue is load-bearing anywhere in R3.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showEngNotes&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Canvas sections&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return { showEngNotes: this.props.showEngNotes ?? true };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
