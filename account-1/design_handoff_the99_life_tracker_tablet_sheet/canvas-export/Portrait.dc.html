<div style="display:flex;flex-direction:column;gap:10px"><h2 style="margin:0;font:700 30px 'Chakra Petch',sans-serif;color:#E6E8F0">Tablet portrait · 820×1180</h2><p style="margin:0;font-size:15px;line-height:1.6;color:#B1B6C7;max-width:1240px">Held upright, the table turns a quarter (V boards) and the seats sit on the long edges, so your sheet rises from the left edge and takes half the width. Read with the tablet turned to your side, it is the landscape sheet.</p></div><div style="display:flex;flex-direction:column;gap:14px"><span style="font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#E8A25C">Before and after</span><div style="display:flex;gap:36px;align-items:flex-start;flex-wrap:wrap"><figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:420px;flex:none">
<img src="/_blob/fd96a3c5f740fd4fe3a15e5efbbfb997" alt="Now" style="width:420px;height:604px;display:block;border-radius:14px;border:1px solid #262A35">
<figcaption style="display:flex;flex-direction:column;gap:6px">
<p style="margin:0;font:600 15px 'IBM Plex Sans',sans-serif;color:#E6E8F0">Now</p>
<p style="margin:0;font-size:13px;line-height:1.55;color:#959AAD">The full-cover sheet, turned: the art strip and three cards in the left quarter.</p>
</figcaption>
</figure><figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:420px;flex:none">
<img src="/_blob/ffce87fa4ddd8be534407769c1cfa6b1" alt="D5 · Commander damage" style="width:420px;height:604px;display:block;border-radius:14px;border:1px solid #262A35">
<figcaption style="display:flex;flex-direction:column;gap:6px">
<p style="margin:0;font:600 15px 'IBM Plex Sans',sans-serif;color:#E6E8F0">D5 · Commander damage</p>
<p style="margin:0;font-size:13px;line-height:1.55;color:#959AAD">The left half, from your edge. The right half (Colin and Peter) stays in view.</p>
</figcaption>
</figure><figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:420px;flex:none">
<img src="/_blob/ce42eba29f208f917aa2e4c8f359b60d" alt="C2 · Counters" style="width:420px;height:604px;display:block;border-radius:14px;border:1px solid #262A35">
