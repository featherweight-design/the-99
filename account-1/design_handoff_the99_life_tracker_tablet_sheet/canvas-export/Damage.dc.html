<div style="display:flex;flex-direction:column;gap:10px"><h2 style="margin:0;font:700 30px 'Chakra Petch',sans-serif;color:#E6E8F0">Commander damage across seat counts</h2><p style="margin:0;font-size:15px;line-height:1.6;color:#B1B6C7;max-width:1240px">One row of cards at every count, the art filling each. Partners split their card; a seat with no deck gets the plain surface.</p></div><div style="display:flex;flex-direction:column;gap:14px"><span style="font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#E8A25C">Six seats and two</span><div style="display:flex;gap:36px;align-items:flex-start;flex-wrap:wrap"><figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:700px;flex:none">
<img src="/_blob/ead8e429afcd481f6655d407f736fa93" alt="D3 · Six seats, a partner and a seat with no deck" style="width:700px;height:486px;display:block;border-radius:14px;border:1px solid #262A35">
<figcaption style="display:flex;flex-direction:column;gap:6px">
<p style="margin:0;font:600 15px 'IBM Plex Sans',sans-serif;color:#E6E8F0">D3 · Six seats, a partner and a seat with no deck</p>
<p style="margin:0;font-size:13px;line-height:1.55;color:#959AAD">Max plays Bruse Tarl and Ishai: split art, a stepper under each half, 4 from Ishai. Alex has no deck: the plain card and the shipped Commander fallback.</p>
</figcaption>
</figure><figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:700px;flex:none">
<img src="/_blob/8a0c13eb43b88c6c6ec1eed6752927a7" alt="D4 · Two seats (Face to face)" style="width:700px;height:486px;display:block;border-radius:14px;border:1px solid #262A35">
<figcaption style="display:flex;flex-direction:column;gap:6px">
<p style="margin:0;font:600 15px 'IBM Plex Sans',sans-serif;color:#E6E8F0">D4 · Two seats (Face to face)</p>
<p style="margin:0;font-size:13px;line-height:1.55;color:#959AAD">One opponent: the card spans the sheet.</p>
</figcaption>
</figure></div></div><div style="display:flex;flex-direction:column;gap:14px"><span style="font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#E8A25C">A seat at the short end</span><div style="display:flex;gap:36px;align-items:flex-start;flex-wrap:wrap"><figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:700px;flex:none">
<img src="/_blob/879659162137a4aa7291d2c6042a9c68" alt="E1 · Five seats, One at the end: Max's sheet" style="width:700px;height:486px;display:block;border-radius:14px;border:1px solid #262A35">
<figcaption style="display:flex;flex-direction:column;gap:6px">
<p style="margin:0;font:600 15px 'IBM Plex Sans',sans-serif;color:#E6E8F0">E1 · Five seats, One at the end: Max's sheet</p>
<p style="margin:0;font-size:13px;line-height:1.55;color:#959AAD">Max sits at the right end (rot −90). His sheet rises from that edge, 590 deep (half of 1180) and 820 long, so the four cards stack along it. The narrowest damage row of any layout.</p>
</figcaption>
</figure></div></div><div style="display:flex;flex-direction:column;gap:14px"><span style="font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#E8A25C">Desktop (drawn as a tablet, as shipped)</span><div style="display:flex;gap:36px;align-items:flex-start;flex-wrap:wrap"><figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:820px;flex:none">

<figcaption style="display:flex;flex-direction:column;gap:6px">
<p style="margin:0;font:600 15px 'IBM Plex Sans',sans-serif;color:#E6E8F0">D6 · Desktop 1440×900</p>
<p style="margin:0;font-size:13px;line-height:1.55;color:#959AAD">The same half sheet at 450px. A desktop window under 760px tall keeps a 380px floor.</p>
</figcaption>
</figure></div></div>
