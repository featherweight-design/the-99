<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tablet sheet: landscape tabs</title>
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Chakra+Petch:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:1600px;min-height:2470px;box-sizing:border-box;padding:48px 56px 64px;background:#0A0B0F;font-family:'IBM Plex Sans',sans-serif;color:#E6E8F0;display:flex;flex-direction:column;gap:28px">
<div style="display:flex;flex-direction:column;gap:10px"><h2 style="margin:0;font:700 30px 'Chakra Petch',sans-serif;color:#E6E8F0">Tablet landscape · every tab at half height</h2><p style="margin:0;font-size:15px;line-height:1.6;color:#B1B6C7;max-width:1240px">Your sheet, opened from your panel at the bottom left. All five tabs at 1180×820. The panel's height is the same on every tab.</p></div><div style="display:flex;flex-direction:column;gap:14px"><span style="font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#E8A25C">Commander damage, and a sheet opened from the far side</span><div style="display:flex;gap:36px;align-items:flex-start;flex-wrap:wrap"><figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:700px;flex:none">
<img src="art/ts-D1-land.webp" alt="D1 · Your sheet, Commander damage" style="width:700px;height:486px;display:block;border-radius:14px;border:1px solid #262A35">
<figcaption style="display:flex;flex-direction:column;gap:6px">
<p style="margin:0;font:600 15px 'IBM Plex Sans',sans-serif;color:#E6E8F0">D1 · Your sheet, Commander damage</p>
<p style="margin:0;font-size:13px;line-height:1.55;color:#959AAD">You took 6 from Ghalta and 3 from Giada. A count above 0 is in the accent, as the Counters tab does it.</p>
</figcaption>
</figure><figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:700px;flex:none">
<img src="art/ts-D2-top.webp" alt="D2 · Colin's sheet" style="width:700px;height:486px;display:block;border-radius:14px;border:1px solid #262A35">
<figcaption style="display:flex;flex-direction:column;gap:6px">
<p style="margin:0;font:600 15px 'IBM Plex Sans',sans-serif;color:#E6E8F0">D2 · Colin's sheet</p>
<p style="margin:0;font-size:13px;line-height:1.55;color:#959AAD">Opened from Colin's panel across the table: it hangs from his edge, facing him. Your side of the table stays readable.</p>
</figcaption>
</figure></div></div><div style="display:flex;flex-direction:column;gap:14px"><span style="font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#E8A25C">Counters and Tax</span><div style="display:flex;gap:36px;align-items:flex-start;flex-wrap:wrap"><figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:700px;flex:none">
<img src="art/ts-C1-land.webp" alt="C1 · Counters" style="width:700px;height:486px;display:block;border-radius:14px;border:1px solid #262A35">
<figcaption style="display:flex;flex-direction:column;gap:6px">
<p style="margin:0;font:600 15px 'IBM Plex Sans',sans-serif;color:#E6E8F0">C1 · Counters</p>
<p style="margin:0;font-size:13px;line-height:1.55;color:#959AAD">The shipped grid (two toggles, then three across) fits the half sheet with room to spare. Poison 2 set.</p>
</figcaption>
</figure><figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:700px;flex:none">
<img src="art/ts-X1-tax.webp" alt="X1 · Tax" style="width:700px;height:486px;display:block;border-radius:14px;border:1px solid #262A35">
<figcaption style="display:flex;flex-direction:column;gap:6px">
<p style="margin:0;font:600 15px 'IBM Plex Sans',sans-serif;color:#E6E8F0">X1 · Tax</p>
<p style="margin:0;font-size:13px;line-height:1.55;color:#959AAD">Unchanged: the 150×100 art and the next-cast figure.</p>
</figcaption>
</figure></div></div><div style="display:flex;flex-direction:column;gap:14px"><span style="font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#E8A25C">Mana and Table</span><div style="display:flex;gap:36px;align-items:flex-start;flex-wrap:wrap"><figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:700px;flex:none">
<img src="art/ts-X2-mana.webp" alt="X2 · Mana" style="width:700px;height:486px;display:block;border-radius:14px;border:1px solid #262A35">
<figcaption style="display:flex;flex-direction:column;gap:6px">
<p style="margin:0;font:600 15px 'IBM Plex Sans',sans-serif;color:#E6E8F0">X2 · Mana</p>
<p style="margin:0;font-size:13px;line-height:1.55;color:#959AAD">Unchanged: two rows of three.</p>
</figcaption>
</figure><figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:700px;flex:none">
<img src="art/ts-X3-table.webp" alt="X3 · Table" style="width:700px;height:486px;display:block;border-radius:14px;border:1px solid #262A35">
<figcaption style="display:flex;flex-direction:column;gap:6px">
<p style="margin:0;font:600 15px 'IBM Plex Sans',sans-serif;color:#E6E8F0">X3 · Table</p>
<p style="margin:0;font-size:13px;line-height:1.55;color:#959AAD">Table sits beside Mana in the row. Its three rows fit; History opens and scrolls inside the panel.</p>
</figcaption>
</figure></div></div><div style="display:flex;flex-direction:column;gap:14px"><span style="font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#E8A25C">For reference</span><div style="display:flex;gap:36px;align-items:flex-start;flex-wrap:wrap"><figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:460px;flex:none">
<img src="art/ts-X4-closed.webp" alt="The table with no sheet open" style="width:460px;height:320px;display:block;border-radius:14px;border:1px solid #262A35">
<figcaption style="display:flex;flex-direction:column;gap:6px">
<p style="margin:0;font:600 15px 'IBM Plex Sans',sans-serif;color:#E6E8F0">The table with no sheet open</p>
<p style="margin:0;font-size:13px;line-height:1.55;color:#959AAD">The F18 layout the sheet rises over.</p>
</figcaption>
</figure></div></div>
</div>
