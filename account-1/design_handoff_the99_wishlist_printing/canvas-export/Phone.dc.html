<div style="display:flex;flex-direction:column;gap:10px"><h2 style="margin:0;font:700 30px 'Chakra Petch',sans-serif;color:#E6E8F0">Phone · the card window from the Wishlist</h2><p style="margin:0;font-size:15px;line-height:1.6;color:#B1B6C7;max-width:1100px">The R3 card window (printings button, panel over the shelf) opened from a tile. The panel's foot appears only on a card in your wishlist. The full sheet's Wishlist box carries the same Printing line.</p></div><div style="display:flex;flex-direction:column;gap:14px"><span style="font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#FF6FAE">Teaser and panel</span><div style="display:flex;gap:40px;align-items:flex-start"><figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:292px;flex:none">
<img src="/_blob/b88a3068dedb5cf0b1946522da7c91bb" alt="C0 · Opens on the wanted printing" style="width:292px;height:632px;display:block;border-radius:28px;border:1px solid #262A35">
<figcaption style="display:flex;flex-direction:column;gap:6px">
<p style="margin:0;font:600 15px 'IBM Plex Sans',sans-serif;color:#E6E8F0">C0 · Opens on the wanted printing</p>
<p style="margin:0;font-size:13px;line-height:1.55;color:#959AAD">From the Swords tile: the art, price and set line are SLD 2125's, as on the tile.</p>
</figcaption>
</figure><figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:292px;flex:none">
<img src="/_blob/0de4f711b6db15aa31b645a7261bb2b4" alt="C1 · Choose" style="width:292px;height:632px;display:block;border-radius:28px;border:1px solid #262A35">
<figcaption style="display:flex;flex-direction:column;gap:6px">
<p style="margin:0;font:600 15px 'IBM Plex Sans',sans-serif;color:#E6E8F0">C1 · Choose</p>
<p style="margin:0;font-size:13px;line-height:1.55;color:#959AAD">Panel open, SLD 2125 selected (R3 preview). Foot: Wanted: any printing, and Want SLD 2125.</p>
</figcaption>
</figure><figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:292px;flex:none">
<img src="/_blob/0ebaeef2612c8f847d73855c29f5acc1" alt="C2 · Chosen" style="width:292px;height:632px;display:block;border-radius:28px;border:1px solid #262A35">
<figcaption style="display:flex;flex-direction:column;gap:6px">
<p style="margin:0;font:600 15px 'IBM Plex Sans',sans-serif;color:#E6E8F0">C2 · Chosen</p>
<p style="margin:0;font-size:13px;line-height:1.55;color:#959AAD">The thumb gains the bookmark; the foot now reads Wanted: SLD 2125, with Any printing to go back. The panel stays open, as R3's does.</p>
</figcaption>
</figure></div></div><div style="display:flex;flex-direction:column;gap:14px"><span style="font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#FF6FAE">Full sheet · Wishlist box</span><div style="display:flex;gap:40px;align-items:flex-start"><figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:292px;flex:none">
<img src="/_blob/1a495edd4bbe85883ddb617dd806f24c" alt="C3 · Any printing" style="width:292px;height:632px;display:block;border-radius:28px;border:1px solid #262A35">
<figcaption style="display:flex;flex-direction:column;gap:6px">
<p style="margin:0;font:600 15px 'IBM Plex Sans',sans-serif;color:#E6E8F0">C3 · Any printing</p>
<p style="margin:0;font-size:13px;line-height:1.55;color:#959AAD">Printing · Any printing · cheapest. No press until another printing is on screen.</p>
</figcaption>
</figure><figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:292px;flex:none">
<img src="/_blob/af19eb3de05c550ac8f9e4578bb4e09d" alt="C4 · A chosen printing" style="width:292px;height:632px;display:block;border-radius:28px;border:1px solid #262A35">
<figcaption style="display:flex;flex-direction:column;gap:6px">
<p style="margin:0;font:600 15px 'IBM Plex Sans',sans-serif;color:#E6E8F0">C4 · A chosen printing</p>
<p style="margin:0;font-size:13px;line-height:1.55;color:#959AAD">Thumb, SLD 2125 · $24.50, and Any printing. The link-out names the printing.</p>
</figcaption>
</figure><figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:292px;flex:none">
<img src="/_blob/d1b9c5f4931a3d3db440d2349b910493" alt="C5 · Chosen, sold out" style="width:292px;height:632px;display:block;border-radius:28px;border:1px solid #262A35">
<figcaption style="display:flex;flex-direction:column;gap:6px">
<p style="margin:0;font:600 15px 'IBM Plex Sans',sans-serif;color:#E6E8F0">C5 · Chosen, sold out</p>
<p style="margin:0;font-size:13px;line-height:1.55;color:#959AAD">SLD 2125 · sold out, and the note with the cheapest figure. The link-out falls back to any printing.</p>
</figcaption>
</figure></div></div>
