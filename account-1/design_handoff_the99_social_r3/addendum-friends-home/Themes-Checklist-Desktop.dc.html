<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Friends row on the checklist at 1280, six themes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=Cinzel:wght@500;600;700&amp;family=Chakra+Petch:wght@500;600;700&amp;family=Trirong:wght@500;600;700&amp;family=Syncopate:wght@400;700&amp;family=Cormorant+Garamond:wght@500;600;700&amp;family=Metamorphous&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width:1300px;height:2640px;box-sizing:border-box;padding:40px;background:#0B0B0D;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;gap:28px">
  <sc-for list="{{ rows }}" as="r" hint-placeholder-count="6">
    <div style="display:flex;flex-direction:column;gap:10px">
      <span style="display:flex;gap:12px;align-items:baseline"><span style="{{ r.nameStyle }}">{{ r.name }}</span><span style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;color:#8E8E98">{{ r.plane }} · not done, link open, done</span></span>
      <div style="{{ r.panel }}">
        <dc-import name="ChecklistRow" theme="{{ r.key }}" state="todo" context="{{ true }}" phone="{{ false }}" hint-size="1162px,150px"></dc-import>
        <dc-import name="ChecklistRow" theme="{{ r.key }}" state="link" context="{{ false }}" phone="{{ false }}" hint-size="1162px,70px"></dc-import>
        <dc-import name="ChecklistRow" theme="{{ r.key }}" state="done" context="{{ false }}" phone="{{ false }}" hint-size="1162px,70px"></dc-import>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1300,"height":2640}}'>
class Component extends DCLogic {
  renderVals() {
    const THEMES = [
      ['amonkhet', 'Low Sun', 'AMONKHET', '#14110E', '#3A3229', "'Cinzel',serif", 700],
      ['kamigawa', 'Neon Rain', 'KAMIGAWA', '#0E0F14', '#262A35', "'Chakra Petch',sans-serif", 700],
      ['ixalan', 'Canopy', 'IXALAN', '#0E1310', '#2C3830', "'Trirong',serif", 700],
      ['phyrexia', 'Oil Haze', 'NEW PHYREXIA', '#0D0B0E', '#262329', "'Syncopate',sans-serif", 700],
      ['eldraine', 'Witching Hour', 'WILDS OF ELDRAINE', '#120E17', '#342C41', "'Cormorant Garamond',serif", 700],
      ['kaldheim', 'First Frost', 'KALDHEIM', '#121217', '#2E3340', "'Metamorphous',serif", 400],
    ];
    const rows = THEMES.map(([key, name, plane, bg, strong, disp, dw]) => ({
      key, name, plane,
      nameStyle: `font-family:${disp};font-weight:${dw};font-size:20px;color:#E8E8EC`,
      panel: `width:1218px;box-sizing:border-box;padding:20px 28px;border-radius:12px;background:${bg};box-shadow:0 0 0 1px ${strong};display:flex;flex-direction:column;gap:12px`,
    }));
    return { rows };
  }
}
</script>
</body>
</html>
