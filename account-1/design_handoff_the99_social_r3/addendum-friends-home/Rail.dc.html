<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Part · Rail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=Cinzel:wght@500;600;700&amp;family=Chakra+Petch:wght@500;600;700&amp;family=Trirong:wght@500;600;700&amp;family=Syncopate:wght@400;700&amp;family=Cormorant+Garamond:wght@500;600;700&amp;family=Metamorphous&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<aside aria-label="Primary" style="{{ frame }}">
  <div style="display:flex;flex-direction:column;align-items:center;gap:3px;margin-bottom:20px">
    <div style="display:flex;align-items:center;gap:3px"><span style="{{ d1 }}"></span><span style="{{ d2 }}"></span><span style="{{ d1 }}"></span></div>
    <span style="{{ mark }}">99</span>
  </div>
  <nav style="display:flex;flex-direction:column;gap:4px">
    <sc-for list="{{ items }}" as="it" hint-placeholder-count="5">
      <a href="#" aria-label="{{ it.label }}" style="{{ it.style }}">
        <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="{{ it.d }}"></path></svg>
        <span style="{{ it.lock }}"><svg width="8" height="10" viewBox="0 0 10 12" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="1" y="5" width="8" height="6" rx="1.2"></rect><path d="M3 5V3.5a2 2 0 0 1 4 0V5"></path></svg></span>
      </a>
    </sc-for>
  </nav>
  <span style="{{ acct }}">HD</span>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["amonkhet","kamigawa","ixalan","phyrexia","eldraine","kaldheim"],"default":"amonkhet"},"locked":{"editor":"boolean","default":false},"h":{"editor":"int","default":900},"$preview":{"width":62,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const TH = {
      amonkhet: { rail:'#1A1611', surface:'#1E1A15', elevated:'#29241F', border:'#2B241B', strong:'#3A3229', fg:'#EDE6D8', muted:'#A59C89', faint:'#8B8270', locked:'#6E6654', accent:'#CF8745', disp:"'Cinzel',serif", dw:700 },
      kamigawa: { rail:'#12141B', surface:'#16181F', elevated:'#20222A', border:'#181C26', strong:'#262A35', fg:'#E6E8F0', muted:'#959AAD', faint:'#6F7486', locked:'#606476', accent:'#FF4D9A', disp:"'Chakra Petch',sans-serif", dw:700 },
      ixalan:   { rail:'#121814', surface:'#171E19', elevated:'#212A23', border:'#1D2620', strong:'#2C3830', fg:'#E0E7DE', muted:'#98A695', faint:'#808C7C', locked:'#626E5E', accent:'#A3C445', disp:"'Trirong',serif", dw:700 },
      phyrexia: { rail:'#110F13', surface:'#151317', elevated:'#1E1C20', border:'#19161C', strong:'#262329', fg:'#E4E2E6', muted:'#9A96A0', faint:'#78747E', locked:'#64616A', accent:'#52827A', disp:"'Syncopate',sans-serif", dw:700 },
      eldraine: { rail:'#15121B', surface:'#1B1821', elevated:'#26232C', border:'#241D30', strong:'#342C41', fg:'#E4DEEE', muted:'#9C95A8', faint:'#898395', locked:'#6A6475', accent:'#AE88E6', disp:"'Cormorant Garamond',serif", dw:700 },
      kaldheim: { rail:'#181920', surface:'#1E1F26', elevated:'#2D2E35', border:'#1A1F2B', strong:'#2E3340', fg:'#C6D2D3', muted:'#95A4A6', faint:'#7C8A8C', locked:'#5F6D6E', accent:'#5C86C9', disp:"'Metamorphous',serif", dw:400 },
    };
    const p = this.props;
    const t = TH[p.theme] || TH.amonkhet;
    const locked = p.locked === true || p.locked === 'true';
    const defs = [
      ['home', 'Home', 'M3.5 9 10 4l6.5 5v7.5h-4.25v-4.5h-4.5v4.5H3.5z'],
      ['collection', 'Collection', 'M3.5 3.5h5v5h-5zM11.5 3.5h5v5h-5zM3.5 11.5h5v5h-5zM11.5 11.5h5v5h-5z'],
      ['commanders', 'Commanders', 'M3 14 4.5 6l3.5 3.5L10 5l2 4.5L15.5 6 17 14zM3 16.5h14'],
      ['discover', 'Discover', 'M10 3a7 7 0 1 0 0 14a7 7 0 1 0 0-14zM10 6.5 13.5 10 10 13.5 6.5 10z'],
      ['decks', 'Decks', 'M4 6.5h9.5v10.5H4zM6.5 3.5h9.5v10.5'],
    ];
    // At first run Commanders, Discover and Decks sit in the lock well (Collection is open with the no-collection entry).
    const items = defs.map(([k, label, d], i) => {
      const isLocked = locked && i >= 2;
      return {
        label: isLocked ? `${label}, locked` : label, d,
        style: 'position:relative;display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;' +
          (k === 'home' ? `background:${t.elevated};color:${t.fg};` : isLocked ? `background:transparent;color:${t.locked};` : `background:transparent;color:${t.faint};`),
        lock: isLocked ? `position:absolute;right:3px;bottom:3px;display:flex;color:${t.locked}` : 'display:none',
      };
    });
    const dia = (n) => `width:${n}px;height:${n}px;background:${t.accent};transform:rotate(45deg)`;
    return {
      items,
      frame: `width:62px;height:${Number(p.h ?? 900)}px;box-sizing:border-box;padding:14px 0;background:${t.rail};border-right:1px solid ${t.border};display:flex;flex-direction:column;align-items:center`,
      d1: dia(6), d2: dia(8.5),
      mark: `font-family:${t.disp};font-weight:${t.dw};font-size:22px;line-height:1;color:${t.fg}`,
      acct: `margin-top:auto;display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:999px;background:${t.surface};border:1px solid ${t.strong};box-sizing:border-box;font-family:'IBM Plex Mono',monospace;font-size:11px;color:${t.muted}`,
    };
  }
}
</script>
</body>
</html>
