<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home at 390: P1 to P4</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=Cinzel:wght@500;600;700&amp;family=Chakra+Petch:wght@500;600;700&amp;family=Trirong:wght@500;600;700&amp;family=Syncopate:wght@400;700&amp;family=Cormorant+Garamond:wght@500;600;700&amp;family=Metamorphous&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width:1840px;height:2260px;box-sizing:border-box;padding:40px;background:#0B0B0D;font-family:'IBM Plex Sans',sans-serif;display:flex;gap:60px;align-items:flex-start">
  <sc-for list="{{ frames }}" as="f" hint-placeholder-count="4">
    <div style="width:390px;display:flex;flex-direction:column;gap:12px">
      <div style="height:84px;display:flex;flex-direction:column;gap:5px">
        <span style="display:flex;gap:12px;align-items:baseline"><span style="font-family:'IBM Plex Mono',monospace;font-size:15px;letter-spacing:.08em;color:#E8E8EC">{{ f.id }}</span><span style="font-size:15px;color:#E8E8EC">{{ f.title }}</span></span>
        <span style="font-size:13px;line-height:1.45;color:#8E8E98">{{ f.note }}</span>
      </div>
      <div style="width:390px;border-radius:20px;overflow:hidden;box-shadow:0 0 0 1px #2A2A30">
        <dc-import name="HomePhone" theme="{{ theme }}" state="{{ f.state }}" banner="{{ f.banner }}" place="{{ f.place }}" hint-size="390px,1960px"></dc-import>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["amonkhet","kamigawa","ixalan","phyrexia","eldraine","kaldheim"],"default":"amonkhet"},"$preview":{"width":1840,"height":2260}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      theme: this.props.theme || 'amonkhet',
      frames: [
        { id: 'P1', title: 'No friends', note: 'After Ready to build, before Pick up where you left off (Hugh’s pick, R2b). The heroes stay first; Commitments stays last.', state: 'none', banner: false, place: 'mid' },
        { id: 'P2', title: 'One friend, banner up', note: 'Colin, then four empty seats: the row spans the width. The banner keeps its place under the header buttons.', state: 'one', banner: true, place: 'mid' },
        { id: 'P3', title: 'Seven friends: the overflow', note: 'Five slots edge to edge: four faces, then +3. All friends › keeps a 44px hit.', state: 'many', banner: false, place: 'mid' },
        { id: 'P4', title: 'A friend link open', note: 'Show opens the shipped sheet on that link. The next empty seat carries the diamond.', state: 'pending', banner: false, place: 'mid' },
      ],
    };
  }
}
</script>
</body>
</html>
