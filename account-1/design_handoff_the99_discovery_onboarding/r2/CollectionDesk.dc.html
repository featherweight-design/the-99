    <div style="padding:10px 28px;display:flex;flex-direction:column;gap:6px">
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="10">
        <div style="height:46px;display:flex;align-items:center;gap:14px;padding:0 16px;border-radius:10px;background:#1E1A15">

            <span style="font-size:13px;color:#8B8270">{{ r.type }}</span>
            <span style="{{ r.tagStyle }}">{{ r.tag }}</span>
          </span>
          <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#A59C89;width:44px;text-align:right">{{ r.set }}</span>
        </div>

    </div>

</x-dc>
