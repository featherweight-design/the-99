<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Part · desktop rail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=Cinzel:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<aside aria-label="Primary" style="{{ frame }}">
  <div style="display:flex;flex-direction:column;align-items:center;gap:3px;margin-bottom:20px">
    <div style="display:flex;align-items:center;gap:3px"><span style="width:6px;height:6px;background:#CF8745;transform:rotate(45deg)"></span><span style="width:8.5px;height:8.5px;background:#CF8745;transform:rotate(45deg)"></span><span style="width:6px;height:6px;background:#CF8745;transform:rotate(45deg)"></span></div>
    <span style="font-family:'Cinzel',serif;font-size:23px;line-height:1;color:#EDE6D8">99</span>
  </div>
  <nav style="display:flex;flex-direction:column;gap:4px">
    <sc-for list="{{ items }}" as="it" hint-placeholder-count="5">
      <span aria-label="{{ it.label }}" style="{{ it.style }}">
        <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="{{ it.d }}"></path></svg>
      </span>
    </sc-for>
  </nav>
  <sc-if value="{{ hasHelp }}" hint-placeholder-val="{{ true }}">
    <button type="button" aria-label="About this screen" aria-expanded="{{ helpOpen }}" style="{{ helpStyle }}">?</button>
  </sc-if>
  <div style="margin-top:{{ acctTop }};padding:3px;border-radius:999px;{{ acctHalo }}">
    <span style="display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:999px;background:#1E1A15;border:1px solid #3A3229;box-sizing:border-box;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#A59C89">HH</span>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","collection","commanders","discover","decks"],"default":"decks"},"halo":{"editor":"enum","options":["none","account","discover"],"default":"none"},"h":{"editor":"int","default":760},"help":{"editor":"enum","options":["none","shown","open"],"default":"shown"},"$preview":{"width":62,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const active = p.active ?? 'decks';
    const halo = p.halo ?? 'none';
    const H = 'box-shadow:0 0 0 2px rgba(207,135,69,.6),0 0 0 6px rgba(207,135,69,.16);';
    const defs = [
      ['home', 'Home', 'M3.5 9 10 4l6.5 5v7.5h-4.25v-4.5h-4.5v4.5H3.5z'],
      ['collection', 'Collection', 'M3.5 3.5h5v5h-5zM11.5 3.5h5v5h-5zM3.5 11.5h5v5h-5zM11.5 11.5h5v5h-5z'],
      ['commanders', 'Commanders', 'M3 14 4.5 6l3.5 3.5L10 5l2 4.5L15.5 6 17 14zM3 16.5h14'],
      ['discover', 'Discover', 'M10 3a7 7 0 1 0 0 14a7 7 0 1 0 0-14zM10 6.5 13.5 10 10 13.5 6.5 10z'],
      ['decks', 'Decks', 'M4 6.5h9.5v10.5H4zM6.5 3.5h9.5v10.5'],
    ];
    const items = defs.map(([k, label, d]) => ({
      label, d,
      style: 'display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;' +
        (k === active ? 'background:#29241F;color:#EDE6D8;' : 'background:transparent;color:#8B8270;') +
        (halo === k ? H : ''),
    }));
    const frame = `width:62px;height:${Number(p.h ?? 760)}px;box-sizing:border-box;padding:14px 0;background:#1A1611;border-right:1px solid #2B241B;display:flex;flex-direction:column;align-items:center`;
    const help = p.help ?? 'shown';
    const helpStyle = 'margin-top:auto;margin-bottom:6px;width:38px;height:38px;border-radius:10px;border:0;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:\'IBM Plex Mono\',monospace;font-size:16px;font-weight:500;' +
      (help === 'open' ? 'background:#29241F;color:#EDE6D8;' : 'background:transparent;color:#8B8270;') + (halo === 'help' ? H : '');
    return { items, frame, acctHalo: halo === 'account' ? H : '', hasHelp: help !== 'none', helpOpen: help === 'open' ? 'true' : 'false', helpStyle, acctTop: help === 'none' ? 'auto' : '0' };
  }
}
</script>
</body>
</html>
