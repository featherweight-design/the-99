          <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#8B8270">{{ g.count }}</span>
        </div>
        <div style="display:flex;gap:12px;overflow:hidden;padding:0 16px">
          <sc-for list="{{ g.tools }}" as="t" hint-placeholder-count="2">
            <div style="flex:none"><dc-import name="ToolCard" tool="{{ t }}" w="300" h="460" hint-size="300px,460px"></dc-import></div>
          </sc-for>
        </div>
      </section>
    </sc-for>
    <div style="margin:34px 16px 0;padding-top:18px;border-top:1px solid #2B241B;display:flex;flex-direction:column;gap:4px">
