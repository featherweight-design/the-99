<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Part · a real phone screen, with a nudge in its own slot</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="{{ frame }}">
  <img src="{{ src }}" alt="{{ alt }}" style="position:absolute;left:0;top:0;width:390px;height:520px;display:block">
  <sc-if value="{{ wipes }}" hint-placeholder-val="{{ false }}">
    <span aria-hidden="true" style="position:absolute;left:233px;top:200px;width:68px;height:77px;box-sizing:border-box;border-radius:7px;border:1px solid #3A3229"></span>
    <span aria-hidden="true" style="position:absolute;left:250px;top:256px;width:36px;height:16px;background:#17140F"></span>
    <span style="position:absolute;left:233px;top:257px;width:68px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:9px;line-height:14px;color:#CF8745">suggest →</span>
  </sc-if>
  <sc-if value="{{ landOff }}" hint-placeholder-val="{{ false }}">
    <span aria-hidden="true" style="position:absolute;left:306px;top:200px;width:68px;height:77px;box-sizing:border-box;border-radius:7px;border:1px solid #2B241B"></span>
    <span aria-hidden="true" style="position:absolute;left:309px;top:255px;width:62px;height:18px;background:#17140F"></span>
    <span style="position:absolute;left:306px;top:257px;width:68px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:9px;line-height:14px;color:#3A3229">—</span>
  </sc-if>
  <sc-if value="{{ money }}" hint-placeholder-val="{{ false }}">
    <span aria-hidden="true" style="position:absolute;left:28px;top:234px;width:200px;height:30px;background:#17140F"></span>
    <span style="position:absolute;left:31px;top:238px;display:flex;align-items:center;white-space:nowrap"><span style="font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:18px;color:#DEAA29;border-bottom:1px solid rgba(222,170,41,.45)">See the 15 in Shopping, 2 over $8</span><span aria-hidden="true" style="margin-left:8px;font-size:12px;color:#A59C89">⟶</span></span>
  </sc-if>
  <sc-if value="{{ hasRing }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="{{ ring }}"></span></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"shot":{"editor":"enum","options":["commanders","collection","deck","shopping","mix","money"],"default":"mix"},"nudge":{"editor":"enum","options":["none","wipes","land-off","money"],"default":"none"},"ring":{"editor":"text","default":""},"$preview":{"width":390,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    const B = { commanders: 'a07790fb47809879c54e8233ccc61968', collection: '7a19fcc9dca0ecaaa2a2016822849b0a', deck: '6330095f882f1f5873032536a86a22c2', shopping: '1a08633c049da2183255c0108593df2d', mix: 'f28d2c468704a19f2957c74e4d01c886', money: '424b78489ba01c0a02e9910da6b56e49' };
    const A = { commanders: 'Commanders on a phone', collection: 'Collection on a phone', deck: 'A deck on a phone', shopping: 'A deck’s Shopping on a phone', mix: 'A deck’s Recommended mix on a phone, at 99 of 99', money: 'A deck’s Money and ownership card on a phone' };
    const p = this.props;
    const shot = B[p.shot] ? p.shot : 'mix';
    const nudge = p.nudge ?? 'none';
    const r = (p.ring ?? '').split(',').map(Number);
    const hasRing = r.length === 4 && r.every((n) => !isNaN(n));
    return {
      src: '/_blob/' + B[shot], alt: A[shot],
      wipes: shot === 'mix' && nudge === 'wipes', landOff: shot === 'mix' && nudge === 'land-off', money: shot === 'money' && nudge === 'money',
      hasRing, ring: hasRing ? `position:absolute;left:${r[0]}px;top:${r[1]}px;width:${r[2]}px;height:${r[3]}px;border-radius:9px;box-shadow:0 0 0 2px rgba(207,135,69,.75),0 0 0 6px rgba(207,135,69,.2);pointer-events:none` : '',
      frame: 'position:relative;width:390px;height:520px;overflow:hidden;background:#14110E;border:1px solid #3A3229;border-radius:18px;box-sizing:border-box',
    };
  }
}
</script>
</body>
</html>
