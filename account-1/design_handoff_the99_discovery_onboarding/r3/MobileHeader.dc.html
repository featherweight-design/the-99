<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Part · phone header, themed, with the ?</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=Cinzel:wght@500;600;700&amp;family=Metamorphous&amp;family=Cormorant+Garamond:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<header style="{{ frame }}">
  <div style="display:flex;align-items:flex-end;gap:3px">
    <span style="{{ the }}">THE</span>
    <span style="{{ word }}">99</span>
  </div>
  <div style="display:flex;align-items:center;gap:6px">
    <button type="button" aria-label="About this screen" style="{{ help }}">?</button>
    <div style="padding:3px;border-radius:15px">
      <span style="{{ acct }}">HH</span>
    </div>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["amonkhet","kaldheim","eldraine"],"default":"amonkhet"},"$preview":{"width":390,"height":79}}'>
class Component extends DCLogic {
  renderVals() {
    const P = {
      amonkhet: { bg:'#14110E', border:'#2B241B', fg:'#EDE6D8', muted:'#A59C89', accent:'#CF8745', disp:"'Cinzel',serif" },
      kaldheim: { bg:'#121217', border:'#1A1F2B', fg:'#C6D2D3', muted:'#95A4A6', accent:'#5C86C9', disp:"'Metamorphous',serif" },
      eldraine: { bg:'#120E17', border:'#241D30', fg:'#E4DEEE', muted:'#9C95A8', accent:'#AE88E6', disp:"'Cormorant Garamond',serif" },
    };
    const t = P[this.props.theme] || P.amonkhet;
    return {
      frame: `width:390px;height:79px;box-sizing:border-box;padding:20px 20px 14px;border-bottom:1px solid ${t.border};background:${t.bg};display:flex;align-items:flex-end;justify-content:space-between;font-family:'IBM Plex Sans',sans-serif`,
      the: `font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.4em;color:${t.accent};padding-bottom:4px`,
      word: `font-family:${t.disp};font-size:24px;line-height:1;color:${t.fg}`,
      help: `width:44px;height:44px;border-radius:12px;border:0;padding:0;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:500;background:transparent;color:${t.muted}`,
      acct: `display:flex;align-items:center;justify-content:center;width:38px;height:38px;box-sizing:border-box;border-radius:12px;background:${t.bg};border:1px solid ${t.accent};font-family:'IBM Plex Mono',monospace;font-size:13px;color:${t.accent}`,
    };
  }
}
</script>
</body>
</html>
