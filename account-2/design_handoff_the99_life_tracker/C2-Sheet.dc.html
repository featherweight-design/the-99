<style>
@font-face{font-family:"Cinzel";src:url(art/cinzel-variable.woff2) format("woff2");font-weight:400 900}
@font-face{font-family:"IBM Plex Sans";src:url(art/ibm-plex-sans-variable.woff2) format("woff2");font-weight:100 700}
@font-face{font-family:"IBM Plex Mono";src:url(art/ibm-plex-mono-500.woff2) format("woff2");font-weight:500}
body{margin:0}
.scr{--bg:#14110E;--surface:#1E1A15;--surface-raised:#211D18;--elevated:#29241F;--border:#2B241B;--border-strong:#3A3229;--fg:#EDE6D8;--fg-body:#C0B8A6;--fg-muted:#A59C89;--fg-faint:#948B78;--accent:#CF8745;--warning:#DEAA29;width:390px;height:844px;background:var(--bg);position:relative;overflow:hidden;font-family:"IBM Plex Sans",system-ui,sans-serif;color:var(--fg)}
.sheet{position:absolute;width:844px;height:390px;left:-227px;top:227px;transform:rotate(-90deg);box-sizing:border-box;padding:18px 22px 16px;display:flex;flex-direction:column;gap:14px;background:var(--surface-raised)}
.hd{display:flex;align-items:center;gap:12px}
.hd img{width:44px;height:44px;border-radius:50%;object-fit:cover}
.hd b{font-family:"Cinzel",serif;font-weight:700;font-size:22px}
.hd i{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--fg-muted)}
.hd .lf{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--fg-body);margin-left:6px}
.x{margin-left:auto;width:44px;height:44px;background:none;border:0;color:var(--fg);font-size:22px;font-family:"IBM Plex Sans",sans-serif}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--border)}
.tabs button{height:44px;padding:0 18px;background:none;border:0;border-bottom:2px solid transparent;color:var(--fg-muted);font-family:"IBM Plex Sans",sans-serif;font-weight:600;font-size:14px;margin-bottom:-1px}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.tabs button em{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--accent);margin-left:5px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;flex:1}
.src{position:relative;overflow:hidden;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);display:flex;flex-direction:column}
.src.hot{box-shadow:inset 0 0 0 1px var(--warning)}
.src img{width:100%;height:70px;object-fit:cover;opacity:.8}
.nm{padding:8px 12px 0;font-size:13px;color:var(--fg-body)}
.nm b{color:var(--fg);font-weight:600}
.stp{flex:1;display:flex;align-items:center;justify-content:center;gap:14px}
.stp button{width:52px;height:52px;border-radius:12px;border:0;background:var(--elevated);box-shadow:inset 0 0 0 1px var(--border-strong);color:var(--fg);font-size:26px;font-family:"IBM Plex Sans",sans-serif}
.stp .v{font-family:"Cinzel",serif;font-weight:700;font-size:48px;min-width:70px;text-align:center;line-height:1}
.hint{height:20px;text-align:center;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--fg-faint);padding-bottom:8px}
.hot .hint{color:var(--warning)}
.note{font-size:12.5px;color:var(--fg-muted)}
</style>
</helmet>
