<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>2c · Setup: I'll pick who goes first</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Cinzel";src:url(art/cinzel-variable.woff2) format("woff2");font-weight:400 900}
@font-face{font-family:"IBM Plex Sans";src:url(art/ibm-plex-sans-variable.woff2) format("woff2");font-weight:100 700}
@font-face{font-family:"IBM Plex Mono";src:url(art/ibm-plex-mono-500.woff2) format("woff2");font-weight:500}
body{margin:0}
.pg{--bg:#14110E;--surface:#1E1A15;--surface-sunken:#18140F;--elevated:#29241F;--border:#2B241B;--border-strong:#3A3229;--border-dashed:#494037;--fg:#EDE6D8;--fg-body:#C0B8A6;--fg-muted:#A59C89;--fg-faint:#948B78;--accent:#CF8745;width:390px;height:844px;box-sizing:border-box;background:var(--bg);font-family:"IBM Plex Sans",system-ui,sans-serif;color:var(--fg);display:flex;flex-direction:column;padding:8px 16px 22px}
.hd{display:flex;align-items:center;height:52px}
.hd h1{margin:0;font-family:"Cinzel",serif;font-weight:700;font-size:22px}
.x{margin-left:auto;width:44px;height:44px;background:none;border:0;color:var(--fg);font-size:22px;font-family:"IBM Plex Sans",sans-serif}
.lead{margin:4px 0 16px;font-size:14px;color:var(--fg-body);line-height:1.45}
.map{position:relative;height:330px;display:flex;justify-content:center;align-items:center}
.phone{width:150px;height:290px;border-radius:22px;background:var(--surface-sunken);box-shadow:inset 0 0 0 1.5px var(--border-dashed);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:5px;padding:7px;box-sizing:border-box}
.phone span{border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border)}
.seat{position:absolute;display:flex;flex-direction:column;align-items:center;gap:4px;width:84px}
.seat button{width:64px;height:64px;border-radius:50%;border:0;padding:0;background:none;box-shadow:0 0 0 2px var(--border-strong);overflow:hidden}
.seat img{width:100%;height:100%;object-fit:cover}
.seat b{font-size:13px;font-weight:600}
.seat.drag button{box-shadow:0 0 0 2px var(--accent),0 8px 20px rgba(0,0,0,.5)}
.l{left:0}.r{right:0}.t{top:46px}.b{top:214px}
.row{display:flex;align-items:center;gap:12px;min-height:56px;border-top:1px solid var(--border)}
.row .k{flex:1;font-size:14.5px;font-weight:600}
.stp{display:flex;align-items:center;gap:6px}
.stp button{width:44px;height:44px;border-radius:10px;border:0;background:var(--elevated);box-shadow:inset 0 0 0 1px var(--border-strong);color:var(--fg);font-size:22px;font-family:"IBM Plex Sans",sans-serif}
.stp .v{font-family:"Cinzel",serif;font-weight:700;font-size:24px;min-width:50px;text-align:center}
.seg{display:flex;border-radius:10px;box-shadow:inset 0 0 0 1px var(--border-strong);padding:3px}
.seg button{height:38px;padding:0 16px;border-radius:8px;border:0;background:none;color:var(--fg-muted);font-family:"IBM Plex Sans",sans-serif;font-weight:600;font-size:14px}
.seg button.on{background:var(--elevated);color:var(--fg);box-shadow:inset 0 0 0 1px var(--accent)}
.go{margin-top:auto;height:52px;border-radius:10px;border:0;background:var(--accent);color:#14110E;font-family:"IBM Plex Sans",sans-serif;font-weight:600;font-size:16px}
.lay{display:flex;align-items:center;gap:12px;min-height:84px;border-top:1px solid var(--border)}
.lay .k{flex:1;font-size:14.5px;font-weight:600}
.opts{display:flex;gap:8px}
.opt{width:64px;height:72px;border-radius:10px;border:0;background:none;box-shadow:inset 0 0 0 1px var(--border-strong);display:flex;align-items:center;justify-content:center;padding:0}
.opt.on{box-shadow:inset 0 0 0 2px var(--accent);background:rgba(207,135,69,.1)}
.mini{width:32px;height:56px;border-radius:6px;box-shadow:inset 0 0 0 1.5px var(--fg-faint);box-sizing:border-box;padding:3px;display:grid;gap:2px}
.mini i{border-radius:2px;background:var(--fg-faint)}
.opt.on .mini{box-shadow:inset 0 0 0 1.5px var(--accent)}.opt.on .mini i{background:var(--accent)}
.m-sides{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.m-around{grid-template-columns:1fr 1fr;grid-template-rows:1fr 2fr 1fr}.m-around i:first-child,.m-around i:last-child{grid-column:1 / -1}
.first button{box-shadow:0 0 0 3px var(--accent),0 0 0 7px rgba(207,135,69,.22)}
.seat em{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--accent);margin-top:-2px}
</style>
</helmet>
<div class="pg">
  <div class="hd"><h1>Set up the game</h1><button class="x" aria-label="Close">✕</button></div>
  <p class="lead">Tap who goes first. Drag a face to move their seat.</p>
  <div class="map">
    <div class="phone" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <div class="seat l t"><button aria-label="Colin. Tap to go first" aria-pressed="false"><img src="art/ghalta.jpg" alt=""></button><b>Colin</b></div>
    <div class="seat l b"><button aria-label="You. Tap to go first" aria-pressed="false"><img src="art/sai.jpg" alt=""></button><b>You</b></div>
    <div class="seat r t first"><button aria-label="Peter goes first. Tap someone else to change it" aria-pressed="true"><img src="art/giada.jpg" alt=""></button><b>Peter</b><em>Goes first</em></div>
    <div class="seat r b"><button aria-label="Max. Tap to go first" aria-pressed="false"><img src="art/gisa.jpg" alt=""></button><b>Max</b></div>
  </div>
  <div class="lay"><span class="k">Table</span><div class="opts" role="radiogroup" aria-label="How the table sits"><button class="opt on" role="radio" aria-checked="true" aria-label="Two long sides, two players each"><span class="mini m-sides"><i></i><i></i><i></i><i></i></span></button><button class="opt" role="radio" aria-checked="false" aria-label="One player on each side"><span class="mini m-around"><i></i><i></i><i></i><i></i></span></button></div></div>
  <div class="row"><span class="k">Starting life</span><div class="stp"><button aria-label="Less starting life">−</button><span class="v">40</span><button aria-label="More starting life">+</button></div></div>
  <div class="row"><span class="k">Who goes first</span><div class="seg"><button aria-pressed="false">Random</button><button class="on" aria-pressed="true">I'll pick</button></div></div>
  <button class="go">Start</button>
</div>
</x-dc>

</html>
