<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>12 · Tablet, 6 players</title>

</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Cinzel";src:url(art/cinzel-variable.woff2) format("woff2");font-weight:400 900}
@font-face{font-family:"IBM Plex Sans";src:url(art/ibm-plex-sans-variable.woff2) format("woff2");font-weight:100 700}
@font-face{font-family:"IBM Plex Mono";src:url(art/ibm-plex-mono-500.woff2) format("woff2");font-weight:500}
body{margin:0}
.scr{--bg:#14110E;--surface:#1E1A15;--elevated:#29241F;--border:#2B241B;--border-strong:#3A3229;--fg:#EDE6D8;--fg-body:#C0B8A6;--fg-muted:#A59C89;--fg-faint:#948B78;--accent:#CF8745;--u:#3A6AA5;width:1180px;height:820px;box-sizing:border-box;padding:10px;background:var(--bg);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:minmax(0,1fr) 64px minmax(0,1fr);gap:10px;position:relative;font-family:"IBM Plex Sans",system-ui,sans-serif;color:var(--fg)}
.cell{position:relative;overflow:hidden;border-radius:18px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border)}
.rot{position:absolute;inset:0}
.flip{transform:rotate(180deg)}
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.6}
.wash{position:absolute;inset:0;background:rgba(20,17,14,.5)}
.pane{position:absolute;inset:0;box-sizing:border-box;padding:16px 18px;display:flex;flex-direction:column-reverse}
.who{display:flex;align-items:baseline;gap:10px;height:24px;white-space:nowrap}
.who b{font-weight:600;font-size:18px}
.who i{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--fg-body)}
.life{position:relative;flex:1;display:flex;align-items:center;justify-content:center}
.half{position:absolute;top:0;bottom:0;width:50%;background:none;border:0;color:var(--fg-muted);font-size:36px;font-family:"IBM Plex Sans",sans-serif;padding:0 8px;display:flex;align-items:center}
.minus{left:0;justify-content:flex-start}.plus{right:0;justify-content:flex-end}
.num{font-family:"Cinzel",serif;font-weight:700;font-size:150px;line-height:1;pointer-events:none;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.foot{display:flex;align-items:center;gap:8px;height:52px}
.bd{display:flex;align-items:center;gap:6px;height:28px;padding:0 11px 0 5px;border-radius:999px;background:rgba(20,17,14,.82);box-shadow:inset 0 0 0 1px var(--border-strong);font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--fg-body)}
.bd img{width:20px;height:20px;border-radius:50%;object-fit:cover}
.bd svg{margin-left:4px}
.bd.acc{color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.mk{margin-left:auto;width:52px;height:52px;border-radius:50%;border:0;background:rgba(20,17,14,.85);box-shadow:inset 0 0 0 1px var(--border-strong);color:var(--fg);display:flex;align-items:center;justify-content:center}
.turn{box-shadow:inset 0 0 0 2px var(--accent)}
.guest{background:#1A2230}
.spine{grid-column:1 / span 3;grid-row:2;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);display:flex;align-items:center;justify-content:center;gap:16px}
.sb{position:relative;width:48px;height:48px;border-radius:50%;border:0;background:var(--elevated);box-shadow:inset 0 0 0 1px var(--border-strong);color:var(--fg-body);display:flex;align-items:center;justify-content:center;font-family:"Cinzel",serif;font-weight:700;font-size:22px}
.sb.t{width:52px;height:52px;color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.sb.on{color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.sb.off{color:var(--fg-faint)}
.sb img{position:absolute;right:-5px;bottom:-5px;width:22px;height:22px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--surface)}
.endt{height:48px;padding:0 20px;border-radius:999px;border:0;background:var(--accent);color:#14110E;font-family:"IBM Plex Sans",sans-serif;font-weight:600;font-size:16px;display:flex;align-items:center;gap:8px}
.rule{width:1px;height:26px;background:var(--border-strong)}
</style>
</helmet>
<div class="scr">
  <div class="cell turn"><div class="rot flip"><img class="art" src="art/ghalta.jpg" alt=""><div class="wash"></div><div class="pane">
    <div class="who"><b>Colin</b><i>Ghalta Stompy</i></div>
    <div class="life"><button class="half minus" aria-label="Colin loses 1 life">−</button><span class="num">27</span><button class="half plus" aria-label="Colin gains 1 life">+</button></div>
    <div class="foot"><button class="endt">End turn<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h12M13 6l6 6-6 6"/></svg></button><button class="mk" aria-label="Colin's sheet"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button></div>
  </div></div></div>
  <div class="cell"><div class="rot flip"><img class="art" src="art/giada.jpg" alt=""><div class="wash"></div><div class="pane">
    <div class="who"><b>Peter</b><i>Giada Angels</i></div>
    <div class="life"><button class="half minus" aria-label="Peter loses 1 life">−</button><span class="num">34</span><button class="half plus" aria-label="Peter gains 1 life">+</button></div>
    <div class="foot"><span class="bd"><img src="art/ghalta.jpg" alt="">Ghalta 6</span><button class="mk" aria-label="Peter's sheet"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button></div>
  </div></div></div>
  <div class="cell"><div class="rot flip"><img class="art" src="art/killian.jpg" alt=""><div class="wash"></div><div class="pane">
    <div class="who"><b>Chris</b><i>Killian · picked for this game</i></div>
    <div class="life"><button class="half minus" aria-label="Chris loses 1 life">−</button><span class="num">40</span><button class="half plus" aria-label="Chris gains 1 life">+</button></div>
    <div class="foot"><button class="mk" aria-label="Chris's sheet"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button></div>
  </div></div></div>
  <div class="spine">
    <div class="sb t" aria-label="Round 2, Colin's turn">2</div>
    <div class="rule"></div>
    <button class="sb on" aria-label="Monarch: Max. Tap to pass it"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 18l2-10 4.5 4L12 5l2.5 7L19 8l2 10z"/></svg><img src="art/gisa.jpg" alt=""></button>
    <button class="sb off" aria-label="Initiative: nobody. Tap to pass it"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/></svg></button>
    <button class="sb on" aria-label="It is day. Tap to make it night"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg></button>
    <button class="sb" aria-label="Roll dice or flip a coin"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3.5"/><circle cx="9" cy="9" r="1.3" fill="currentColor" stroke="none"/><circle cx="15" cy="15" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/></svg></button>
    <div class="rule"></div>
    <button class="sb" aria-label="Undo the last change"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 7L4 12l5 5"/><path d="M4 12h10a5 5 0 010 10h-2"/></svg></button>
  </div>
  <div class="cell"><div class="rot"><img class="art" src="art/sai.jpg" alt=""><div class="wash"></div><div class="pane">
    <div class="who"><b>You</b><i>Sai Thopters</i></div>
    <div class="life"><button class="half minus" aria-label="You lose 1 life">−</button><span class="num">31</span><button class="half plus" aria-label="You gain 1 life">+</button></div>
    <div class="foot"><span class="bd"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="7"/><path d="M12 3v18"/></svg>Poison 2</span><button class="mk" aria-label="Your sheet"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button></div>
  </div></div></div>
  <div class="cell"><div class="rot"><img class="art" src="art/gisa.jpg" alt=""><div class="wash"></div><div class="pane">
    <div class="who"><b>Max</b><i>Gisa Zombies</i></div>
    <div class="life"><button class="half minus" aria-label="Max loses 1 life">−</button><span class="num">38</span><button class="half plus" aria-label="Max gains 1 life">+</button></div>
    <div class="foot"><span class="bd acc"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 18l2-10 4.5 4L12 5l2.5 7L19 8l2 10z"/></svg>Monarch</span><button class="mk" aria-label="Max's sheet"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button></div>
  </div></div></div>
  <div class="cell guest"><div class="rot"><div class="pane">
    <div class="who"><b>Sam</b><i>guest · no deck</i></div>
    <div class="life"><button class="half minus" aria-label="Sam loses 1 life">−</button><span class="num">40</span><button class="half plus" aria-label="Sam gains 1 life">+</button></div>
    <div class="foot"><button class="mk" aria-label="Sam's sheet"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button></div>
  </div></div></div>
</div>
