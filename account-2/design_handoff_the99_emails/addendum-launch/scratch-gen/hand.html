<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:transparent}
.st{position:relative;width:560px;height:540px}
.glow{position:absolute;left:20px;top:10px;width:520px;height:520px;background:radial-gradient(circle closest-side at 50% 50%,rgba(201,162,75,.42),rgba(201,162,75,.12) 60%,rgba(201,162,75,0) 100%)}
.b{position:absolute;left:130px;top:56px;width:300px;height:420px;border-radius:18px;background:#14110E;padding:12px;box-sizing:border-box;display:flex;box-shadow:0 12px 24px rgba(0,0,0,.4),inset 0 0 0 2px #3A3229}
.in{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;border-radius:12px;border:2px solid #4A4035;box-sizing:border-box;background:radial-gradient(circle at 50% 46%,rgba(201,162,75,.25),rgba(30,26,21,0) 72%),#1E1A15}
.w{display:flex;flex-direction:column;align-items:center;gap:14px}
.n{display:flex;flex-direction:column;align-items:center;color:#EDE6D8;font:700 72px/1 'Cinzel',serif}
.cr{display:flex;align-items:center;gap:18px;margin-bottom:16px}
.d{background:#C9A24B;transform:rotate(45deg)}
.wd{font:500 15px 'IBM Plex Mono',monospace;letter-spacing:.35em;color:#C9A24B;padding-left:.35em}
</style></head><body><div class="st"><div class="glow"></div>
<div class="b" style="transform:translate(68px,12px) rotate(11deg)"><div class="in"></div></div>
<div class="b" style="transform:translate(34px,4px) rotate(4deg)"><div class="in"></div></div>
<div class="b" style="transform:translate(-28px,0) rotate(-5deg)"><div class="in"><div class="w"><div class="n"><div class="cr"><div class="d" style="width:14px;height:14px"></div><div class="d" style="width:20px;height:20px"></div><div class="d" style="width:14px;height:14px"></div></div><div>99</div></div><div class="wd">NOW OPEN</div></div></div></div>
</div></body></html>
