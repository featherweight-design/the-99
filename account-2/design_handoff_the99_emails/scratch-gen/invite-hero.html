<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:transparent}
.stage{width:280px;height:270px;position:relative}
.glow{position:absolute;left:10px;top:5px;width:260px;height:260px;border-radius:50%;background:radial-gradient(closest-side,rgba(201,162,75,.42),rgba(201,162,75,.12) 60%,rgba(201,162,75,0))}
.card{position:absolute;width:150px;height:210px;left:65px;top:28px;border-radius:9px;box-sizing:border-box}
.back{background:#14110E;padding:6px;box-shadow:0 6px 12px rgba(0,0,0,.4),inset 0 0 0 1px #3A3229}
.back .in{width:100%;height:100%;border-radius:6px;box-sizing:border-box;border:1px solid #4A4035;background:radial-gradient(120px 130px at 50% 46%,rgba(201,162,75,.25),transparent 72%),repeating-linear-gradient(45deg,rgba(255,255,255,.025) 0 6px,transparent 6px 12px),#1E1A15;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
.hero{display:flex;flex-direction:column;align-items:center;color:#EDE6D8;font:800 36px 'Cinzel',serif;line-height:1}
.hero i{font-style:normal;color:#C9A24B;font-size:9px;letter-spacing:3px;margin-bottom:5px}
.wd{font:500 7.5px 'IBM Plex Mono',monospace;letter-spacing:.35em;color:#C9A24B}
.b1{transform:translate(34px,6px) rotate(11deg)}
.b2{transform:translate(17px,2px) rotate(4deg)}
.front{padding:4px;background:center/cover no-repeat url(ART),#3A3229;box-shadow:0 6px 14px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.5);transform:translate(-14px,0) rotate(-5deg)}
.mtg{width:100%;height:100%;border-radius:7px;background:#14110E;padding:5px;box-sizing:border-box;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.nb{height:17px;flex:none;border-radius:4px;background:#2A241D;display:flex;align-items:center;padding:0 6px;font:700 9px 'Cinzel',serif;color:#EDE6D8}
.art{height:88px;flex:none;border-radius:3px;overflow:hidden}.art img{display:block;width:100%;height:100%;object-fit:cover}
.tyl{height:14px;flex:none;border-radius:3px;background:#2A241D;display:flex;align-items:center;justify-content:space-between;padding:0 6px;font:600 7.5px 'IBM Plex Sans',sans-serif;color:#EDE6D8}
.tx{flex:1;border-radius:3px;background:#1E1A15;padding:5px 6px;font:400 7px/1.4 'IBM Plex Sans',sans-serif;color:#C6B79A}
.ft span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;padding-right:6px}.ft span:last-child{white-space:nowrap}.ft{font:500 5.5px 'IBM Plex Mono',monospace;letter-spacing:.12em;color:#8E8269;display:flex;justify-content:space-between;padding:0 2px;text-transform:uppercase}
.solo{transform:none}
</style></head><body><div class="stage"><div class="glow"></div>
<!--ART-->
</div></body></html>
