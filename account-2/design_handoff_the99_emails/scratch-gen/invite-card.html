<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:transparent}
.box{width:180px;height:240px;display:flex;align-items:center;justify-content:center}
.cw{width:150px;height:210px;border-radius:9px;padding:4px;box-sizing:border-box;background:center/cover no-repeat url(ART),#3A3229;box-shadow:0 5px 10px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.5);transform:rotate(-3deg)}
.mtg{width:100%;height:100%;border-radius:7px;background:#14110E;padding:5px;box-sizing:border-box;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.nb{height:17px;flex:none;border-radius:4px;background:#2A241D;display:flex;align-items:center;padding:0 6px;font:700 9px 'Cinzel',serif;color:#EDE6D8;letter-spacing:.02em}
.art{height:88px;flex:none;border-radius:3px;overflow:hidden}.art img{display:block;width:100%;height:100%;object-fit:cover}
.tyl{height:14px;flex:none;border-radius:3px;background:#2A241D;display:flex;align-items:center;justify-content:space-between;padding:0 6px;font:600 7.5px 'IBM Plex Sans',sans-serif;color:#EDE6D8}
.tx{flex:1;border-radius:3px;background:#1E1A15;padding:5px 6px;font:400 7px/1.4 'IBM Plex Sans',sans-serif;color:#C6B79A}
.ft{font:500 5.5px 'IBM Plex Mono',monospace;letter-spacing:.12em;color:#8E8269;display:flex;justify-content:space-between;padding:0 2px;text-transform:uppercase}
</style></head><body><div class="box"><div class="cw"><div class="mtg">
<div class="nb">NAME</div><div class="art"><img src="ART"></div>
<div class="tyl"><span>Invitation</span><span style="color:#C9A24B">◆</span></div>
<div class="tx">Join The 99 as NAME’s friend. Your decks and your collection stay yours.</div>
<div class="ft"><span>Art · CMDR</span><span>The 99</span></div></div></div></div></body></html>
