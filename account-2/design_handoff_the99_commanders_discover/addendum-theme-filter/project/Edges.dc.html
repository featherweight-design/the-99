<p style="margin:0;font-size:15px;line-height:1.6;color:#B1B6C7;max-width:1500px">The shipped Discover zero state (three diamonds, heading, one sentence, a fix, then Your commanders). Each zero below has a real trigger: All over picks that never meet, or a shared link that pairs a theme with colors it doesn't come in.</p>
