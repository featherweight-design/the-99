<h2 style="margin:0;font:700 30px 'Chakra Petch',sans-serif">All, and how themes combine with color</h2>
<p style="margin:0;font-size:15px;line-height:1.6;color:#B1B6C7;max-width:1500px">Themes and colors narrow together (AND), like every other pair of rack controls. The theme counts are always the rows the other controls leave, so a theme that would empty the list shows 0 and can't be picked.</p>
</div>
<div style="display:flex;gap:40px;align-items:flex-start">
<figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:780px;flex:none">
<img src="/_blob/0fdfb8da8eef725c9342b0098b34df51" alt="Aristocrats and Lifegain, All" style="width:780px;height:540px;display:block;border-radius:12px;border:1px solid #262A35">
<figcaption style="display:flex;flex-direction:column;gap:6px"><p style="margin:0;font-weight:600;font-size:15px">All</p><p style="margin:0;font-size:13px;line-height:1.55;color:#959AAD">Only commanders EDHREC lists under every pick: 41 rows. "All themes" is its own chip, the way Exactly follows the color chip, and the trigger and badge count it. Both picks lead Dina's sentence.</p></figcaption>
</figure>
<figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:780px;flex:none">
<img src="/_blob/089fb9296e0849eaf1b028fbc917018b" alt="Blue lit, Themes panel counted in blue" style="width:780px;height:540px;display:block;border-radius:12px;border:1px solid #262A35">
<figcaption style="display:flex;flex-direction:column;gap:6px"><p style="margin:0;font-weight:600;font-size:15px">With color</p><p style="margin:0;font-size:13px;line-height:1.55;color:#959AAD">Blue lit: the order and counts are inside Blue (Spellslinger leads), and one head line says so: "Counted within the colors you picked." It shows only while a pip is lit.</p></figcaption>
</figure>
<figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:780px;flex:none">
<img src="/_blob/2b5f825deb41cee11f3674d502f7f7d8" alt="Themes with no blue commander greyed" style="width:780px;height:540px;display:block;border-radius:12px;border:1px solid #262A35">
<figcaption style="display:flex;flex-direction:column;gap:6px"><p style="margin:0;font-weight:600;font-size:15px">A theme the colors rule out</p><p style="margin:0;font-size:13px;line-height:1.55;color:#959AAD">Landfall has no blue commander you don't own: it stays in the list at the panel's shipped .42 with 0, and can't be picked. The 0 is the reason, beside the head line.</p></figcaption>
</figure>
</div>
<div style="display:flex;gap:40px;align-items:flex-start">
<figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:330px;flex:none">
<img src="/_blob/bcc2359bdfe9e79a3971f68b84ae3273" alt="Phone, All" style="width:330px;height:714px;display:block;border-radius:28px;border:1px solid #262A35">
<figcaption style="display:flex;flex-direction:column;gap:6px"><p style="margin:0;font-weight:600;font-size:15px">Phone · All</p><p style="margin:0;font-size:13px;line-height:1.55;color:#959AAD">Two chips, Filters badge 2, the same sentence on the row.</p></figcaption>
</figure>
<figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:330px;flex:none">
<img src="/_blob/7095a03289c903f6b0be49601e7d044a" alt="Phone sheet with Blue lit" style="width:330px;height:714px;display:block;border-radius:28px;border:1px solid #262A35">
<figcaption style="display:flex;flex-direction:column;gap:6px"><p style="margin:0;font-weight:600;font-size:15px">Phone · with color</p><p style="margin:0;font-size:13px;line-height:1.55;color:#959AAD">The pills re-rank inside Blue and the same line sits under "All 394 themes". A pill at 0 would grey like the panel's rows.</p></figcaption>
</figure>
