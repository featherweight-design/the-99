 2027!\u003C\u002Fp\u003E\n\n\u003Cdiv class=\"rtecenter\"\u003E\n    \u003Cimg alt=\"Strander Settlement\" src=\"https:\u002F\u002Fmedia.wizards.com\u002F2026\u002Fimages\u002Fdaily\u002F7OFHt6BI4M.webp\" \u002F\u003E\n\u003C\u002Fdiv\u003E\n\n\u003Cdiv style=\"text-align: right; margin: -10px 0 25px 0; font-size: smaller;\"\u003EArt by: \u003Ca href=\"https:\u002F\u002Fgatherer.wizards.com\u002Fsearch?artistName=eq~Marina_Ortega_Lorente\" target=\"_blank\"\u003EMarina Ortega Lorente\u003C\u002Fa\u003E\n\u003C\u002Fdiv\u003E\n\n\u003Cp\u003ENauctis represents years of worldbuilding, passion, and innovation from the \u003Ci\u003EMagic\u003C\u002Fi\u003E team. This is a setting players have requested for decades, so when the time came to take \u003Ci\u003EMagic\u003C\u002Fi\u003E fathoms deeper than ever before, we knew we wanted it to be something special. You can learn more about this plane through our \u003Ca href=\"https:\u002F\u002Fmagic.wizards.com\u002Fen\u002Fnews\u002Fmagic-story\u002Fplaneswalkers-guide-to-nauctis-the-sunken-realm\" target=\"_blank\"\u003EPlaneswalker's Guide to \u003Ci\u003ENauctis: The Sunken Realm\u003C\u002Fi\u003E\u003C\u002Fa\u003E, then sink your teeth into more lore when \u003Ca href=\"https:\u002F\u002Fmtgstory.com\" target=\"_blank\"\u003Ethe story arrives on January 4, 2027\u003C\u002Fa\u003E.\u003C\u002Fp\u003E\n\n\u003Chr\u003E\n\n\u003Cp\u003E\u003Ca href=\"https:\u002F\u002Fmagic.wizards.com\u002Fen\u002Fproducts\u002Fnauctis-the-sunken-realm\" target=\"_blank\"\u003E\u003Ci\u003ENauctis: The Sunken Realm\u003C\u002Fi\u003E\u003C\u002Fa\u003E releases on February 5, 2027, and is available for preorder now from \u003Ca href=\"https:\u002F\u002Flocator.wizards.com\u002F?utm_source=daily_mtg&amp;utm_medium=article_feature&amp;utm_content=collecting&amp;utm_campaign=nau\" target=\"_blank\"\u003Eyour local game store\u003C\u002Fa\u003E, \u003Ca href=\"https:\u002F\u002Fpartner.tcgplayer.com\u002F1GAPKg\" target=\"_blank\"\u003ETCG EMagic\u003C\u002Fi\u003E Presents: Sunken Trove\u003C\u002Fb\u003E: March 5–April 1\u003C\u002Fli\u003E\n\u003C!-- After 11\u002F14: commit Spotlight items --\u003E\n\u003Cli\u003E\u003Cb\u003E\u003Ci\u003EMagic\u003C\u002Fi\u003E Spotlight: Nauctis in Zagreb, Croatia\u003C\u002Fb\u003E: March 13–14\u003C\u002Fli\u003E\n\u003Cli\u003E\u003Cb\u003ECommander Party, Part 2\u003C\u002Fb\u003E: March 19–25\u003C\u002Fli\u003E\n\u003Cli\u003E\u003Cb\u003E\u003Ci\u003EMagic\u003C\u002Fi\u003E Spotlight: Nauctis in Toronto, Canada\u003C\u002Fb\u003E: March 20–21\u003C\u002Fli\u003E\n\u003C\u002Ful\u003E\n\n\u003Chr\u003E\n\n\u003Ch2\u003EExplore the Grand Marine ... and More!\u003C\u002Fh2\u003E\n\n\u003Cdiv style=\"text-align: center;\"\u003E\n\u003Cresponsive-grid slide-view-if=\"(min-width: 10px)\"\u003E\n\u003Cgrid-item\u003E\n\u003Cimg alt=\"Nauctis: The Sunken Realm Collector Booster Box\" src=\"https:\u002F\u002Fmedia.wizards.com\u002F2026\u002Fimages\u002Fdaily\u002FjQEVaVecs4\u002Fen_VWWN9hqGTRnI.webp\" style=\"width:400px;\" \u002F\u003E\n\u003Cdiv style=\"font-size: smaller;\"\u003E\u003Ci\u003ENauctis: The Sunken Realm\u003C\u002Fi\u003E\u003Cbr\u003ECollector Booster Box\u003C\u002Fdiv\u003E\n\u003C\u002Fgrid-item\u003E\n\u003Cgrid-item\u003E\n\u003Cimg alt=\"Nauctis: The Sunken Realm Secret Lair Bundle\" src=\"https:\u002F\u002Fmedia.wizards.com\u002F2026\u002Fimages\u002Fdaily\u002FjQEVaVecs4\u002FJr0IGBHD8h.webp\" style=\"width:400px;\" \u002F\u003E\n\u003Cdiv style=\"font-size: smaller;\"\u003E\u003Ci\u003ENauctis: The Sunken Realm\u003C\u002Fi\u003E\u003Cbr\u003E\u003Ci\u003ESecret Lair\u003C\u002Fi\u003E Bundle\u003C\u002Fdiv\u003E\n\u003C\u002Fgrid-item\u003E\n\u003C\u002Fresponsive-grid\u003E\n\u003C\u002Fdiv\u003E\n\n\u003Cbr\u003E\n\n\u003Cp\u003EFor years, \u003Ci\u003EMagic\u003C\u002Fi\u003E players asked us to take a trip beneath the depths and explore an underwater world. Taking \u003Ci\u003EMagic\u003C\u002Fi\u003E into a new kind of biome was a tall task, and our designers, artists, writers, and more blew it out of the water. Game Design reimagined what evasion looks like in a world without flying. Worldbuilding connected all five colors of mana to this marine realm. All of this was in service of making \u003Ci\u003ENauctis: The Sunken Realm\u003C\u002Fi\u003E more than \"underwater \u003Ci\u003EMagic\u003C\u002Fi\u003E.\" Every card in this set represents the passion of our team, and we couldn't be more thrilled to share it with you.\u003C\u002Fp\u003E\n\n\u003Cp\u003EWe hope you enjoy exploring Nauctis as much as we enjoyed creating it. See you in the depths, chum!\u003C\u002Fp\u003E\n\n\u003Cp\u003E\u003Ca href=\"https:\u002F\u002Fmagic.wizards.com\u002Fen\u002Fproducts\u002Fnauctis-the-sunken-realm\" target=\"_blank\"\u003E\u003Ci\u003ENauctis: The Sunken Realm\u003C\u002Fi\u003E\u003C\u002Fa\u003E releases on February 5, 2027, and is available for preorder now from \u003Ca href=\"https:\u002F\u002Flocator.wizards.com\u002F?utm_source=daily_mtg&amp;utm_medium=article_feature&amp;utm_content=collecting&amp;utm_campaign=nau\" target=\"_blank\"\u003Eyour local game store\u003C\u002Fa\u003E, \u003Ca href=\"https:\u002F\u002Fpartner.tcgplayer.com\u002F1GAPKg\" target=\"_blank\"\u003ETCGplayer\u003C\u002Fa\u003E, \u003Ca href=\"https:\u002F\u002Fgtly.ink\u002F-iTGzDIQS\" gtm-event=\"retailer_cta_click\" gtm-link-text=\"Amazon\" gtm-section=\"Daily Article\" target=\"_blank\"\u003EAmazon\u003C\u002Fa\u003E, and elsewhere \u003Ci\u003EMagic\u003C\u002Fi\u003E is sold.\u003C\u002Fp\u003E\n\n\u003C!-- Update background with HEX color as needed--\u003E\n\u003Cdiv style=\"background:#ffffff; padding:12px; text-align:center;\"\u003E\n\n\u003C!--update background to manage button main color, color for text color, and solid for border color --\u003E\n  \u003Ca href=\"https:\u002F\u002Flocator.wizards.com\u002F?utm_source=daily_mtg&amp;utm_medium=article_feature&amp;utm_content=collecting&amp;utm_campaign=nau\" targ ht:10px;\"\u003EAMAZON ↗\u003C\u002Fa\u003E\n\u003C\u002Fdiv\u003E\n\n\u003Ch2\u003EWhat Are God Packs?\u003C\u002Fh2\u003E\n\n\u003C!--God Pack Celebration Card--\u003E\n\u003Cdiv style=\"text-align: center;\"\u003E\n\u003Cmagic-card caption=\"God Pack Celebration Card\" face=\"https:\u002F\u002Fmedia.wizards.com\u002F2026\u002Fimages\u002Fdaily\u002FStzLVe8OsV\u002Fen_OLwgSyRNYC.webp\"\u003EGod Pack Celebration Card\u003C\u002Fmagic-card\u003E\n\u003C\u002Fdiv\u003E\n\n\u003Cp\u003EThe whale gods of Nauctis aren't the only deities breaching \u003Ci\u003EMagic\u003C\u002Fi\u003E in this set. Starting with \u003Ci\u003ENauctis: The Sunken Realm\u003C\u002Fi\u003E, \u003Ca href=\"https:\u002F\u002Fmagic.wizards.com\u002Fen\u002Fnews\u002Fannouncements\u002Fupdating-our-boosters-in-2027\" target=\"_blank\"\u003Eyou'll be able to open God Packs in Booster Packs and Collector Boosters from \u003Ci\u003EMagic\u003C\u002Fi\u003E Multiverse sets\u003C\u002Fa\u003E. These are, fittingly, a \u003Ci\u003Edivine\u003C\u002Fi\u003E experience. Every nonbasic card is a rare or mythic rare, ensuring maximum excitement. Plus, you'll be the talk of your local game store if you open one of these at a Prerelease.\u003C\u002Fp\u003E\n\n\u003Cp\u003EIn \u003Ci\u003ENauctis: The Sunken Realm\u003C\u002Fi\u003E, 1 in every 1,000 Booster Packs will be a Booster God Pack, and 1 in every 300 Collector Boosters will be a Collector God Pack. For more details on what you can find in God Packs, check out \u003Ca href=\"#product-details\"\u003Ethis section of the article\u003C\u002Fa\u003E.\u003C\u002Fp\u003E\n\n\u003Ch2\u003EThe Booster Fun of Nauctis: The Sunken Realm\u003C\u002Fh2\u003E\n\n\u003Cp\u003ENauctis is a world unlike any other, an endless ocean where gods swim alongside their followers and seabed monstrosities lurk far, far from the surface. There's a bounty to be found at every level, and we've brought that to the set with a variety of beautiful Booster Fun treatments and highly collectible cards.\u003C\u002Fp\u003E\n\n\u003Ch3\u003EAbyssal Lotus\u003C\u002Fh3\u003E\n\n\u003Cdiv style=\"text-align: center;\"\u003E\n\u003Cresponsive-grid slide-view-if=\"(min-width:10px)\"\u003E\n  \u003Cgrid-item\u003E\n    \u003Ccig-card entry=\"2R0UKsO8JUhDAQL11C6kyp\"\u003E0361_MTGNAU_Headline: Abyssal Lotus\u003C\u002Fcig-card\u003E\n  \u003C\u002Fgrid-item\u003E\n\u003C\u002Fresponsive-grid\u003E\n\u003C\u002Fdiv\u003E\n\n\u003Cp\u003EOne word captures the imagination of \u003Ci\u003EMagic\u003C\u002Fi\u003E players like no other: \"lotus.\" Bring the most powerful flora of Nauctis to your collection with the textless raised foil Abyssal Lotus headliner card. Available only in Collector Boosters, this version of Abyssal Lotus represents the wonder at the heart of Nauctis. Kelogsloops lovingly crafted an illustration that captures the benthic beauty of this card, and our Booster Fun team helped it bloom into the perfect centerpiece for your collection.\u003C\u002Fp\u003E\n\n\u003Cp\u003EThere will be approximately 500 Abyssal Lotus headliner cards printed. This version of Abyssal Lotus appears only in English in Collector Boosters of any language.\u003C\u002Fp\u003E\n\n\u003Ch3\u003ESunken Treasures Box Toppers\u003C\u002Fh3\u003E\n\n\u003Cdiv style=\"text-align: center;\"\u003E\n\u003Cresponsive-grid slide-view-if=\"(min-width:10px)\"\u003E\n  \u003Cgrid-item\u003E\n    \u003Ccig-card entry=\"3KQlmQV4sZCDVF1NecuSDT\"\u003E0345_MTGNAU_SunkTrea: Crucible of Worlds\u003C\u002Fcig-card\u003E\n  \u003C\u002Fgrid-item\u003E\n\u003C\u002Fresponsive-grid\u003E\n\u003C\u002Fdiv\u003E\n\n\u003Cp\u003E\u003Ci\u003EMagic\u003C\u002Fi\u003E's most prized artifacts await you in \u003Ci\u003ENauctis: The Sunken Realm\u003C\u002Fi\u003E, lying in the ocean's depths&nbsp;... or at the top of a box. Sunken treasures Box Toppers transport \u003Ci\u003EMagic\u003C\u002Fi\u003E's splashiest artifacts to Nauctis, letting you bring famous reprints from \u003Ci\u003EMagic\u003C\u002Fi\u003E's history to your collection.\u003C\u002Fp\u003E\n\n\u003Cp\u003EThere are two types of sunken treasures cards. Pearlescent sunken treasures cards are available only in \u003Ci\u003ENauctis: The Sunken Realm\u003C\u002Fi\u003E Box Toppers. These feature a new card treatment designed specifically for these cards. Start each box by opening your Box Topper, then journey into Nauctis with something truly worth treasuring.\u003C\u002Fp\u003E\n\n\u003Cdiv style=\"text-align: center;\"\u003E\n\u003Cresponsive-grid slide-view-if=\"(min-width:10px)\"\u003E\n  \u003Cgrid-item\u003E\n    \u003Ccig-card entry=\"2Zk3201rR1ujl9ytf0bbN5\"\u003E0365_MTGNAU_SuTrEcls: Crucible of Worlds\u003C\u002Fcig-card\u003E\n  \u003C\u002Fgrid-item\u003E\n\u003C\u002Fresponsive-grid\u003E\n\u003C\u002Fdiv\u003E\n\n\u003Cp\u003EIn Collector Boosters, these cards can be found in our shimmering undersea foil treatment, which debuts in this set. It's as if the cards can barely contain the raw energy of these artifacts of the Grand Marine!\u003C\u002Fp\u003E\n\n\u003Cp\u003EThere are 15 classic reprints and 5 new-to-\u003Ci\u003EMagic\u003C\u002Fi\u003E Box Topper cards. Each \u003Ci\u003ENauctis: The Sunken Realm\u003C\u002Fi\u003E Booster Pack box and Collector Booster box includes a Box Topper that contains 1 pearlescent sunken treasures card. Undersea foil sunken treasures cards are available only in Collector Boosters. Sunken treasures cards will always appear in English.\u003C\u002Fp\u003E\n\n\u003Ch3\u003EOcean Panorama Cards\u003C\u002Fh3\u003E\n\n\u003Cdiv style=\"text-align: center;\"\u003E\n\u003Cresponsive-grid slide-view-if=\"(min-width:10px)\"\u003E\n  \u003Cgrid-item\u003E\n    \u003Ccig-card entry=\"2StQzY1c87QDZCes1fr5O6\"\u003E0321_MTGNAU_AquaTrip: Salinae, the Ocean Mother\u003C\u002Fcig-card\u003E\n  \u003C\u002Fgrid-item\u003E\n  \u003Cgrid-item\u003E\n    \u003Ccig-card entry=\"7dn7v4rQiVbsTkQs75gtdg\"\u003E0329_MTGNAU_AquaTrip: Goramou the Coral-Taken\u003C\u002Fcig-card\u003E\n  \u003C\u002Fgrid-item\u003E\n  \u003Cgrid-item\u003E\n    \u003Ccig-card entry=\"4wxWCq7val9bSt3MXM8LrJ\"\u003E0341_MTGNAU_AquaTrip: Tecton, Malignant Ruin\u003C\u002Fcig-card\u003E\n  \u003C\u002Fgrid-item\u003E\n\u003C\u002Fresponsive-grid\u003E\n\u003C\u002Fdiv\u003E\n\n\u003Cp\u003ESome stories are too vast to be contained by a single card. Ocean panorama cards give the majesty of Nauctis the canvas it deserves, showcasing marine moments across a triptych of cards. Some of these depict the mighty gods of the plane, while others show off the biodiversity of Nauctis and its inhabitants. Each triptych also features flavor text that connects the cards as one unified piece of the plane.\u003C\u002Fp\u003E\n\n\u003Cp\u003EThere are 24 ocean panorama cards. Non-foil and traditional foil ocean panorama cards appear in Booster Packs and Collector Boosters.\u003C\u002Fp\u003E\n\n\u003Ch3\u003ECoral Frame Cards\u003C\u002Fh3\u003E\n\n\u003Cdiv style=\"text-align: center;\"\u003E\n\u003Cresponsive-grid slide-view-if=\"(min-width:10px)\"\u003E\n  \u003Cgrid-item\u003E\n    \u003Ccig-card entry=\"2K9QXThBlndi5qsCnlNZCd\"\u003E0281_MTGNAU_ShoCoral: Calmwater Mentor\u003C\u002Fcig-card\u003E\n  \u003C\u002Fgrid-item\u003E\n  \u003Cgrid-item\u003E\n    \u003Ccig-card entry=\"Tc4Kg9r5GN8Z97hYWL6L2\"\u003E0311_MTGNAU_ShoCoral: Goramou the Coral-Taken\u003C\u002Fcig-card\u003E\n  \u003C\u002Fgrid-item\u003E\n  \u003Cgrid-item\u003E\n    \u003Ccig-card entry=\"7FAKKO89neLNmDXMlJw1ZM\"\u003E0316_MTGNAU_ShoCoral: Abyssal Lotus\u003C\u002Fcig-card\u003E\n  \u003C\u002Fgrid-item\u003E\n\u003C\u002Fresponsive-grid\u003E\n\u003C\u002Fdiv\u003E\n\n\u003Cp\u003EWreathed in coral and illustrated in a vibrant, painterly style, coral frame cards reimagine our favorite pieces of this undersea world, taking you deeper into Nauctis with each spell you cast. The frame was designed by our Booster Fun team to fit a wide array of cards from the set, with selections that span the range of card types and characters. Bring coral to the command zone and beyond!\u003C\u002Fp\u003E\n\n\u003Cp\u003EThere are 38 coral frame cards. Non-foil and traditional foil coral frame cards appear in Booster Packs and Collector Boosters.\u003C\u002Fp\u003E\n\n\u003Ch3\u003EBorderless Lands and More\u003C\u002Fh3\u003E\n\n\u003Cdiv style=\"text-align: center;\"\u003E\n\u003Cresponsive-grid slide-view-if=\"(min-width:10px)\"\u003E\n  \u003Cgrid-item\u003E\n    \u003Ccig-card entry=\"ST37QiG72GAxrUBOaGarC\"\u003E0346_MTGNAU_BrdrlsLd: Shimmering Citadel\u003C\u002Fcig-card\u003E\n  \u003C\u002Fgrid-item\u003E\n\u003C\u002Fresponsive-grid\u003E\n\u003C\u002Fdiv\u003E\n\n\u003Cp\u003EWe're also highlighting the set's rare lands on a series of borderless cards! These cards offer a border-free glimpse into Nauctis to give players a close, firsthand look at this amazing underwater world.\u003C\u002Fp\u003E\n\n\u003Cp\u003EEven more borderless treasures await—but we're not venturing \u003Ci\u003Ethat\u003C\u002Fi\u003E deep just yet! There are 7 rare borderless lands in \u003Ci\u003ENauctis: The Sunken Realm\u003C\u002Fi\u003E. Non-foil and traditional foil borderless lands appear in Booster Packs and Collector Boosters.\u003C\u002Fp\u003E\n\n\u003Ch3\u003ESecret Lair Bundle Promo Cards\u003C\u002Fh3\u003E\n\n\u003Cdiv class=\"u-text-center\" slide-view-if=\"width:100%\"\u003E\n\u003Cresponsive-grid\u003E\n  \u003Cgrid-item\u003E\n    \u003Ccig-card entry=\"7rm2Lt3qX1laf9K54dSvYr\"\u003E0409_MTGNAU_SLDBndl: Salinae, the Ocean Mother\u003C\u002Fcig-card\u003E\n  \u003C\u002Fgrid-item\u003E\n  \u003Cgrid-item\u003E\n    \u003Ccig-card entry=\"3ivrNtGIuaxj8usjcLaATi\"\u003E0410_MTGNAU_SLDBndl: Tecton, Malignant Ruin\u003C\u002Fcig-card\u003E\n  \u003C\u002Fgrid-item\u003E\n\u003C\u002Fresponsive-grid\u003E\n\u003C\u002Fdiv\u003E\n\n\u003Cp\u003EWe're swimming just a little deeper to uncover a few more unimaginable secrets. The \u003Ci\u003ESecret Lair\u003C\u002Fi\u003E Bundle takes several of \u003Ci\u003ENauctis: The Sunken Realm\u003C\u002Fi\u003E's greatest prizes and gives them a whole new look! For this set, we focused on characters and creatures emerging from the darkest waters. They're breaking through the shadows and into your decks, ready to light up the competition in style.\u003C\u002Fp\u003E\n\n\u003Cp\u003EThere are 10 different \u003Ci\u003ESecret Lair\u003C\u002Fi\u003E Bundle promo cards, with each \u003Ci\u003ESecret Lair\u003C\u002Fi\u003E Bundle containing 6 Booster Packs, 2 Collector Boosters, 20 full-art basic lands, and 2 of 10 \u003Ci\u003ESecret Lair\u003C\u002Fi\u003E Bundle promo cards.\u003C\u002Fp\u003E\n\n\u003Ch3\u003EJapan Showcase Cards\u003C\u002Fh3\u003E\n\n\u003Cdiv class=\"u-text-center\" slide-view-if=\"width:100%\"\u003E\n\u003Cresponsive-grid\u003E\n  \u003Cgrid-item\u003E\n    \u003Ccig-card entry=\"15pzqb00N02I6d7NJrUjv0\"\u003E0369_MTGNAU_JPEcShow: Salinae, the Ocean Mother\u003C\u002Fcig-card\u003E\n  \u003C\u002Fgrid-item\u003E\n  \u003Cgrid-item\u003E\n    \u003Ccig-card entry=\"2bxfVB5X717GY6byNUto7J\"\u003E0370_MTGNAU_JPEcShow: Tecton, Malignant Ruin\u003C\u002Fcig-card\u003E\n  \u003C\u002Fgrid-item\u003E\n\u003C\u002Fresponsive-grid\u003E\n\u003C\u002Fdiv\u003E\n\n\u003Cp\u003ENauctis is a rich realm, full of all sorts of marine life. That biodiversity deserves a matching variety of art styles, and these \u003Ci\u003EJapan Showcase\u003C\u002Fi\u003E cards deliver with a wave of beloved artists and eye-popping illustrations. Our Japanese Booster Fun team reimagined 10 cards with pieces inspired by Japanese hobby shops, complete with unique, frame-breaking artwork.\u003C\u002Fp\u003E\n\n\u003Cp\u003EStarting with \u003Ci\u003ENauctis: The Sunken Realm\u003C\u002Fi\u003E, you can find \u003Ci\u003EJapan Showcase\u003C\u002Fi\u003E cards in more places! Traditional foil \u003Ci\u003EJapan Showcase\u003C\u002Fi\u003E cards appear in both Booster Packs and Collector Boosters, with fracture foil \u003Ci\u003EJapan Showcase\u003C\u002Fi\u003E cards appearing only in Collector Boosters. In Japanese boosters, \u003Ci\u003EJapan Showcase\u003C\u002Fi\u003E cards will always be in Japanese. In non-Japanese boosters, these cards will always be in English.\u003C\u002Fp\u003E\n\n\u003Ch2 id=\"product-details\" style=\"scroll-margin-top: 70px;\"\u003ENauctis: The Sunken Realm Product Details\u003C\u002Fh2\u003E\n\n\u003Cp\u003EEven more Booster Fun cards and product details are soon to come! For now, you can find all the revealed cards in the \u003Ca href=\"https:\u002F\u002Fmagic.wizards.com\u002Fen\u002Fproducts\u002Fnauctis-the-sunken-realm\u002Fcard-image-gallery\" target=\"_blank\"\u003E\u003Ci\u003ENauctis: The Sunken Realm\u003C\u002Fi\u003E Card Image Gallery\u003C\u002Fa\u003E and see basic product details below.\u003C\u002Fp\u003E\n\n\u003Ch3\u003EBooster Packs\u003C\u002Fh3\u003E\n\n\u003Cdiv class=\"figure-wrapper\"\u003E\n\u003Cfigure style=\"text-align:center;\"\u003E\u003Cimg alt=\"Nauctis: The Sunken Realm Booster Pack Box\" src=\"https:\u002F\u002Fmedia.wizards.com\u002F2026\u002Fimages\u002Fdaily\u002FjQEVaVecs4\u002Fen_lh69ZW07Vx59.webp\" style=\"width:500px;\" \u002F\u003E\n\u003Cdiv style=\"font-size: smaller;\"\u003E\u003Ci\u003ENauctis: The Sunken Realm\u003C\u002Fi\u003E\u003Cbr\u003EBooster Pack Box\u003C\u002Fdiv\u003E\n\u003C\u002Ffigure\u003E\n\u003C\u002Fdiv\u003E\n\n\u003Cp\u003EEach \u003Ci\u003ENauctis: The Sunken Realm\u003C\u002Fi\u003E Booster Pack box includes 30 Booster Packs. Each Booster Pack contains the following:\u003C\u002Fp\u003E\n\n\u003Cul\u003E\n\u003Cli\u003E14 \u003Ci\u003EMagic: The Gathering\u003C\u002Fi\u003E cards\n\u003Cul\u003E\n\u003Cli\u003E6 Common cards\u003C\u002Fli\u003E\n\u003Cli\u003E1 Common or \u003Ci\u003ESpecial Guests\u003C\u002Fi\u003E card\u003C\u002Fli\u003E\n\u003Cli\u003E3 Uncommon cards\u003C\u002Fli\u003E\n\u003Cli\u003E1 Rare or mythic rare card\u003C\u002Fli\u003E\n\u003Cli\u003E1 Uncommon, rare, or mythic rare card\u003C\u002Fli\u003E\n\u003Cli\u003E1 Non-foil common, traditional foil rare, or traditional foil mythic rare card\u003C\u002Fli\u003E\n\u003Cli\u003E1 Basic land\u003C\u002Fli\u003E\n\u003C\u002Ful\u003E\n\u003C\u002Fli\u003E\n\u003Cli\u003E1 Non-foil double-sided token\u003C\u002Fli\u003E\n\u003C\u002Ful\u003E\n\n\u003Cp\u003EIn approximately 1 out of every 1,000 Booster Packs, you'll open a Booster God Pack! Each Booster God Pack contains the following:\u003C\u002Fp\u003E\n\n\u003Cul\u003E\n\u003Cli\u003E1 God Pack celebration card\u003C\u002Fli\u003E\n\u003Cli\u003E10 Non-foil rare and\u002For mythic rare cards\u003C\u002Fli\u003E\n\u003Cli\u003E2 Non-foil Booster Fun rare and\u002For mythic rare cards\u003C\u002Fli\u003E\n\u003Cli\u003E2 Traditional foil Booster Fun rare and\u002For mythic rare cards\u003C\u002Fli\u003E\n\u003C\u002Ful\u003E\n\n\u003Ch3\u003ECollector Boosters\u003C\u002Fh3\u003E\n\n\u003Cdiv class=\"figure-wrapper\"\u003E\n\u003Cfigure style=\"text-align:center;\"\u003E\u003Cimg alt=\"Nauctis: The Sunken Realm Collector Booster Box\" src=\"https:\u002F\u002Fmedia.wizards.com\u002F2026\u002Fimages\u002Fdaily\u002FjQEVaVecs4\u002Fen_VWWN9hqGTRnI.webp\" style=\"width:500px;\" \u002F\u003E\n\u003Cdiv style=\"font-size: smaller;\"\u003E\u003Ci\u003ENauctis: The Sunken Realm\u003C\u002Fi\u003E\u003Cbr\u003ECollector Booster Box\u003C\u002Fdiv\u003E\n\u003C\u002Ffigure\u003E\n\u003C\u002Fdiv\u003E\n\n\u003Cp\u003EEach \u003Ci\u003ENauctis: The Sunken Realm\u003C\u002Fi\u003E Collector Booster box includes 12 Collector Boosters. Each Collector Booster contains the following:\u003C\u002Fp\u003E\n\n\u003Cul\u003E\n\u003Cli\u003E12 \u003Ci\u003EMagic: The Gathering\u003C\u002Fi\u003E cards\n\u003Cul\u003E\n\u003Cli\u003E3 Traditional foil common cards\u003C\u002Fli\u003E\n\u003Cli\u003E3 Foil uncommon cards\u003C\u002Fli\u003E\n\u003Cli\u003E1 Non-foil or traditional foil basic land\u003C\u002Fli\u003E\n\u003Cli\u003E1 Traditional foil rare or mythic rare card\u003C\u002Fli\u003E\n\u003Cli\u003E1 Non-foil rare or mythic rare card from \u003Ci\u003ENauctis: The Sunken Realm\u003C\u002Fi\u003E Commander\u003C\u002Fli\u003E\n\u003Cli\u003E2 Non-foil rare or mythic rare Booster Fun cards\u003C\u002Fli\u003E\n\u003Cli\u003E1 Foil rare or mythic rare Booster Fun card\u003C\u002Fli\u003E\n\u003C\u002Ful\u003E\n\u003C\u002Fli\u003E\n\u003Cli\u003E1 Art card or traditional foil double-sided token\u003C\u002Fli\u003E\n\u003C\u002Ful\u003E\n\n\u003Cp\u003EIn approximately 1 out of every 300 Collector Boosters, you'll open a Collector God Pack! Each Collector God Pack contains the following:\u003C\u002Fp\u003E\n\n\u003Cul\u003E\n\u003Cli\u003E1 God Pack celebration card\u003C\u002Fli\u003E\n\u003Cli\u003E1 Foil land\u003C\u002Fli\u003E\n\u003Cli\u003E3 Foil rare and\u002For mythic rare cards\u003C\u002Fli\u003E\n\u003Cli\u003E3 Non-foil Booster Fun rare and\u002For mythic rare cards\u003C\u002Fli\u003E\n\u003Cli\u003E5 Foil Booster Fun rare and\u002For mythic rare cards\u003C\u002Fli\u003E\n\u003C\u002Ful\u003E\n\n\u003Ch3\u003EBox Toppers\u003C\u002Fh3\u003E\n\n\u003Cdiv class=\"figure-wrapper\"\u003E\n\u003Cfigure style=\"text-align:center;\"\u003E\u003Cimg alt=\"Nauctis: The Sunken Realm Box Topper\" src=\"https:\u002F\u002Fmedia.wizards.com\u002F2026\u002Fimages\u002Fdaily\u002FjQEVaVecs4\u002Fen_jNvBXI31DvJ4.webp\" style=\"width:400px;\" \u002F\u003E\n\u003Cdiv style=\"font-size: smaller;\"\u003E\u003Ci\u003ENauctis: The Sunken Realm\u003C\u002Fi\u003E\u003Cbr\u003EBox Topper\u003C\u002Fdiv\u003E\n\u003C\u002Ffigure\u003E\n\u003C\u002Fdiv\u003E\n\n\u003Cp\u003EEach \u003Ci\u003ENauctis: The Sunken Realm\u003C\u002Fi\u003E Booster Pack box and Collector Booster box includes 1 Box Topper. Each Box Topper contains 1 pearlescent sunken treasures card. Undersea foil versions of these cards can only be found in Collector Boosters. Sunken treasures cards will always appear in English.\u003C\u002Fp\u003E\n\n\u003Ch3\u003ECommander Decks\u003C\u002Fh3\u003E\n\n\u003Cdiv style=\"text-align: center;\"\u003E\n\u003Cresponsive-grid slide-view-if=\"(min-width: 10px)\"\u003E\n\u003Cgrid-item\u003E\n\u003Cimg alt=\"Merfolk Regiment Commander Deck\" src=\"https:\u002F\u002Fmedia.wizards.com\u002F2026\u002Fimages\u002Fdaily\u002FjQEVaVecs4\u002Fen_CU1EyxtKT6Xc.webp\" style=\"width:200px;\" \u002F\u003E\n\u003Cdiv style=\"font-size: smaller;\"\u003EMerfolk Regiment\u003Cbr\u003ECommander Deck\u003C\u002Fdiv\u003E\n\u003C\u002Fgrid-item\u003E\n\u003Cgrid-item\u003E\n\u003Cimg alt=\"Terrors of the Abyss Commander Deck\" src=\"https:\u002F\u002Fmedia.wizards.com\u002F2026\u002Fimages\u002Fdaily\u002FjQEVaVecs4\u002Fen_tFfZG6evMEgC.webp\" style=\"width:200px;\" \u002F\u003E\n\u003Cdiv style=\"font-size: smaller;\"\u003ETerrors of the Abyss\u003Cbr\u003ECommander Deck\u003C\u002Fdiv\u003E\n\u003C\u002Fgrid-item\u003E\n\u003Cgrid-item\u003E\n\u003Cimg alt=\"Blood in the Water Commander Deck\" src=\"https:\u002F\u002Fmedia.wizards.com\u002F2026\u002Fimages\u002Fdaily\u002FjQEVaVecs4\u002Fen_KJnHC6PlT8Db.webp\" style=\"width:200px;\" \u002F\u003E\n\u003Cdiv style=\"font-size: smaller;\"\u003EBlood in the Water\u003Cbr\u003ECommander Deck\u003C\u002Fdiv\u003E\n\u003C\u002Fgrid-item\u003E\n\u003Cgrid-item\u003E\n\u003Cimg alt=\"Seal the Deal Commander Deck\" src=\"https:\u002F\u002Fmedia.wizards.com\u002F2026\u002Fimages\u002Fdaily\u002FjQEVaVecs4\u002Fen_4nlrWcqKiFRj.webp\" style=\"width:200px;\" \u002F\u003E\n\u003Cdiv style=\"font-size: smaller;\"\u003ESeal the Deal\u003Cbr\u003ECommander Deck\u003C\u002Fdiv\u003E\n\u003C\u002Fgrid-item\u003E\n\u003C\u002Fresponsive-grid\u003E\n\u003C\u002Fdiv\u003E\n\n\u003Cbr\u003E\n\n\u003Cp\u003EEach \u003Ci\u003ENauctis: The Sunken Realm\u003C\u002Fi\u003E Commander deck contains the following:\u003C\u002Fp\u003E\n\n\u003Cul\u003E\n\u003Cli\u003E1 Ready-to-play 100-card Commander deck\n\u003Cul\u003E\n\u003Cli\u003E1 Traditional foil new-to-\u
