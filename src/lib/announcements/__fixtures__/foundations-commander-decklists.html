ntentTypeId:O,locale:b,createdAt:P,updatedAt:Q,publishedAt:a,firstPublishedAt:a,publishedVersion:m,entryTitle:R,value:p,label:x}],publishedDate:"2026-09-18 14:00:00",publishedDateTime:"2026-09-18T14:00-07:00",excerpt:"\u003Cp\u003EFive decks, five strategies, five ways to start playing Commander! \u003Ci\u003EFoundations\u003C\u002Fi\u003E Commander decks release alongside \u003Ci\u003EReality Fracture\u003C\u002Fi\u003E on October 2, 2026.\u003C\u002Fp\u003E",article:{body:"\u003Cp\u003EJoin in the fun of Commander, \u003Ci\u003EMagic\u003C\u002Fi\u003E's most popular multiplayer format, with \u003Ci\u003EFoundations\u003C\u002Fi\u003E Commander decks! Releasing alongside \u003Ca href=\"https:\u002F\u002Fmagic.wizards.com\u002Fen\u002Fproducts\u002Freality-fracture\" target=\"_blank\"\u003E\u003Ci\u003EReality Fracture\u003C\u002Fi\u003E\u003C\u002Fa\u003E, these ready-to-play decks give you everything you need to start playing and loving Commander, including key cards, tokens, and a traditional foil borderless commander to lead the charge!\u003C\u002Fp\u003E\n\n\u003Cdiv style=\"text-align: center; margin-bottom: 30px\"\u003E\n\u003Cresponsive-grid slide-view-if=\"(min-width: 10px)\"\u003E\n\u003Cgrid-item\u003E\n\u003Cdiv style=\"text-align: center; display:inline-block;\"\u003E\u003Cimg alt=\"\" src=\"https:\u002F\u002Fmedia.wizards.com\u002F2026\u002Fimages\u002Fdaily\u002FFjG9SWaGN4\u002Fen_qlKZntzqA3.webp\" alt=\"Calling All Angels Foundations Commander Deck\" style=\"width:210px\" \u002F\u003E\n\u003Cdiv style=\"font-size:small\"\u003ECalling All Angels\u003Cbr\u003E\u003Ci\u003EFoundations\u003C\u002Fi\u003E Commander Deck\u003C\u002Fdiv\u003E\n\u003C\u002Fdiv\u003E\n\u003C\u002Fgrid-item\u003E\n\u003Cgrid-item\u003E\n\u003Cdiv style=\"text-align: center; display:inline-block;\"\u003E\u003Cimg alt=\"\" src=\"https:\u002F\u002Fmedia.wizards.com\u002F2026\u002Fimages\u002Fdaily\u002FFjG9SWaGN4\u002Fen_7pdjoo0ffq.webp\" alt=\"Keen Engineering Foundations Commander Deck\"  style=\"width:210px\" \u002F\u003E\n\u003Cdiv style=\"font-size:small\"\u003EKeen Engineering\u003Cbr\u003E\u003Ci\u003EFoundations\u003C\u002Fi\u003E Commander Deck\u003C\u002Fdiv\u003E\n\u003C\u002Fdiv\u003E\n\u003C\u002Fgrid-item\u003E\n\u003Cgrid-item\u003E\n\u003Cdiv style=\"text-align: center; display:inline-block;\"\u003E\u003Cimg alt=\"\" src=\"https:\u002F\u002Fmedia.wizards.com\u002F2026\u002Fimages\u002Fdaily\u002FFjG9SWaGN4\u002Fen_8TRayERTzi.webp\" alt=\"Wretched Ranks Foundations Commander Deck\"  style=\"width:210px\" \u002F\u003E\n\u003Cdiv style=\"font-size:small\"\u003EWretched Ranks\u003Cbr\u003E\u003Ci\u003EFoundations\u003C\u002Fi\u003E Commander Deck\u003C\u002Fdiv\u003E\n\u003C\u002Fdiv\u003E\n\u003C\u002Fgrid-item\u003E\n\u003Cgrid-item\u003E\n\u003Cdiv style=\"text-align: center; display:inline-block;\"\u003E\u003Cimg alt=\"\" src=\"https:\u002F\u002Fmedia.wizards.com\u002F2026\u002Fimages\u002Fdaily\u002FFjG9SWaGN4\u002Fen_2W3gyO7FcE.webp\" alt=\"Reign of Dragons Foundations Commander Deck\"  style=\"width:210px\" \u002F\u003E\n  \u003Cdiv style=\"font-size:small\"\u003EReign of Dragons\u003Cbr\u003E\u003Ci\u003EFoundations\u003C\u002Fi\u003E Commander Deck\u003C\u002Fdiv\u003E\n\u003C\u002Fdiv\u003E\n\u003C\u002Fgrid-item\u003E  \n\u003Cgrid-item\u003E\n\u003Cdiv style=\"text-align: center; display:inline-block;\"\u003E\u003Cimg alt=\"\" src=\"https:\u002F\u002Fmedia.wizards.com\u002F2026\u002Fimages\u002Fdaily\u002FFjG9SWaGN4\u002Fen_rdavBoIfYl.webp\" alt=\"Tramplesaurus Rex Foundations Commander Deck\"  style=\"width:210px\" \u002F\u003E\n\u003Cdiv style=\"font-size:small\"\u003ETramplesaurus Rex\u003Cbr\u003E\u003Ci\u003EFoundations\u003C\u002Fi\u003E Commander Deck\u003C\u002Fdiv\u003E\n\u003C\u002Fdiv\u003E\n\u003C\u002Fgrid-item\u003E \n\u003C\u002Fresponsive-grid\u003E\n\u003C\u002Fdiv\u003E\n\n\u003Cp\u003EThese decks are designed to introduce the Commander format to new players. Each monocolor deck employs a simple, straightforward, and exciting strategy like artifacts, big creatures, or Dragons! No matter how you like to play \u003Ci\u003EMagic\u003C\u002Fi\u003E, one of these decks is sure to spark your love for Commander. Longtime players can also look forward to playing with or against these decks, as each one puts the fun of multiplayer \u003Ci\u003EMagic\u003C\u002Fi\u003E at the forefront. Each \u003Ci\u003EFoundations\u003C\u002Fi\u003E Commander deck contains the following:\u003C\u002Fp\u003E\n\n\u003Cul\u003E\n\u003Cli\u003E1 Ready-to-play 100-card Commander deck\n\u003Cul\u003E\n\u003Cli\u003E1 Traditional foil face commander with borderless art\u003C\u002Fli\u003E\n\u003Cli\u003E99 Non-foil cards\u003C\u002Fli\u003E\n\u003C\u002Ful\u003E\n\u003C\u002Fli\u003E\n\u003Cli\u003E10 Non-foil double-sided tokens\u003C\u002Fli\u003E\n\u003Cli\u003E1 Reference card\u003C\u002Fli\u003E\n\u003Cli\u003E1 Deck box\u003C\u002Fli\u003E\n\u003C\u002Ful\u003E\n\n\u003Cp id=\"TableofContents\" style=\"scroll-margin-top: 70px;\"\u003EYou can find each decklist below and browse all the cards from \u003Ci\u003EFoundations\u003C\u002Fi\u003E Commander decks and \u003Ci\u003EReality Fracture\u003C\u002Fi\u003E in the \u003Ca href=\"https:\u002F\u002Fmagic.wizards.com\u002Fen\u002Fproducts\u002Freality-fracture\u002Fcard-image-gallery\" target=\"_blank\"\u003E\u003Ci\u003EReality Fracture\u003C\u002Fi\u003E Card Image Gallery\u003C\u002Fa\u003E.\u003C\u002Fp\u003E\n\n\u003Cul\u003E\n\u003Cli\u003E\u003Ca href=\"#CallingAllAngels\"\u003ECalling All Angels\u003C\u002Fa\u003E\u003C\u002Fli\u003E\n\u003Cli\u003E\u003Ca href=\"#KeenEngineering\"\u003EKeen Engineering\u003C\u002Fli\u003E\n\u003Cli\u003E\u003Ca href=\"#WretchedRanks\"\u003EWretched Ranks\u003C\u002Fa\u003E\u003C\u002Fli\u003E\n\u003Cli\u003E\u003Ca href=\"#ReignofDragons\"\u003EReign of Dragons\u003C\u002Fa\u003E\u003C\u002Fli\u003E\n\u003Cli\u003E\u003Ca href=\"#TramplesaurusRex\"\u003ETramplesaurus Rex\u003C\u002Fa\u003E\u003C\u002Fli\u003E\n\u003C\u002Ful\u003E\n\n\u003Cp\u003EIf you're looking for more places to pick up cards for your Commander collection, or maybe you're hoping to modify one of these decks or build something new (as Commander fans love to do), check out the \u003Ca href=\"https:\u002F\u002Fmagic.wizards.com\u002Fen\u002Fnews\u002Ffeature\u002Freality-fracture-buyers-guide-for-commander\" target=\"_blank\"\u003E\u003Ci\u003EReality Fracture\u003C\u002Fi\u003E Buyer's Guide for Commander\u003C\u002Fa\u003E!\u003C\u002Fp\u003E\n\n\u003Cp\u003E\u003Ci\u003EFoundations\u003C\u002Fi\u003E Commander decks and \u003Ci\u003EReality Fracture\u003C\u002Fi\u003E release on October 2, 2026, and are available for preorder now from \u003Ca href=\"https:\u002F\u002Flocator.wizards.com\u002F?utm_source=daily_mtg&utm_medium=article_feature&utm_content=foundationscommander&utm_campaign=fra\" target=\"_blank\"\u003Eyour local game store\u003C\u002Fa\u003E, \u003Ca href=\"https:\u002F\u002Fpartner.tcgplayer.com\u002FDWkOjd\" target=\"_blank\"\u003ETCGplayer\u003C\u002Fa\u003E, \u003Ca href=\"http:\u002F\u002Fgtly.ink\u002F7hz1A2IL-1\" gtm-event=\"retailer_cta_click\" gtm-link-text=\"Amazon\" gtm-section=\"Daily Article\" target=\"_blank\"\u003EAmazon\u003C\u002Fa\u003E, and elsewhere \u003Ci\u003EMagic\u003C\u002Fi\u003E is sold.\u003C\u002Fp\u003E\n\n\u003C!-- Update background with HEX color as needed--\u003E\n\u003Cdiv style=\"background:#ffffff; padding:12px; text-align:center;\"\u003E\n\n\u003C!--update background to manage button main color, color for text color, and solid for border color --\u003E\n  \u003Ca href=\"https:\u002F\u002Flocator.wizards.com\u002F?utm_source=daily_mtg&utm_medium=article_feature&utm_content=foundationscommander&utm_campaign=fra\" target=\"_blank\"\n     style=\"display:inline-flex; align-items:center; justify-content:center; height:42px; padding:0 18px; margin:6px; background:#89bae6; color:#ffffff; border:2px solid #e4eaf1; border-radius:18px; text-decorat
