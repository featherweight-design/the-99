3EFederation Fleet\u003Cbr\u003ECommander Deck\u003C\u002Fdiv\u003E\n\u003C\u002Fdiv\u003E\n\u003C\u002Fgrid-item\u003E\n\u003Cgrid-item\u003E\n\u003Cdiv style=\"text-align: center; display:inline-block;\"\u003E\u003Cimg alt=\"Landing Party Commander deck\" src=\"https:\u002F\u002Fmedia.wizards.com\u002F2026\u002Fimages\u002Fdaily\u002F6IF46UlXn3\u002Fen_EcnQlCM9Qy.webp\" style=\"width:150px\" \u002F\u003E\n\u003Cdiv style=\"font-size:small\"\u003ELanding Party\u003Cbr\u003ECommander Deck\u003C\u002Fdiv\u003E\n\u003C\u002Fdiv\u003E\n\u003C\u002Fgrid-item\u003E\n\u003Cgrid-item\u003E\n\u003Cdiv style=\"text-align: center; display:inline-block;\"\u003E\u003Cimg alt=\"Klingon Fury Commander deck\" src=\"https:\u002F\u002Fmedia.wizards.com\u002F2026\u002Fimages\u002Fdaily\u002F6IF46UlXn3\u002Fen_le0bxzT2PI.webp\" style=\"width:150px\" \u002F\u003E\n\u003Cdiv style=\"font-size:small\"\u003EKlingon Fury\u003Cbr\u003ECommander Deck\u003C\u002Fdiv\u003E\n\u003C\u002Fdiv\u003E\n\u003C\u002Fgrid-item\u003E\n\u003Cgrid-item\u003E\n\u003Cdiv style=\"text-align: center; display:inline-block;\"\u003E\u003Cimg alt=\"We Are the Borg Commander deck\" src=\"https:\u002F\u002Fmedia.wizards.com\u002F2026\u002Fimages\u002Fdaily\u002F6IF46UlXn3\u002Fen_3XOZ7wCrfN.webp\" style=\"width:150px\" \u002F\u003E\n\u003Cdiv style=\"font-size:small\"\u003EWe Are the Borg\u003Cbr\u003ECommander Deck\u003C\u002Fdiv\u003E\n\u003C\u002Fdiv\u003E\n\u003C\u002Fgrid-item\u003E\n\u003C\u002Fresponsive-grid\u003E\n\u003C\u002Fdiv\u003E\n\u003Cp\u003EEach \u003Ci\u003EMagic: The Gathering\u003C\u002Fi\u003E | \u003Ci\u003EStar Trek\u003C\u002Fi\u003E Commander deck includes the following:\u003C\u002Fp\u003E\n\n\u003Cul\u003E\n\u003Cli\u003E1 Ready-to-play 100-card Commander deck\n\u003Cul\u003E\n\u003Cli\u003E1 Traditional foil face commander with borderless art\u003C\u002Fli\u003E\n\u003Cli\u003E99 Non-foil cards, including 32 new-to-\u003Ci\u003EMagic\u003C\u002Fi\u003E cards\u003C\u002Fli\u003E\n\u003C\u002Ful\u003E\n\u003C\u002Fli\u003E\n\u003Cli\u003E10 Non-foil double-sided tokens\u003C\u002Fli\u003E\n\u003Cli\u003E1 Reference card\u003C\u002Fli\u003E\n\u003Cli\u003E1 Deck box\u003C\u002Fli\u003E\n\u003C\u002Ful\u003E\n\n\u003C!--Collector's Edition Commander Deck Packaging--\u003E\n\u003Cdiv style=\"text-align: center; margin-bottom: 30px\"\u003E\n\u003Cresponsive-grid slide-view-if=\"(min-width: 10px)\"\u003E\n\u003Cgrid-item\u003E\n\u003Cdiv style=\"text-align: center; display:inline-block;\"\u003E\u003Cimg alt=\"Federation Fleet Collector's Edition Commander deck\" src=\"https:\u002F\u002Fmedia.wizards.com\u002F2026\u002Fimages\u002Fdaily\u002F6IF46UlXn3\u002Fracr9jZ94b.webp\" style=\"width:150px\" \u002F\u003E\n\u003Cdiv style=\"font-size:small\"\u003EFederation Fleet\u003Cbr\u003ECollector's Edition\u003Cbr\u003ECommander Deck\u003C\u002Fdiv\u003E\n\u003C\u002Fdiv\u003E\n\u003C\u002Fgrid-item\u003E\n\u003Cgrid-item\u003E\n\u003Cdiv style=\"text-align: center; display:inline-block;\"\u003E\u003Cimg alt=\"Landing Party Collector's Edition Commander deck\" src=\"https:\u002F\u002Fmedia.wizards.com\u002F2026\u002Fimages\u002Fdaily\u002F6IF46UlXn3\u002FzyDhv30Q69.webp\" style=\"width:150px\" \u002F\u003E\n\u003Cdiv style=\"font-size:small\"\u003ELanding Party\u003Cbr\u003ECollector's Edition\u003Cbr\u003ECommander Deck\u003C\u002Fdiv\u003E\n\u003C\u002Fdiv\u003E\n\u003C\u002Fgrid-item\u003E\n\u003Cgrid-item\u003E\n\u003Cdiv style=\"text-align: center; display:inline-block;\"\u003E\u003Cimg alt=\"Klingon Fury Collector's Edition Commander deck\" src=\"https:\u002F\u002Fmedia.wizards.com\u002F2026\u002Fimages\u002Fdaily\u002F6IF46UlXn3\u002FNmddGEXcYO.webp\" style=\"width:150px\" \u002F\u003E\n\u003Cdiv style=\"font-size:small\"\u003EKlingon Fury\u003Cbr\u003ECollector's Edition\u003Cbr\u003ECommander Deck\u003C\u002Fdiv\u003E\n\u003C\u002Fdiv\u003E\n\u003C\u002Fgrid-item\u003E\n\u003Cgrid-item\u003E\n\u003Cdiv style=\"text-align: center; display:inline-block;\"\u003E\u003Cimg alt=\"We Are the Borg Collector's Edition Commander deck\" src=\"https:\u002F\u002Fmedia.wizards.com\u002F2026\u002Fimages\u002Fdaily\u002F6IF46UlXn3\u002FzNitKTf8gP.webp\" style=\"width:150px\" \u002F\u003E\n\u003Cdiv style=\"font-size:small\"\u003EWe Are the Borg\u003Cbr\u003ECollector's Edition\u003Cbr\u003ECommander Deck\u003C\u002Fdiv\u003E\n\u003C\u002Fdiv\u003E\n\u003C\u002Fgrid-item\u003E\n\u003C\u002Fresponsive-grid\u003E\n\u003C\u002Fdiv\u003E\n\n\u003Cp\u003EThe pristine, shining aesthetic of the Federation's starships has traversed the galaxy to be in your collection! Collector's Edition Commander decks include the same ready-to-play Commander deck, but every card is in surge foil! Each Collector's Edition Commander deck includes the following:\u003C\u002Fp\u003E\n\n\u003Cul\u003E\n\u003Cli\u003E1 Ready-to-play 100-card Commander deck\n\u003Cul\u003E\n\u003Cli\u003E1 Surge foil face commander with borderless art\u003C\u002Fli\u003E\n\u003Cli\u003E99 Surge foil cards, including 32 new-to-\u003Ci\u003EMagic\u003C\u002Fi\u003E cards\u003C\u002Fli\u003E\n\u003C\u002Ful\u003E\n\u003C\u002Fli\u003E\n\u003Cli\u003E10 Surge foil double-sided tokens\n\u003Cul\u003E\n\u003Cli\u003EThese tokens are surge foil on one side and non-foil on the other side.\u003C\u002Fli\u003E\n\u003C\u002Ful\u003E\n\u003C\u002Fli\u003E\n\u003Cli\u003E1 Reference card\u003C\u002Fli\u003E\n\u003Cli\u003E1 Deck box\u003C\u002Fli\u003E\n\u003C\u002Ful\u003E\n\n\u003Cp id=\"TableOfContents\" style=\"scroll-margin-top: 70px;\"\u003EYou can find the decklists for each of the revealed Commander decks below and browse the complete set once it has been revealed in the \u003Ca href=\"https:\u002F\u002Fmagic.wizards.com\u002Fen\u002Fproducts\u002Fstar-trek\u002Fcard-image-gallery\" target=\"_blank\"\u003E\u003Ci\u003EMagic: The Gathering\u003C\u002Fi\u003E | \u003Ci\u003EStar Trek\u003C\u002Fi\u003E Card Image Gallery\u003C\u002Fa\u003E.\u003C\u002Fp\u003E\n\n\u003Cul\u003E\n\u003Cli\u003E\u003Ca href=\"#FederationFleet\"\u003EFederation Fleet (Blue-Red-White)\u003C\u002Fa\u003E\u003C\u002Fli\u003E\n\u003Cli\u003E\u003Ca href=\"#LandingParty\"\u003ELanding Party (Green-White-Blue)\u003C\u002Fa\u003E\u003C\u002Fli\u003E\n\u003Cli\u003E\u003Ca href=\"#KlingonFury\"\u003EKlingon Fury (Red-White-Black)\u003C\u002Fa\u003E\u003C\u002Fli\u003E\n\u003Cli\u003E\u003Ca href=\"#WeAretheBorg\"\u003EWe Are the Borg (White-Blue-Black)\u003C\u002Fa\u003E\u003C\u002Fli\u003E\n\u003C\u002Ful\u003E\n\n\u003Cp\u003EBring along these \u003Ci\u003EMagic: The Gathering\u003C\u002Fi\u003E | \u003Ci\u003EStar Trek\u003C\u002Fi\u003E Commander decks and spend your shore leave playing \u003Ci\u003EMagic\u003C\u002Fi\u003E with friends! Commander decks, Collector's Edition Commander decks, and more release on November 13, 2026, and are available for preorder now from \u003Ca href=\"https:\u002F\u002Flocator.wizards.com\u002F?utm_source=daily_mtg&utm_medium=article_announcement&utm_content=commander&utm_campaign=trk\" target=\"_blank\"\u003Eyour local game store\u003C\u002Fa\u003E, \u003Ca href=\"https:\u002F\u002Fpartner.tcgplayer.com\u002Fk4QR5d\" target=\"_blank\"\u003ETCGplayer\u003C\u002Fa\u003E, \u003Ca href=\"https:\u002F\u002Fgtly.ink\u002FRRvpP02gTl\" gtm-event=\"retailer_cta_click\" gtm-link-text=\"Amazon\" gtm-section=\"Daily Article\" target=\"_blank\"\u003EAmazon\u003C\u002Fa\u003E, and elsewhere \u003Ci\u003EMagic\u003C\u002Fi\u003E is sold.\u003C\u002Fp\u003E\n\n\u003C!-- Update background with HEX color as needed--\u003E\n\u003Cdiv style=\"background:#ffffff; padding:12px; text-align:center;\"\u003E\n\n\u003C!--update background to manage button main color, color for text color, and solid for border color --\u003E\n  \u003Ca href=\"https:\u002F\u002Flocator.wizards.com\u002F?utm_source=daily_mtg&utm_medium=article_announcement&utm_content=commander&utm_campaign=trk\" target=\"_blank\"\n     style=\"display:inline-flex; align-items:center; justify-content:
