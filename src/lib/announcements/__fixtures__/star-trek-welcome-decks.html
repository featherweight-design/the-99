:small\"\u003EWelcome Deck\u003Cbr\u003E(Blue)\u003C\u002Fdiv\u003E\n\u003C\u002Fdiv\u003E\n\u003C\u002Fgrid-item\u003E\n\u003Cgrid-item\u003E\n\u003Cdiv style=\"text-align: center; display:inline-block;\"\u003E\u003Cimg alt=\"Welcome Deck black packaging\" src=\"https:\u002F\u002Fmedia.wizards.com\u002F2026\u002Fimages\u002Fdaily\u002FetEtB2m1pK\u002FH5Ce1HA1US.webp\" style=\"width:200px\" \u002F\u003E\n\u003Cdiv style=\"font-size:small\"\u003EWelcome Deck\u003Cbr\u003E(Black)\u003C\u002Fdiv\u003E\n\u003C\u002Fdiv\u003E\n\u003C\u002Fgrid-item\u003E\n\u003Cgrid-item\u003E\n\u003Cdiv style=\"text-align: center; display:inline-block;\"\u003E\u003Cimg alt=\"Welcome Deck red packaging\" src=\"https:\u002F\u002Fmedia.wizards.com\u002F2026\u002Fimages\u002Fdaily\u002FetEtB2m1pK\u002FZXuIAYeaRL.webp\" style=\"width:200px\" \u002F\u003E\n\u003Cdiv style=\"font-size:small\"\u003EWelcome Deck\u003Cbr\u003E(Red)\u003C\u002Fdiv\u003E\n\u003C\u002Fdiv\u003E\n\u003C\u002Fgrid-item\u003E  \n\u003Cgrid-item\u003E\n\u003Cdiv style=\"text-align: center; display:inline-block;\"\u003E\u003Cimg alt=\"Welcome Deck green packaging\" src=\"https:\u002F\u002Fmedia.wizards.com\u002F2026\u002Fimages\u002Fdaily\u002FetEtB2m1pK\u002FoS1G3oONa4.webp\" style=\"width:200px\" \u002F\u003E\n\u003Cdiv style=\"font-size:small\"\u003EWelcome Deck\u003Cbr\u003E(Green)\u003C\u002Fdiv\u003E\n\u003C\u002Fdiv\u003E\n\u003C\u002Fgrid-item\u003E \n\u003C\u002Fresponsive-grid\u003E\n\u003C\u002Fdiv\u003E\n\n\u003Cp\u003EEach \u003Ci\u003EMagic: The Gathering\u003C\u002Fi\u003E | \u003Ci\u003EStar Trek\u003C\u002Fi\u003E Welcome Deck contains the following:\u003C\u002Fp\u003E\n\n\u003Cul\u003E\n\t\u003Cli\u003E1 Monocolor deck (40 cards)\n\t\u003Cul\u003E\n\t\t\u003Cli\u003EThere are five different 40-card monocolor decks\u003C\u002Fli\u003E\n\t\t\u003Cli\u003EWelcome Decks include cards from:\n\t\t\u003Cul\u003E\n\t\t\t\u003Cli\u003E\u003Ci\u003EMagic: The Gathering\u003C\u002Fi\u003E | \u003Ci\u003EStar Trek\u003C\u002Fi\u003E (TRK)\u003C\u002Fli\u003E\n\t\t\t\u003Cli\u003E\u003Ci\u003EMagic: The Gathering\u003C\u002Fi\u003E | \u003Ci\u003EStar Trek\u003C\u002Fi\u003E Commander (TRC)\u003C\u002Fli\u003E\n\t\t\u003C\u002Ful\u003E\n\t\t\u003C\u002Fli\u003E\n\t\u003C\u002Ful\u003E\n\t\u003C\u002Fli\u003E\n\t\u003Cli\u003E1 Reference card\u003C\u002Fli\u003E\n\t\u003Cli\u003E1 Deck box\u003C\u002Fli\u003E\n\u003C\u002Ful\u003E\n\n\u003Cp\u003EYou can see the full decklists for each Welcome Deck right here and browse the individual cards in the \u003Ca href=\"https:\u002F\u002Fmagic.wizards.com\u002Fen\u002Fproducts\u002Fstar-trek\u002Fcard-image-gallery\" target=\"_blank\"\u003E\u003Ci\u003EMagic: The Gathering\u003C\u002Fi\u003E | \u003Ci\u003EStar Trek\u003C\u002Fi\u003E Card Image Gallery\u003C\u002Fa\u003E.\u003C\u002Fp\u003E\n\u003Ch2\u003EWhat Are Welcome Decks?\u003C\u002Fh2\u003E\n\u003Cp\u003EWelcome Decks offer simple, flavorful, and a perfectly logical start to your \u003Ci\u003EMagic\u003C\u002Fi\u003E journey. You'll learn the fundamentals of \u003Ci\u003EMagic\u003C\u002Fi\u003E&mdash;attacking, blocking, casting spells&mdash;through the lens of \u003Ci\u003EStar Trek\u003C\u002Fi\u003E. These decks will teach you more than just the rules of the game. They also showcase the \"color pie\" of \u003Ci\u003EMagic\u003C\u002Fi\u003E. Each of \u003Ci\u003EMagic\u003C\u002Fi\u003E's five colors has a philosophy that's associated with it.\u003C\u002Fp\u003E\n\n\u003C!--Picard, Steadfast Captain; Will Riker, Assuming Command--\u003E\n\u003Cdiv style=\"text-align: center;\"\u003E\n\t\u003Cresponsive-grid slide-view-if=\"(min-width: 10px)\"\u003E\n\t\t\u003Cgrid-item\u003E\n  \u003Ccig-card entry=\"2knldTd3tk6vAWHJeyznBj\"\u003E0193_MTGTRK_WelcNew: Picard, Steadfast Captain\u003C\u002Fcig-card\u003E\n\t\t\u003C\u002Fgrid-item\u003E\n\t\t\u003Cgrid-item\u003E\n  \u003Ccig-card entry=\"7wpoN2HeRcRMvdoA2cx2b3\"\u003E0140_MTGTRK_BegBxNew: Will Riker, Assuming Command\u003C\u002Fcig-card\u003E\n\t\t\u003C\u002Fgrid-item\u003E\n\t\u003C\u002Fresponsive-grid\u003E\n\u003C\u002Fdiv\u003E\n\n\u003Cp\u003EFor example, the color white in \u003Ci\u003EMagic\u003C\u002Fi\u003E is tied to community and cooperation. Captain Picard fits those qualities perfectly! His card in the white Welcome Deck, Picard, Steadfast Captain, leads by example and makes your other creatures stronger. Very good, \u003Ci\u003Emon capitaine\u003C\u002Fi\u003E!\u003C\u002Fp\u003E\n\n\u003C!--Kirk, Enterprising Captain; Kruge, Genesis Seeker--\u003E\n\u003Cdiv style=\"text-align: center;\"\u003E\n\t\u003Cresponsive-grid slide-view-if=\"(min-width: 10px)\"\u003E\n\t\t\u003Cgrid-item\u003E\n  \u003Ccig-card entry=\"2ZpbMSLXQeWjNEycIySlPd\"\u003E0198_MTGTRK_WelcNew: Kirk, Enterprising Captain\u003C\u002Fcig-card\u003E\n\t\t\u003C\u002Fgrid-item\u003E\n\t\t\u003Cgrid-item\u003E\n  \u003Ccig-card entry=\"4zW70n3SRkHH26DDCZhbfi\"\u003E0165_MTGTRK_BegBxNew: Kruge, Genesis Seeker\u003C\u002Fcig-card\u003E\n\t\t\u003C\u002Fgrid-item\u003E\n\t\u003C\u002Fresponsive-grid\u003E\n\u003C\u002Fdiv\u003E\n\n\u003Cp\u003EThe color red in \u003Ci\u003EMagic\u003C\u002Fi\u003E, meanwhile, is more aggressive. Red cards often depict anger, passion, and raw ferocity. \u003Ci\u003EStar Trek \u003C\u002Fi\u003Efans will instantly recognize those as qualities of the Klingon, and the red Welcome Deck is full of powerful Klingon creatures that are suited for rushing down your opponents. Kirk, Enterprising Captain shows the zeal of red in \u003Ci\u003EMagic\u003C\u002Fi\u003E, as he is steadfastly devoted to his goals and mission&mdash;sometimes to a fault.\u003C\u002Fp\u003E\n\n\u003Cp\u003EPlaying with these Welcome Decks will teach you everything you need to know about \u003Ci\u003EMagic\u003C\u002Fi\u003E, and if you know \u003Ci\u003EStar Trek\u003C\u002Fi\u003E, you'll get even more out of the experience! With tons of deep-cut references and recognizable moments, each card captures a sliver of the wide world of \u003Ci\u003EStar Trek\u003C\u002Fi\u003E.\u003C\u002Fp\u003E\n\n\u003Ch2\u003EWhere Can I Find Welcome Decks?\u003C\u002Fh2\u003E\n\n\u003Cp\u003E\u003Ci\u003EMagic: The Gathering\u003C\u002Fi\u003E | \u003Ci\u003EStar Trek\u003C\u002Fi\u003E Welcome Decks will be available at participating Wizards Play Network (WPN) game stores in the future. These decks are designed to be a teaching tool, so talk to \u003Ca href=\"https:\u002F\u002Flocator.wizards.com\u002F?utm_source=daily_mtg&utm_medium=article_feature&utm_content=welcomedecks&utm_campaign=trk\" target=\"_blank\"\u003Eyour local game store\u003C\u002Fa\u003E about how you or a friend can learn to play \u003Ci\u003EMagic \u003C\u002Fi\u003Ewith these decks.\u003C\u002Fp\u003E\n\n\u003Cp\u003EWe're bringing \u003Ci\u003EMagic: The Gathering\u003C\u002Fi\u003E | \u003Ci\u003EStar Trek\u003C\u002Fi\u003E Welcome Decks to events across the quadrant! Attendees at ST:LV, a massive \u003Ci\u003EStar Trek\u003C\u002Fi\u003E convention in Las Vegas, Nevada, can learn to play \u003Ci\u003EMagic\u003C\u002Fi\u003E with their favorite \u003Ci\u003EStar Trek\u003C\u002Fi\u003E characters. For information on future events where you can find these Welcome Decks, keep an eye on DailyMTG.\u003C\u002Fp\u003E\n\n\u003Chr \u002F\u003E\n\n\u003Cp\u003E\u003Ci\u003EMagic: The Gathering\u003C\u002Fi\u003E | \u003Ci\u003EStar Trek\u003C\u002Fi\u003E releases on November 13, 2026, and is available for preorder now from \u003Ca href=\"https:\u002F\u002Flocator.wizards.com\u002F?utm_source=daily_mtg&utm_medium=article_feature&utm_content=welcomedecks&utm_campaign=trk\" target=\"_blank\"\u003Eyour local game store\u003C\u002Fa\u003E, \u003Ca href=\"https:\u002F\u002Fpartner.tcgplayer.com\u002Fk4QR5d\" target=\"_blank\"\u003ETCGplayer\u003C\u002Fa\u003E, \u003Ca href=\"https:\u002F\u002Fgtly.ink\u002FRRvpP02gTl\" gtm-event=\"retailer_cta_click\" gtm-link-text=\"Amazon\" gtm-section=\"Daily Article\" target=\"_blank\"\u00
