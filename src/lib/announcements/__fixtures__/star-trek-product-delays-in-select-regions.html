"2026-10-16 08:00:00",publishedDateTime:"2026-10-16T08:00-07:00",excerpt:"\u003Cp\u003EUpdated availability information for select \u003Ci\u003EMagic: The Gathering\u003C\u002Fi\u003E® | \u003Ci\u003EStar Trek\u003C\u002Fi\u003E™ products at Prerelease and global tabletop release.\u003C\u002Fp\u003E",article:{body:"\u003Cp\u003EDue to production and shipping issues, select \u003Ci\u003EMagic: The Gathering\u003C\u002Fi\u003E® | \u003Ci\u003EStar Trek\u003C\u002Fi\u003E™ products may arrive later than expected, and the exact delays vary by region.\u003C\u002Fp\u003E\n\n\u003Cp\u003EFirst and foremost, Play Boosters and Prerelease Packs are on track for availability during Prerelease and release events.\u003C\u002Fp\u003E\n\n\u003Cp\u003EOther products may be delayed depending on your region. Some products may arrive after Prerelease events on November 6, while others may arrive after the set's tabletop release on November 13.\u003C\u002Fp\u003E\n\n\u003Cp\u003EThese delays are fluid, as our logistics teams are working to speed up timelines where possible, so always check with your local game store or retailer for availability information.\u003C\u002Fp\u003E\n\n\u003Cp\u003EThe list of impacted regions and products is below, and we'll provide updates here as new information becomes available.\u003C\u002Fp\u003E\n\n\u003Chr\u003E\n\n\u003Cscript\u003E\nfunction myFunction1() {\n  var x = document.getElementById(\"myDIV1\");\n  if (x.innerHTML === \"▲ North America\") {\n    x.innerHTML = \"▼ North America\";\n  } else {\n    x.innerHTML = \"▲ North America\";\n  }\n}\n\u003C\u002Fscript\u003E\n\n\u003Cdiv class=\"collapsibleBlock\"\u003E\n\u003Cdl class=\"showHideListItems\" style=\"border: 1px solid black;\"\u003E\n\u003Cdt onclick=\"myFunction1()\" style=\"cursor:pointer;\"\u003E\u003Ch2\u003E\u003Cspan id=\"myDIV1\"\u003E▲ North America\u003C\u002Fspan\u003E\u003C\u002Fh2\u003E\u003C\u002Fdt\u003E\n\u003Cdd\u003E\n\u003Cdiv class=\"wrapper\"\u003E\n\n  \u003Cbr\u003E\n\n\u003Cp\u003ECommander decks are delayed and may arrive after the tabletop release date.\u003C\u002Fp\u003E\n\n\u003C\u002Fdiv\u003E\n\u003C\u002Fdd\u003E\n\u003C\u002Fdl\u003E\n\u003C\u002Fdiv\u003E\n\n\u003Cscript\u003E\nfunction myFunction3() {\n  var x = document.getElementById(\"myDIV3\");\n  if (x.innerHTML === \"▲ Europe, the Middle East, and Africa\") {\n    x.innerHTML = \"▼ Europe, the Middle East, and Africa\";\n  } else {\n    x.innerHTML = \"▲ Europe, the Middle East, and Africa\";\n  }\n}\n\u003C\u002Fscript\u003E\n\n\u003Cdiv class=\"collapsibleBlock\"\u003E\n\u003Cdl class=\"showHideListItems\" style=\"border: 1px solid black;\"\u003E\n\u003Cdt onclick=\"myFunction3()\" style=\"cursor:pointer;\"\u003E\u003Ch2\u003E\u003Cspan id=\"myDIV3\"\u003E▲ Europe, the Middle East, and Africa\u003C\u002Fspan\u003E\u003C\u002Fh2\u003E\u003C\u002Fdt\u003E\n\u003Cdd\u003E\n\u003Cdiv class=\"wrapper\"\u003E\n\n\u003Cbr\u003E\n\n\u003Cp\u003ECollector Boosters (English, French, and German languages) are delayed and may arrive after the tabletop release date.\u003C\u002Fp\u003E\n\n\u003Cp\u003ECommander decks (French and German languages) are delayed and may arrive after Prerelease.\u003C\u002Fp\u003E\n\n\u003Cp\u003ECollector's Edition Commander decks are delayed and may arrive after Prerelease, with additional quantities arriving after the tabletop release date.\u003C\u002Fp\u003E\n\n\u003Cp\u003ECommander decks (English language), Draft Night, Scene Boxes, and Beam Me Up Bundles are delayed and may arrive after the tabletop release date.\u003C\u002Fp\u003E\n\n\u003C\u002Fdiv\u003E\n\u003C\u002Fdd\u003E\n\u003C\u002Fdl\u003E\n\u003C\u002Fdiv\u003E\n\n\u003Cscript\u003E\nfunction myFunction2() {\n  var x = document.getElementById(\"myDIV2\");\n  if (x.innerHTML === \"▲ Asia-Pacific\") {\n    x.innerHTML = \"▼ Asia-Pacific\";\n  } else {\n    x.innerHTML = \"▲ Asia-Pacific\";\n  }\n}\n\u003C\u002Fscript\u003E\n\n\u003Cdiv class=\"collapsibleBlock\"\u003E\n\u003Cdl class=\"showHideListItems\" style=\"border: 1px solid black;\"\u003E\n\u003Cdt onclick=\"myFunction2()\" style=\"cursor:pointer;\"\u003E\u003Ch2\u003E\u003Cspan id=\"myDIV2\"\u003E▲ Asia-Pacific\u003C\u002Fspan\u003E\u003C\u002Fh2\u003E\u003C\u002Fdt\u003E\n\u003Cdd\u003E\n\u003Cdiv class=\"wrapper\"\u003E\n\n\u003Cbr\u003E\n\n\u003Cp\u003ECollector Boosters, Omega Collector Boosters (single Collector Boosters available at larger retailers), Bundles, Beam Me Up Bundles, and Draft Night are delayed and may arrive after the tabletop release date.\u003C\u002Fp\u003E\n\n\u003Cp\u003EFor New Zealand, Scene Boxes are delayed and may arrive after the tabletop release date.\u003C\u002Fp\u003E\n\n\u003C\u002Fdiv\u003E\n\u003C\u002Fdd\u003E\n\u003C\u002Fdl\u003E\n\u003C\u002Fdiv\u003E"},config:{discordAlert:g}},hasError:g}}}}(void 0,"en","Linkables",301,"Main Navigation","Click",false,"NavigationGroup","https:\u002F\u002Fmagic.wizards.com\u002F",null,true,"",14,11,"announcements",10,80,20,"ComingSoon-All",9,19,"image\u002Fjpeg","Casual-FNM",12,18,"Announcements","Author","https:\u002F\u002Fmagic.wizards.com\u002Fzh-Hant\u002Fformats","https:\u002F\u002Fmagic.wizards.com\u002Fzh-Hans\u002Fformats",27,16,15,"all",29,23,22,26,33,"5QvpWDqwxh5sAZnEuFiMpN","Tag","2022-10-24T16:01:10.724Z","2026-08-11T15:12:11.068Z","Articles | Announcements","https:\u002F\u002Fmagic.wizards.com\u002Fes\u002Fproducts\u002Fcommander-masters\u002Fcard-image-gallery","image\u002Fpng",17,34,"MTG Arena","https:\u002F\u002Fmagic.wizards.com\u002Fen\u002Fmtgarena",4,24,"https:\u002F\u002Fmyaccounts.wizards.com\u002Flogin","_self","Card Database","DailyMTG","16KYD58d7OtFD4QhXVB23e","2022-10-20T00:27:15.961Z","2026-08-11T15:12:11.012Z","AUTHOR | Wizards of the Coast","\u002F\u002Fimages.ctfassets.net\u002Fs5n2t79q9icq\u002F1MgesLnyFPBXwTBRZIrQXD\u002F51a32667a11e2640b304ad71d95f877b\u002FNew_Wizards_Icon.jpeg",1169,"New_Wizards_Icon.jpeg","1MgesLnyFPBXwTBRZIrQXD","Author | Wizards of the Coast Icon","Wizar
