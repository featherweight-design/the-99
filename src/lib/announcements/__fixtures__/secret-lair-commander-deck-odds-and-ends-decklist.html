b,createdAt:O,updatedAt:P,publishedAt:a,firstPublishedAt:a,publishedVersion:m,entryTitle:Q,value:o,label:z}],publishedDate:"2026-09-27 08:00:00",publishedDateTime:"2026-09-27T08:00-07:00",excerpt:"\u003Cp\u003EEven the odds (even if those odds are oddly uneven) with \u003Ci\u003ESecret Lair\u003C\u002Fi\u003E Commander Deck: \u003Ci\u003EOdds and Ends\u003C\u002Fi\u003E and \u003Ci\u003EThe Oddlands\u003C\u002Fi\u003E—available on September 28, 2026!\u003C\u002Fp\u003E",article:{body:"\u003Cp\u003EA new Commander deck is headed to \u003Ca href=\"https:\u002F\u002Fsecretlair.wizards.com\u002Fus\u002F?utm_source=daily_mtg&utm_medium=article_announcement&utm_campaign=oddsandends\" target=\"_blank\"\u003E\u003Ci\u003ESecret Lair\u003C\u002Fi\u003E\u003C\u002Fa\u003E, and it looks&nbsp;... odd?\u003C\u002Fp\u003E\n\n\u003Cp\u003EThe cards are strange but synergistic. The art is unworldly but beautiful. The commander is cryptic—but \u003Ci\u003Efree spells\u003C\u002Fi\u003E? It all comes together to make something truly, deeply, and numerically odd. That oddity is coming to the \u003Ci\u003ESecret Lair\u003C\u002Fi\u003E storefront with \u003Ca href=\"https:\u002F\u002Fsecretlair.wizards.com\u002Fus\u002F?utm_source=daily_mtg&utm_medium=article_announcement&utm_campaign=oddsandends\" target=\"_blank\"\u003E\u003Ci\u003ESecret Lair\u003C\u002Fi\u003E Commander Deck: \u003Ci\u003EOdds and Ends\u003C\u002Fi\u003E\u003C\u002Fa\u003E. This ready-to-play and ready-to-befuddle Commander deck features the artwork of Ricardo Cavolo, complete with a strategy that's as fun to play as it is mystifying. Embrace the enigma when it comes to \u003Ci\u003ESecret Lair\u003C\u002Fi\u003E, with something special in the Chaos Vault releasing alongside it (\u003Ca href=\"#oddlands\"\u003Emore on that here\u003C\u002Fa\u003E), on September 28, 2026.\u003C\u002Fp\u003E\n\n\u003Cp\u003EFor this release, \u003Ci\u003ESecret Lair\u003C\u002Fi\u003E will be opening a 24-hour order window to help more fans get the deck. Orders placed between Monday, September 28, 2026, 9 a.m. PT and Tuesday, September 29, 2026, 8:59 a.m. PT will be fulfilled. A limited quantity will be available to ship right away, while additional orders placed during the window are expected to ship in July 2027 in North America and August 2027 in the EU and the UK.\u003C\u002Fp\u003E\n\n\u003Cemail-signup ctf-id=\"sFIzLkHagasdBI0GnUfOf\" locale=\"en\"\u003E\u003C\u002Femail-signup\u003E\n\n\u003Chr\u003E\n\n\u003Ch2\u003ESecret Lair Commander Deck: Odds and Ends Decklist\u003C\u002Fh2\u003E\n\n\u003Cdeck-list deck-title=\"Secret Lair Commander Deck: Odds and Ends\" product=\"1bnJ4UzYJAOl6vdwWaaGkD\"\u003E\n\u003Cmain-deck\u003E\nYennett, Cryptic Sovereign\nVoid Winnower\nEsper Sentinel\nReconnaissance\nSwords to Plowshares\nWeathered Wayfarer\nMisleading Signpost\nBreach the Multiverse\nVirtue of Persistence\nShadrix Silverquill\nSensei's Divining Top\nSol Ring\nAboleth Spawn\nAdarkar Wastes\nAeon Engine\nAerial Extortionist\nAminatou, the Fateshifter\nApproach of the Second Sun\nArcane Sanctum\nArcane Signet\nBrainstorm\nBreena, the Demagogue\nCaves of Koilos\nChaos Wand\nClaim Jumper\nCoalition Relic\nCommand Beacon\nCommand Tower\nCommander's Sphere\nContaminated Landscape\nDazzling Sphinx\nDoom Whisperer\nDrowned Catacomb\nEnigma Sphinx\nEthersworn Sphinx\nEvolving Wilds\nExchange of Words\nExotic Orchard\nExtinction Event\nFabled Passage\nFatespinner\nFractured Identity\nGlacial Fortress\nImprisoned in the Moon\nInniaz, the Gale Force\nIsolated Chapel\nJeskai Infiltrator\nLeadership Vacuum\nLoran of the Third Path\nMarvo, Deep Operative\nMaster of Predicaments\nMirage Mirror\nMyriad Landscape\nMystic Gate\nNadir Kraken\nOubliette\nPath of Ancestry\nPlaneswalker's Mischief\nPonder\nPrairie Stream\nProfane Transfusion\nPromise of Loyalty\nPsychic Battle\nRapid Hybridization\nReliquary Tower\nShared Fate\nSilent Clearing\nSkyclave Apparition\nSkyclave Relic\nSmuggler's Share\nSoothsaying\nSpace Beleren\nSunken Hollow\nSwift Reconfiguration\nTalisman of Progress\nTemple of Deceit\nTemple of Enlightenment\nTemple of Silence\nTerramorphic Expanse\nThief of Sanity\nTime Stop\nToxrill, the Corrosive\nUnderground River\nVega, the Watcher\nVenser's Journal\nVesuvan Drifter\nWayfarer's Bauble\nYavimaya, Cradle of Growth\n4 Plains\n4 Island\n4 Swamp\n\u003C\u002Fmain-deck\u003E\n\u003C\u002Fdeck-list\u003E\n\n\u003Cdiv style=\"text-align: center;\"\u003E\n\u003Cp style=\"font-size:smaller\"\u003E\u003Ci\u003ESecret Lair\u003C\u002Fi\u003E Commander Deck: \u003Ci\u003EOdds and Ends\u003C\u002Fi\u003E was designed by Studio X's Megan Smith.\u003C\u002Fp\u003E\n\u003C\u002Fdiv\u003E\n\n\u003Cp\u003EMeet Yennett, Cryptic Sovereign. When she's not busy testing people with various esoteric riddles, she's letting you cast spells with odd mana values for free off the top of your library. This deck is packed with splashy spells you'll want to cheat out with Yennett, like Profane Transfusion, Ethersworn Sphinx, and Master of Predicaments. But like any good riddle, this one has a trick. Stack the odds in your favor with Sensei's Divining Top, Brainstorm, and other library-manipulating abilities to ensure Yennett's ability always gives you something powerful.\u003C\u002Fp\u003E\n\n\u003Cp\u003EBeyond her quandaries, queries, and questions, Yennett is prepared to puzzle players with a profusion of perplexing spells. Take control of the board with Space Beleren; scramble the battlefield with Inniaz, the Gale Force; and build up card advantage with Thief of Sanity. Then, answer the ultimate riddle of \"Who is going to win this game?\" The answer? \u003Ci\u003EYou\u003C\u002Fi\u003E.\u003C\u002Fp\u003E\n\n\u003Cp\u003E\u003Cstrong\u003EContents\u003C\u002Fstrong\u003E:\u003C\u002Fp\u003E\n\n\u003Cul\u003E\n\t\u003Cli\u003E1x Ready-to-play 100-card Commander deck\n\t\u003Cul\u003E\n\t\t\u003Cli\u003E12x Foil cards featuring new artwork from Ricardo Cavolo\u003C\u002Fli\u003E\n\t\t\u003Cli\u003E4x Foil borderless basic Plains from \u003Ci\u003EThe Oddlands: Plains\u003C\u002Fi\u003E\u003C\u002Fli\u003E\n\t\t\u003Cli\u003E4x Foil borderless basic Islands from \u003Ci\u003EThe Oddlands: Islands\u003C\u002Fi\u003E\u003C\u002Fli\u003E\n\t\t\u003Cli\u003E4x Foil borderless basic Swamps from \u003Ci\u003EThe Oddlands: Swamps\u003C\u002Fi\u003E\u003C\u002Fli\u003E\n\t\t\u003Cli\u003E76x Non-foil reprints\u003C\u002Fli\u003E\n\t\u003C\u002Ful\u003E\n\t\u003C\u002Fli\u003E\n\t\u003Cli\u003E10x Non-foil double-sided tokens\u003C\u002Fli\u003E\n\t\u003Cli\u003E1x Yennett, Cryptic Sovereign display commander (not legal in sanctioned play)\u003C\u002Fli\u003E\n\t\u003Cli\u003E1x Deck box\u003C\u002Fli\u003E\n\u003C\u002Ful\u003E\n\n\u003Cp\u003E\u003Cstrong\u003EPrice\u003C\u002Fstrong\u003E: $149.99 USD\u003C\u002Fp\u003E\n\n\u003Ch2\u003EMeet the Cards of Odds and Ends\u003C\u002Fh2\u003E\n\n\u003Cdiv style=\"text-align: center;\"\u003E\n\t\u003Cresponsive-grid slide-view-if=\"(min-width: 10px)\"\u003E\n\t\t\u003Cgrid-item\u003E\n\u003Cmagic-card caption=\"Esper Sentinel\" entry=\"5zXzGiZXQAkti78ioZRIkz\"\u003E2123_RW01_MTGSL7_Main_OddsAndEnds: Esper Sentinel\u003C\u002Fmagic-card\u003E\n\t\t\u003C\u002Fgrid-item\u003E\n\t\t\u003Cgrid-item\u003E\n  \u003Cmagic-card caption=\"Sol Ring\" entry=\"6ire9mBgCEgPzMkulggYi1\"\u003E2132_RA02_MTGSL7_Main_OddsAndEnds: Sol Ring\u003C\u002Fcig-card\u003E\n\t\t\u003C\u002Fgrid-item\u003E\n\t\u003C\u002Fresponsive-grid\u003E\n\u003C\u002Fdiv\u003E\n\n\u003Cp\u003E\u003Ci\u003ESecret Lair\u003C\u002Fi\u003E Commander Deck: \u003Ci\u003EOdds and Ends\u003C\u002Fi\u003E puts the spotlight on Ricardo Cavolo's artwork, and it's a fitting tribute to his unique style that blends contemporary artwork with traditional techniques. The deck contains 12 foil cards with new artwork that you'll only find in this Commander deck. Every part of these cards, from the artwork to the layout of the rules text, was crafted by Cavolo. With illustrations that spill out from the card frame and into the card's text box to wild reinterpretations of iconic Commander staples, these cards are sure to catch the attention of your fellow players (right before Yennett lets you cast them for free).\u003C\u002Fp\u003E\n\n\u003Cscript\u003E\nfunction myFunction1() {\n  var x = document.getElementById(\"myDIV1\");\n  if (x.innerHTML === \"▲ Click to see foil cards\") {\n    x.innerHTML = \"▼ Click to hide foil cards\";\n  } else {\n    x.innerHTML = \"▲ Click to see foil cards\";\n  }\n}\n\u003C\u002Fscript\u003E\n\n\u003Cdiv class=\"collapsibleBlock\"\u003E\n\u003Cdl class=\"showHideListItems\" style=\"border: 1px solid black;\"\u003E\n\u003Cdt onclick=\"myFunction1()\" style=\"cursor:pointer;\"\u003E\u003Ch2\u003E\u003Cspan id=\"myDIV1\"\u003E▲ Click to see foil cards\u003C\u002Fspan\u003E\u003C\u002Fh2\u003E\u003C\u002Fdt\u003E\n\u003Cdd\u003E\n\u003Cdiv class=\"wrapper\"\u003E\n\n  \u003Cbr\u003E\n\n\u003Cdiv style=\"text-align: center;\"\u003E\n\t\u003Cresponsive-grid slide-view-if=\"(min-width: 10px)\"\u003E\n\t\t\u003Cgrid-item\u003E\n\u003Cmagic-card caption=\"Yennett, Cryptic Sovereign\" entry=\"37TmkwNMcJii0FynI5bu2D\"\u003E2121_MZ11_MTGSL7_Main_OddsAndEnds: Yennett, Cryptic Sovereign\u003C\u002Fmagic-card\u003E\n\t\t\u003C\u002Fgrid-item\u003E\n\t\t\u003Cgrid-item\u003E\n\u003Cmagic-card caption=\"Void Winnower\" entry=\"7xUCzCrYyhWsrCeySu3kXc\"\u003E2122_MC01_MTGSL7_Main_OddsAndEnds: Void Winnower\u003C\u002Fmagic-card\u003E\n\t\t\u003C\u002Fgrid-item\u003E\n\t\t\u003Cgrid-item\u003E\n\u003Cmagic-card caption=\"Esper Sentinel\" entry=\"5zXzGiZXQAkti78ioZRIkz\"\u003E2123_RW01_MTGSL7_Main_OddsAndEnds: Esper Sentinel\u003C\u002Fmagic-card\u003E\n\t\t\u003C\u002Fgrid-item\u003E\n\t\t\u003Cgrid-item\u003E\n\u003Cmagic-card caption=\"Reconnaissance\" entry=\"11UY5FJE9TxyiN7N7g8w9O\"\u003E2124_RW02_MTGSL7_Main_OddsAndEnds: Reconnaissance\u003C\u002Fmagic-card\u003E\n\t\t\u003C\u002Fgrid-item\u003E\n\t\t\u0 nique aesthetic.\u003C\u002Fp\u003E\n\n\u003Cp\u003EDon't get stumped by a confusing board state! \u003Ci\u003ESecret Lair\u003C\u002Fi\u003E Commander Deck: \u003Ci\u003EOdds and Ends\u003C\u002Fi\u003E includes 10 non-foil double-sided tokens. Summon a swath of slugs with Toxrill, the Corrosive; pull your foes into the depths with Nadir Kraken's Tentacles; keep your coffers full with Treasure tokens from Smuggler's Share; and more. All of the tokens feature artwork from past \u003Ci\u003EMagic\u003C\u002Fi\u003E releases.\u003C\u002Fp\u003E\n\n\u003Cp\u003E\u003Cstrong\u003E\u003Ci\u003ESecret Lair\u003C\u002Fi\u003E Commander Deck: \u003Ci\u003EOdds and Ends\u003C\u002Fi\u003E Tokens\u003C\u002Fstrong\u003E:\u003C\u002Fp\u003E\n\n\u003Cul\u003E\n\t\u003Cli\u003E10x Non-foil double-sided tokens\n\t\u003Cul\u003E\n\t\t\u003Cli\u003E2x Slug (VOW) \u002F\u002F Copy (BLC) tokens\u003C\u002Fli\u003E\n\t\t\u003Cli\u003E2x Inkling (STX) \u002F\u002F Treasure (SNC) tokens\u003C\u002Fli\u003E\n\t\t\u003Cli\u003E1x Tentacle (MKC) \u002F\u002F Illusion (M3C) token\u003C\u002Fli\u003E\n\t\t\u003Cli\u003E1x Tentacle (MKC) \u002F\u002F Frog Lizard (LCC) token\u003C\u002Fli\u003E\n\t\t\u003Cli\u003E1x Tentacle (MKC) \u002F\u002F Copy (BLC) token\u003C\u002Fli\u003E\n\t\t\u003Cli\u003E1x Slug (VOW) \u002F\u002F Tentacle (MKC) token\u003C\u002Fli\u003E\n\t\t\u003Cli\u003E1x Slug (VOW) \u002F\u002F Inkling (STX) token\u003C\u002Fli\u003E\n\t\t\u003Cli\u003E1x Inkling (STX) \u002F\u002F Horror (C18) token\u003C\u002Fli\u003E\n\t\u003C\u002Ful\u003E\n\t\u003C\u002Fli\u003E\n\u003C\u002Ful\u003E\n\n\u003Ch2 id=\"oddlands\" style=\"scroll-margin-top: 70px;\"\u003EChaos Vault: The Oddlands\u003C\u002Fh2\u003E\n\n\u003Cdiv style=\"text-align: center;\"\u003E\n\t\u003Cresponsive-grid slide-view-if=\"(max-width: 850px)\"\u003E\n\t\t\u003Cgrid-item\u003E\n\u003Cmagic-card caption=\"(From \u003Ci\u003EThe Oddlands: Plains\u003C\u002Fi\u003E)\" face=\"https:\u002F\u002Fmedia.wizards.com\u002F2026\u002Fimages\u002Fdaily\u002Fl2ZGbrvPWD\u002FZLDbcv3kAV.webp\"\u003EPlains\u003C\u002Fmagic-card\u003E\n\t\t\u003C\u002Fgrid-item\u003E\n\t\t\u003Cgrid-item\u003E\n\u003Cmagic-card caption=\"(From \u003Ci\u003EThe Oddlands: Island\u003C\u002Fi\u003E)\" face=\"https:\u002F\u002Fmedia.wizards.com\u002F2026\u002Fimages\u002Fdaily\u002Fl2ZGbrvPWD\u002F0mF4rDXPXV.webp\"\u003EIsland\u003C\u002Fmagic-card\u003E\n\t\t\u003C\u002Fgrid-item\u003E\n\t\t\u003Cgrid-item\u003E\n\u003Cmagic-card caption=\"(From \u003Ci\u003EThe Oddlands: Swamp\u003C\u002Fi\u003E)\" face=\"https:\u002F\u002Fmedia.wizards.com\u002F2026\u002Fimages\u002Fdaily\u002Fl2ZGbrvPWD\u002FeSCPiTkjLH.webp\"\u003ESwamp\u003C\u002Fmagic-card\u003E\n\t\t\u003C\u002Fgrid-item\u003E\n\t\t\u003Cgrid-item\u003E\n\u003Cmagic-card caption=\"(From \u003Ci\u003EThe Oddlands: Mountain\u003C\u002Fi\u003E)\" face=\"https:\u002F\u002Fmedia.wizards.com\u002F2026\u002Fimages\u002Fdaily\u002Fl2ZGbrvPWD\u002FxIaCNRwUfO.webp\"\u003EMountain\u003C\u002Fmagic-card\u003E\n\t\t\u003C\u002Fgrid-item\u003E\n\t\t\u003Cgrid-item\u003E\n\u003Cmagic-card caption=\"(From \u003Ci\u003EThe Oddlands: Forest\u003C\u002Fi\u003E)\" face=\"https:\u002F\u002Fmedia.wizards.com\u002F2026\u002Fimages\u002Fdaily\u002Fl2ZGbrvPWD\u002FJKQsJKyQQU.webp\"\u003EForest\u003C\u002Fmagic-card\u003E\n\t\t\u003C\u002Fgrid-item\u003E\n\t\u003C\u002Fresponsive-grid\u003E\n\u003C\u002Fdiv\u003E\n\n\u003Cp\u003EVexing vistas are headed to \u003Ci\u003ESecret Lair\u003C\u002Fi\u003E's Chaos Vault! As part of the launch of this Commander deck, we're releasing five special versions of \u003Ci\u003EThe Oddlands\u003C\u002Fi\u003E, one for each basic land type. Each contains 10 copies of its respective basic land. Cavolo brought his vision for each basic land to life across five eccentric illustrations, with art depicting the spirit of raw, elemental magic. Note that the Plains, Islands, and Swamps in \u003Ci\u003ESecret Lair\u003C\u002Fi\u003E Commander Deck: \u003Ci\u003EOdds and Ends\u003C\u002Fi\u003E are the same ones that appear in their respective version of \u003Ci\u003EThe Oddlands\u003C\u002Fi\u003E.\u003C\u002Fp\u003E\n\n\u003Cp\u003EAs is tradition with the Chaos Vault, we're trying something new. For every three (3) copies of \u003Ci\u003EThe Oddlands\u003C\u002Fi\u003E you add to your cart, we'll give you the cheapest one for free. The discount is applied automatically, and no promo code is required. Three is an odd number, and around here, that has its advantages.\u003C\u002Fp\u003E\n\n\u003Cp\u003E\u003Cstrong\u003EContents\u003C\u002Fstrong\u003E:\u003C\u002Fp\u003E\n\n\u003Cul\u003E\n\t\u003Cli\u003E10x Basic lands\u003C\u002Fli\u003E\n\u003C\u002Ful\u003E\n\n\u003Cp\u003E\u003Cstrong\u003EPrice\u003C\u002Fstrong\u003E:\u003C\u002Fp\u003E\n\n\u003Cul\u003E\n\t\u003Cli\u003ENon-foil: $29.99 USD\u003C\u002Fli\u003E\n\t\u003Cli\u003EFoil: $39.99 USD\u003C\u002Fli\u003E\n\u003C\u002Ful\u003E\n\n\u003Chr\u003E\n\n\u003Ch2\u003EEven the Odds on September 28\u003C\u002Fh2\u003E\n\n\u003Cp\u003EYennett has one final question for you: Will you be there when \u003Ci\u003ESecret Lair\u003C\u002Fi\u003E Commander Deck: \u003Ci\u003EOdds and Ends\u003C\u002Fi\u003E and \u003Ci\u003EThe Oddlands\u003C\u002Fi\u003E launch on September 28, 2026, at 9 a.m. PT, only on \u003Ca href=\"https:\u002F\u002Fsecretlair.wizards.com\u002Fus\u002F?utm_source=daily_mtg&utm_medium=article_announcement&utm_campaign=oddsandends\" target=\"_blank\"\u003EMagicSecretLair.com\u003C\u002Fa\u003E? Get ready to bring this charming oddity to your Commander collection and bolster your mana with the artwork of Ricardo Cavolo. Sign up to be notified when it arrives, and you'll stay in the loop for what's next.\u003C\u002Fp\u003E\n\n\u003Cemail-signup ctf-id=\"sFIzLkHagasdBI0GnUfOf\" locale=\"en\"\u003E\u003C\u002Femail-signup\u003E"}},hasError:g}}}}(void 0,"en","Linkables",301,"Main Navigation","Click",false,"NavigationGroup","https:\u002F\u002Fmagic.wi
