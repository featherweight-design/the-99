titch in Time side a\" src=\"https:\u002F\u002Fmedia.wizards.com\u002F2021\u002Fimages\u002Fdaily\u002Fx1jJ0MIrhf.png\" \u002F\u003E\u003C\u002Fdiv\u003E\r\n\r\n\u003Cdiv class=\"side back\"\u003E\u003Cimg alt=\"Stitch in Time side b\" src=\"https:\u002F\u002Fmedia.wizards.com\u002F2021\u002Fimages\u002Fdaily\u002FSD1hO6TFqb.png\" \u002F\u003E\u003C\u002Fdiv\u003E\r\n\u003C\u002Fdiv\u003E\r\n\r\n\u003Cdiv class=\"control\"\u003E\u003Cbutton\u003ETurn Over\u003C\u002Fbutton\u003E\u003C\u002Fdiv\u003E\r\n\u003C\u002Fdiv\u003E\r\n\r\n\u003Cdiv class=\"flipping-image\"\u003E\r\n\u003Cdiv class=\"image\"\u003E\r\n\u003Cdiv class=\"side front\"\u003E\u003Cimg alt=\"Krark's Thumb side a\" src=\"https:\u002F\u002Fmedia.wizards.com\u002F2021\u002Fimages\u002Fdaily\u002FMmnj3axj71.png\" \u002F\u003E\u003C\u002Fdiv\u003E\r\n\r\n\u003Cdiv class=\"side back\"\u003E\u003Cimg alt=\"Krark's Thumb side b\" src=\"https:\u002F\u002Fmedia.wizards.com\u002F2021\u002Fimages\u002Fdaily\u002F4scAniKBZx.png\" \u002F\u003E\u003C\u002Fdiv\u003E\r\n\u003C\u002Fdiv\u003E\r\n\r\n\u003Cdiv class=\"control\"\u003E\u003Cbutton\u003ETurn Over\u003C\u002Fbutton\u003E\u003C\u002Fdiv\u003E\r\n\u003C\u002Fdiv\u003E\r\n\u003C\u002Fdiv\u003E\r\n\r\n\u003Cstrong\u003E\u003Cem\u003E(Editor's Note: The decklists below pull the newest printing of each card automatically from \u003C\u002Fem\u003E\u003C\u002Fstrong\u003E\u003Ca href=\"https:\u002F\u002Fgatherer.wizards.com\u002FPages\u002FDefault.aspx\" target=\"_blank\"\u003E\u003Cstrong\u003EGatherer\u003C\u002Fstrong\u003E\u003C\u002Fa\u003E\u003Cstrong\u003E\u003Cem\u003E, including printings which are not in this product. This decklist is \u003Cu\u003Enot\u003C\u002Fu\u003E a card-for-card product display but rather an interactive list of the cards included in the deck.)\u003C\u002Fem\u003E\u003C\u002Fstrong\u003E\r\n\r\n\u003Cdeck-list\u003E\u003Clegacy\u003E\r\nTitle: Heads I Win, Tails You Lose\r\nFormat: Commander\r\nCommander: Zndrsplt, Eye of Wisdom and Okaun, Eye of Chaos\r\n1 Zndrsplt, Eye of Wisdom\r\n1 Okaun, Eye of Chaos\r\n1 Propaganda\r\n1 Stitch in Time\r\n1 Krark's Thumb\r\n1 Blasphemous Act\r\n1 Daretti, Scrap Savant\r\n1 Goblin Kaboomist\r\n1 Krark, the Thumbless\r\n1 Niv-Mizzet, Parun\r\n1 Spark Double\r\n1 Temple of Epiphany\r\n1 Wandering Fumarole\r\n1 Buried Ruin\r\n1 Fabricate\r\n1 Fiery Gambit\r\n1 Frenetic Sliver\r\n1 Goblin Archaeologist\r\n1 Great Furnace\r\n1 Izzet Boilerworks\r\n1 Izzet Signet\r\n1 Karplusan Minotaur\r\n1 Lightning Greaves\r\n1 Mind Stone\r\n1 Myriad Landscape\r\n1 Negate\r\n1 Path of Ancestry\r\n1 Ral Zarek\r\n1 Rogue's Passage\r\n1 Swiftfoot Boots\r\n1 Sword of Vengeance\r\n1 Tavern Scoundrel\r\n1 Thought Vessel\r\n1 Tribute Mage\r\n1 Whispersilk Cloak\r\n7 Island\r\n8 Mountain\r\n1 Academy Ruins\r\n1 Bloodsworn Steward\r\n1 Boompile\r\n1 Cascade Bluffs\r\n1 Chandra's Ignition\r\n1 Chaos Warp\r\n1 Commander's Plate\r\n1 Desolate Lighthouse\r\n1 Embercleave\r\n1 Exotic Orchard\r\n1 Flamekin Village\r\n1 Gamble\r\n1 Goblin Engineer\r\n1 Inventors' Fair\r\n1 Mirror March\r\n1 Reshape\r\n1 Seize the Day\r\n1 Shadowspear\r\n1 Shivan Reef\r\n1 Spinerock Knoll\r\n1 Sulfur Falls\r\n1 The Locust God\r\n1 Tolaria West\r\n1 Training Center\r\n1 Whir of Invention\r\n1 Yusri, Fortune's Flame\r\n1 Arcane Signet\r\n1 Chance Encounter\r\n1 Command Tower\r\n1 Counterspell\r\n1 Crooked Scales\r\n1 Footfall Crater\r\n1 Impulsive Maneuvers\r\n1 Long-Term Plans\r\n1 Mogg Assassin\r\n1 Muddle the Mixture\r\n1 Planar Chaos\r\n1 Ponder\r\n1 Preordain\r\n1 Reliquary Tower\r\n1 Risky Move\r\n1 Sakashima the Impostor\r\n1 Serum Visions\r\n1 Slip Through Space\r\n1 Sol Ring\r\n1 Squee's Revenge\r\n1 Talisman of Creativity\r\n1 Temple of the False God\r\n1 Temur Battle Rage\r\n1 Vandalblast\r\n\r\n\u003C\u002Flegacy\u003E\u003C\u002Fdeck-list\u003E\r\n\r\nBut don't take our word for it—here's what designer Gavin Verhey had to say about it.\r\n\r\n\u003Ciframe allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" allowfullscreen=\"\" frameborder=\"0\" height=\"315\" src=\"https:\u002F\u002Fwww.youtube.com\u002Fembed\u002FK_LtRB3m0vY\" width=\"560\"\u003E\u003C\u002Fiframe\u003E\r\n\r\n\"I've loved Zndrsplt and Okaun ever since I made them in \u003Cem\u003EBattlebond\u003C\u002Fem\u003E—and this Commander deck out of my personal collection puts them center stage! It looks so lovable and innocent\u003Cnbsp\u003E . . .\u003C\u002Fnbsp\u003E and then by the time you've started attacking people for lethal, it's too late to stop your coin-flipping reign of terror.\r\n\r\n\"You'll want to spend the early turns building up your mana rocks and Equipment and playing some silly coin-flip cards. Then, start deploying your Commanders! Usually, I suggest starting with Zndrsplt so you can start flipping coins and drawing cards. Your opponents will think it's so cute and laugh. 'Look at the funny coin-flip deck! Haha.'\r\n\r\n\"And that's when you know you've got them. Deploy Okaun—the way this deck normally kills. If you have some Equipment, suit him up! You just need to win three coin flips to kill with Okaun using Commander damage—and maybe less with the right Equipment. I've attacked for over 10,000 damage with a single Okaun before! They'll try to remove it, but that's what your counterspells are for. If there are creatures in the way, you can sneak it through with cards that grant unblockability. Or if you really want the table to flip out, use Chandra's Ignition so your 10,000 power (or similar) Okaun kills the table at once!\r\n\r\n\"If you have any questions about how the deck plays, you can hit me up on Twitter \u003Ca href=\"https:\u002F\u002Ftwitter.com\u002FGavinVerhey\" target=\"_blank\"\u003E@gavinverhey\u003C\u002Fa\u003E. Enjoy!\"\r\n\r\n\u003Ch1\u003EAdditional Details\u003C\u002Fh1\u003E\r\n\r\nWhile five cards feature new artwork for this \u003Cem\u003ESecret Lair\u003C\u002Fem\u003E drop, there are 95 more cards being reprinted!
