atedAt:O,updatedAt:P,publishedAt:a,firstPublishedAt:a,publishedVersion:m,entryTitle:Q,value:o,label:z}],publishedDate:"2026-10-27 09:00:00",publishedDateTime:"2026-10-27T09:00-07:00",excerpt:"\u003Cp\u003E\u003Ci\u003ESecret Lair\u003C\u002Fi\u003E heads to the final frontier with Set Phasers to Superdrop! Join the crew when these drops launch on November 9, 2026!\u003C\u002Fp\u003E",article:{body:"\u003Cp\u003ECue the theme songs and title sequences, because Set Phasers to Superdrop arrives on November 9, 2026, just in time for the release of \u003Ca href=\"https:\u002F\u002Fmagic.wizards.com\u002Fen\u002Fproducts\u002Fstar-trek\" target=\"_blank\"\u003E\u003Ci\u003EMagic: The Gathering\u003C\u002Fi\u003E® | \u003Ci\u003EStar Trek\u003C\u002Fi\u003E™\u003C\u002Fa\u003E. This Superdrop features all the excitement you'd expect from a spacefaring excursion and is sure to delight fans of the \u003Ci\u003EStar Trek\u003C\u002Fi\u003E universe—from TOS to LD.\u003C\u002Fp\u003E\n\n\u003Cdiv style=\"text-align: center;\"\u003E\n\u003Cmagic-card face=\"https:\u002F\u002Fmedia.wizards.com\u002F2026\u002Fimages\u002Fdaily\u002FhwwUNgzyFB\u002F6eamMy3NMg.webp\" caption=\"Return of the Wildspeaker\"\u003E\u003C\u002Fmagic-card\u003E\n\u003C\u002Fdiv\u003E\n\n\u003Cp\u003EIt appears this Superdrop debrief experienced a minor transporter issue, but there's nothing to be alarmed about. You'll receive one (1) foil Return of the Wildspeaker as \"Transporter Boondoggle\" promo card for every $199.99 spent while supplies last. Orders over $99 ship free—see \u003Ca href=\"https:\u002F\u002Fsecretlair.wizards.com\u002Fus\u002F?utm_source=daily_mtg&utm_medium=article_announcement&utm_campaign=setphaserstosuperdrop\" target=\"_blank\"\u003EMagicSecretLair.com\u003C\u002Fa\u003E for details and terms. \u003Ci\u003ESecret Lair\u003C\u002Fi\u003E is not responsible for any potential Tuvix incidents.\u003C\u002Fp\u003E\n\n\u003Cp\u003EPrepare your bridge crew for the launch of Set Phasers to Superdrop on November 9! Here's a quick checklist to make sure you're set before the sale begins:\u003C\u002Fp\u003E\n\n\u003Cul\u003E\n\t\u003Cli\u003ECreate a Wizards Account: For a faster checkout save your shipping and payment info at \u003Ca href=\"https:\u002F\u002Fmyaccounts.wizards.com\u002Fregistration\" target=\"_blank\"\u003Emyaccounts.wizards.com\u002Fregistration\u003C\u002Fa\u003E.\u003C\u002Fli\u003E\n\t\u003Cli\u003EDouble-check your address: Make sure your shipping details are current so your order arrives at the right place.\u003C\u002Fli\u003E\n\t\u003Cli\u003EEnter the pre-queue: The pre-queue opens at 8 a.m. PT, 1 hour before the sale goes live at 9 a.m. PT. To enter the pre-queue, add any product to your cart and proceed to checkout.\u003C\u002Fli\u003E\n\t\u003Cli\u003EQueue placement: When the sale begins, customers already in the pre-queue are randomly assigned a spot in line. Anyone who proceeds to checkout after 9 a.m. PT enters the queue in the order they proceed to checkout.\u003C\u002Fli\u003E\n\t\u003Cli\u003EPlease note: Adding products to your cart does not reserve them. Products are only secured once checkout is completed.\u003C\u002Fli\u003E\n\u003C\u002Ful\u003E\n\n\u003Cp\u003EAdventure awaits at every turn—whether it's an away team mission or some scenic shore leave. You can explore five drops from Set Phasers to Superdrop below (with a sixth drop to be revealed later) and prepare for its arrival on November 9, only on \u003Ca href=\"https:\u002F\u002Fsecretlair.wizards.com\u002Fus\u002F?utm_source=daily_mtg&utm_medium=article_announcement&utm_campaign=setphaserstosuperdrop\" target=\"_blank\"\u003EMagicSecretLair.com\u003C\u002Fa\u003E. Sign up for further communications from the \u003Ci\u003ESecret Lair\u003C\u002Fi\u003E crew, including where our continuing mission will take us next.\u003C\u002Fp\u003E\n\n\u003Cemail-signup ctf-id=\"sFIzLkHagasdBI0GnUfOf\" locale=\"en\"\u003E\u003C\u002Femail-signup\u003E\n\n\u003Chr\u003E\n\n\u003Ch2\u003ESecret Lair x Star Trek: New Worlds\u003C\u002Fh2\u003E\n\n\u003Cdiv style=\"text-align: center;\"\u003E\n\t\u003Cresponsive-grid slide-view-if=\"(max-width: 850px)\"\u003E\n\t\t\u003Cgrid-item\u003E\n\t\t\t\u003Cmagic-card caption=\"Plains\" face=\"https:\u002F\u002Fmedia.wizards.com\u002F2026\u002Fimages\u002Fdaily\u002FhwwUNgzyFB\u002FNBVTU1XzMa.webp\" back=\"\"\u003E\u003C\u002Fmagic-card\u003E\n\t\t\u003C\u002Fgrid-item\u003E\n\t\t\u003Cgrid-item\u003E\n\t\t\t\u003Cmagic-card caption=\"Island\" face=\"https:\u002F\u002Fmedia.wizards.com\u002F2026\u002Fimages\u002Fdaily\u002FhwwUNgzyFB\u002F2LcFZJcFNm.webp\" back=\"\"\u003E\u003C\u002Fmagic-card\u003E\n\t\t\u003C\u002Fgrid-item\u003E\n\t\t\u003Cgrid-item\u003E\n\t\t\t\u003Cmagic-card caption=\"Swamp\" face=\"https:\u002F\u002Fmedia.wizards.com\u002F2026\u002Fimages\u002Fdaily\u002FhwwUNgzyFB\u002FPlNFlBItdR.webp\" back=\"\"\u003E\u003C\u002Fmagic-card\u003E\n\t\t\u003C\u002Fgrid-item\u003E\n\t\t\u003Cgrid-item\u003E\n\t\t\t\u003Cmagic-card caption=\"Mountain\" face=\"https:\u002F\u002Fmedia.wizards.com\u002F2026\u002Fimages\u002Fdaily\u002FhwwUNgzyFB\u002F4SNQKOG5u6.webp\" back=\"\"\u003E\u003C\u002Fmagic-card\u003E\n\t\t\u003C\u002Fgrid-item\u003E\n\t\t\u003Cgrid-item\u003E\n\t\t\t\u003Cmagic-card caption=\"Forest\" face=\"https:\u002F\u002Fmedia.wizards.com\u002F2026\u002Fimages\u002Fdaily\u002FhwwUNgzyFB\u002F8ZeYHHYHWv.webp\" back=\"\"\u003E\u003C\u002Fmagic-card\u003E\n\t\t\u003C\u002Fgrid-item\u003E\n\t\u003C\u002Fresponsive-grid\u003E\n\u003C\u002Fdiv\u003E\n\n\u003Cp\u003E\u003Cb\u003EContents\u003C\u002Fb\u003E:\u003C\u002Fp\u003E\n\n\u003Cul\u003E\n\t\u003Cli\u003E2x Plains\u003C\u002Fli\u003E\n\t\u003Cli\u003E2x Island\u003C\u002Fli\u003E\n\t\u003Cli\u003E2x Swamp\u003C\u002Fli\u003E\n\t\u003Cli\u003E2x Mountain\u003C\u002Fli\u003E\n\t\u003Cli\u003E2x Forest\u003C\u002Fli\u003E\n\u003C\u002Ful\u003E\n\n\u003Cp\u003E\u003Cb\u003EPrice\u003C\u002Fb\u003E:\u003C\u002Fp\u003E\n\n\u003Cul\u
