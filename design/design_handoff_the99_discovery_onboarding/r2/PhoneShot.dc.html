<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Part · a real phone screen, with the ? and its sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=Cinzel:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="{{ frame }}">
  <img src="{{ src }}" alt="{{ alt }}" style="position:absolute;left:0;top:0;width:390px;height:520px;display:block">
  <sc-if value="{{ header }}" hint-placeholder-val="{{ true }}"><div style="position:absolute;left:0;top:0"><dc-import name="MobileHeader" help="{{ help }}" hint-size="390px,79px"></dc-import></div></sc-if>
  <sc-if value="{{ hasHalo }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="{{ haloBox }}"></span></sc-if>
  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;background:rgba(10,8,6,.62)"></div>
    <div style="position:absolute;left:0;bottom:0"><dc-import name="HelpSheet" mode="phone" screen="{{ screen }}" q="{{ q }}" open="{{ entry }}" h="{{ sheetH }}" hint-size="390px,684px"></dc-import></div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"shot":{"editor":"enum","options":["decktop","collection","shopping","shophead","deck","cuts","tuning"],"default":"decktop"},"open":{"editor":"boolean","default":false},"screen":{"editor":"enum","options":["deck","shopping","collection"],"default":"deck"},"q":{"editor":"text","default":""},"entry":{"editor":"text","default":""},"halo":{"editor":"text","default":""},"$preview":{"width":390,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const B = { decktop: '7f0504e321d3cca692c36bc413aa949b', collection: '94f9af34c3563ac119db91210f6f5fd5', shopping: 'f8eed56ec6ab107d09ba00a4606122cb', shophead: 'fdbfafd2d6c7e4f243daa8f113f4aab5', deck: '3e4343cba37858d0124e9b9184a79a40', cuts: '388483197e0cb25764d44b8daf802abf', tuning: '9213f4d3f20f8f6b632c5a62d220a400' };
    const shot = p.shot ?? 'decktop';
    const open = p.open === true || p.open === 'true';
    const header = shot === 'decktop' || shot === 'collection';
    const h = open ? 844 : 520;
    const halo = (p.halo ?? '').split(',').map(Number);
    const hasHalo = halo.length === 4 && !open;
    return {
      src: '/_blob/' + B[shot], alt: 'The 99 on a phone', header, help: open ? 'open' : 'shown', open,
      screen: p.screen ?? 'deck', q: p.q ?? '', entry: p.entry ?? '', sheetH: 684,
      hasHalo, haloBox: hasHalo ? `position:absolute;left:${halo[0]}px;top:${halo[1]}px;width:${halo[2]}px;height:${halo[3]}px;border-radius:9px;box-shadow:0 0 0 2px rgba(207,135,69,.75),0 0 0 6px rgba(207,135,69,.2);pointer-events:none` : '',
      frame: `position:relative;width:390px;height:${h}px;overflow:hidden;background:#14110E;border:1px solid #3A3229;border-radius:18px;box-sizing:border-box`,
    };
  }
}
</script>
</body>
</html>
