<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Part · phone header</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=Cinzel:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<header style="width:390px;height:79px;box-sizing:border-box;padding:20px 20px 14px;border-bottom:1px solid #2B241B;background:#14110E;display:flex;align-items:flex-end;justify-content:space-between">
  <div style="display:flex;align-items:flex-end;gap:3px">
    <span style="font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.4em;color:#CF8745;padding-bottom:4px">THE</span>
    <span style="font-family:'Cinzel',serif;font-size:24px;line-height:1;color:#EDE6D8">99</span>
  </div>
  <div style="display:flex;align-items:center;gap:6px">
  <sc-if value="{{ hasHelp }}" hint-placeholder-val="{{ true }}">
    <button type="button" aria-label="About this screen" aria-expanded="{{ helpOpen }}" style="{{ helpStyle }}">?</button>
  </sc-if>
  <div style="padding:3px;border-radius:15px;{{ halo }}">
    <span style="display:flex;align-items:center;justify-content:center;width:38px;height:38px;box-sizing:border-box;border-radius:12px;background:#14110E;border:1px solid #CF8745;font-family:'IBM Plex Mono',monospace;font-size:13px;color:#CF8745">HH</span>
  </div>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"halo":{"editor":"boolean","default":false},"help":{"editor":"enum","options":["none","shown","open"],"default":"shown"},"$preview":{"width":390,"height":79}}'>
class Component extends DCLogic {
  renderVals() {
    const on = this.props.halo === true || this.props.halo === 'true';
    const help = this.props.help ?? 'shown';
    const helpStyle = 'width:44px;height:44px;border-radius:12px;border:0;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:\'IBM Plex Mono\',monospace;font-size:17px;font-weight:500;' + (help === 'open' ? 'background:#29241F;color:#EDE6D8;' : 'background:transparent;color:#A59C89;');
    return { halo: on ? 'box-shadow:0 0 0 2px rgba(207,135,69,.6),0 0 0 6px rgba(207,135,69,.16);' : '', hasHelp: help !== 'none', helpOpen: help === 'open' ? 'true' : 'false', helpStyle };
  }
}
</script>
</body>
</html>
