<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Part · phone tab bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=Cinzel:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Primary" style="width:390px;height:74px;box-sizing:border-box;padding:8px 8px 14px;background:#1A1611;border-top:1px solid #2B241B;display:flex">
  <sc-for list="{{ items }}" as="it" hint-placeholder-count="5">
    <span style="{{ it.style }}">
      <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="{{ it.d }}"></path></svg>
      <span style="font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.06em">{{ it.label }}</span>
    </span>
  </sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","collection","commanders","discover","decks"],"default":"decks"},"halo":{"editor":"enum","options":["none","discover"],"default":"none"},"$preview":{"width":390,"height":74}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'decks';
    const halo = this.props.halo ?? 'none';
    const defs = [
      ['home', 'Home', 'M3.5 9 10 4l6.5 5v7.5h-4.25v-4.5h-4.5v4.5H3.5z'],
      ['collection', 'Collection', 'M3.5 3.5h5v5h-5zM11.5 3.5h5v5h-5zM3.5 11.5h5v5h-5zM11.5 11.5h5v5h-5z'],
      ['commanders', 'Commanders', 'M3 14 4.5 6l3.5 3.5L10 5l2 4.5L15.5 6 17 14zM3 16.5h14'],
      ['discover', 'Discover', 'M10 3a7 7 0 1 0 0 14a7 7 0 1 0 0-14zM10 6.5 13.5 10 10 13.5 6.5 10z'],
      ['decks', 'Decks', 'M4 6.5h9.5v10.5H4zM6.5 3.5h9.5v10.5'],
    ];
    const items = defs.map(([k, label, d]) => ({
      label, d,
      style: 'flex:1;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:12px;' +
        (k === active ? 'background:#1B1712;color:#EDE6D8;' : 'color:#8B8270;') +
        (halo === k ? 'box-shadow:0 0 0 2px rgba(207,135,69,.6),0 0 0 6px rgba(207,135,69,.16);' : ''),
    }));
    return { items };
  }
}
</script>
</body>
</html>
