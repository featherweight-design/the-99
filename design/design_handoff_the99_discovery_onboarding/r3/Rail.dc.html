<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Part · desktop rail, themed, with the first-run lock</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=Cinzel:wght@500;600;700&amp;family=Metamorphous&amp;family=Cormorant+Garamond:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<aside aria-label="Primary" style="{{ frame }}">
  <div style="height:40px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;margin-bottom:16px">
    <div style="display:flex;align-items:center;gap:3px"><span style="{{ dSm }}"></span><span style="{{ dLg }}"></span><span style="{{ dSm }}"></span></div>
    <span style="{{ word }}">99</span>
  </div>
  <nav style="display:flex;flex-direction:column;align-items:center;gap:4px">
    <sc-for list="{{ open }}" as="it" hint-placeholder-count="2">
      <span aria-label="{{ it.label }}" style="{{ it.style }}">
        <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="{{ it.d }}"></path></svg>
      </span>
    </sc-for>
    <sc-if value="{{ locked }}" hint-placeholder-val="{{ true }}">
      <div style="{{ well }}">
        <sc-for list="{{ shut }}" as="it" hint-placeholder-count="3">
          <button type="button" aria-label="{{ it.aria }}" style="{{ it.style }}">
            <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="{{ it.d }}"></path></svg>
          </button>
        </sc-for>
        <div aria-hidden="true" style="height:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
          <svg width="10" height="12" viewBox="0 0 10 12" fill="none" stroke="{{ lockInk }}" stroke-width="1.3"><rect x="1" y="5" width="8" height="6" rx="1.2"></rect><path d="M3 5V3.5a2 2 0 0 1 4 0V5"></path></svg>
          <span style="{{ lockLbl }}">Locked</span>
        </div>
      </div>
    </sc-if>
    <sc-for list="{{ rest }}" as="it" hint-placeholder-count="0">
      <span aria-label="{{ it.label }}" style="{{ it.style }}">
        <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="{{ it.d }}"></path></svg>
      </span>
    </sc-for>
  </nav>
  <button type="button" aria-label="About this screen" style="{{ helpStyle }}">?</button>
  <div style="padding:3px;border-radius:999px">
    <span style="{{ acct }}">HH</span>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["amonkhet","kaldheim","eldraine"],"default":"amonkhet"},"active":{"editor":"enum","options":["home","collection","commanders","discover","decks"],"default":"home"},"locked":{"editor":"boolean","default":false},"h":{"editor":"int","default":800},"$preview":{"width":62,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const P = {
      amonkhet: { bg:'#14110E', rail:'#1A1611', border:'#2B241B', strong:'#3A3229', elevated:'#29241F', surface:'#1E1A15', fg:'#EDE6D8', muted:'#A59C89', faint:'#8B8270', accent:'#CF8745', locked:'#6E6654', dashed:'#494037', disp:"'Cinzel',serif" },
      kaldheim: { bg:'#121217', rail:'#181920', border:'#1A1F2B', strong:'#2E3340', elevated:'#2D2E35', surface:'#1E1F26', fg:'#C6D2D3', muted:'#95A4A6', faint:'#7C8A8C', accent:'#5C86C9', locked:'#5F6D6E', dashed:'#424755', disp:"'Metamorphous',serif" },
      eldraine: { bg:'#120E17', rail:'#15121B', border:'#241D30', strong:'#342C41', elevated:'#26232C', surface:'#1B1821', fg:'#E4DEEE', muted:'#9C95A8', faint:'#898395', accent:'#AE88E6', locked:'#6A6475', dashed:'#443C52', disp:"'Cormorant Garamond',serif" },
    };
    const p = this.props;
    const t = P[p.theme] || P.amonkhet;
    const active = p.active ?? 'home';
    const locked = p.locked === true || p.locked === 'true';
    const defs = [
      ['home', 'Home', 'M3.5 9 10 4l6.5 5v7.5h-4.25v-4.5h-4.5v4.5H3.5z'],
      ['collection', 'Collection', 'M3.5 3.5h5v5h-5zM11.5 3.5h5v5h-5zM3.5 11.5h5v5h-5zM11.5 11.5h5v5h-5z'],
      ['commanders', 'Commanders', 'M3 14 4.5 6l3.5 3.5L10 5l2 4.5L15.5 6 17 14zM3 16.5h14'],
      ['discover', 'Discover', 'M10 3a7 7 0 1 0 0 14a7 7 0 1 0 0-14zM10 6.5 13.5 10 10 13.5 6.5 10z'],
      ['decks', 'Decks', 'M4 6.5h9.5v10.5H4zM6.5 3.5h9.5v10.5'],
    ];
    const slot = 'display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;box-sizing:border-box;';
    const live = ([k, label, d]) => ({ label, d, style: slot + (k === active ? `background:${t.elevated};color:${t.fg};` : `background:transparent;color:${t.faint};`) });
    const items = defs.map(live);
    const shutDefs = defs.slice(2);
    return {
      frame: `position:relative;width:62px;height:${Number(p.h ?? 800)}px;box-sizing:border-box;padding:14px 0;background:${t.rail};border-right:1px solid ${t.border};display:flex;flex-direction:column;align-items:center;font-family:'IBM Plex Sans',sans-serif`,
      dSm: `width:6px;height:6px;background:${t.accent};transform:rotate(45deg)`,
      dLg: `width:8.5px;height:8.5px;background:${t.accent};transform:rotate(45deg)`,
      word: `font-family:${t.disp};font-size:23px;line-height:1;color:${t.fg}`,
      locked,
      open: locked ? items.slice(0, 2) : items,
      rest: [],
      shut: shutDefs.map(([k, label, d]) => ({ label, d, aria: label + ', locked', style: slot + `border:0;padding:0;background:transparent;color:${t.locked};` })),
      well: `margin-top:4px;width:46px;box-sizing:border-box;padding:4px 0 2px;border:1px dashed ${t.dashed};border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:4px`,
      lockInk: t.locked,
      lockLbl: `font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:${t.locked}`,
      helpStyle: `margin-top:auto;margin-bottom:6px;width:38px;height:38px;border-radius:10px;border:0;padding:0;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:500;background:transparent;color:${t.faint}`,
      acct: `display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:999px;background:${t.surface};border:1px solid ${t.strong};box-sizing:border-box;font-family:'IBM Plex Mono',monospace;font-size:11px;color:${t.muted}`,
    };
  }
}
</script>
</body>
</html>
