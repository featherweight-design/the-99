<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Part · phone header</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=Metamorphous&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<header style="width:390px;height:79px;box-sizing:border-box;padding:20px 20px 14px;border-bottom:1px solid #1A1F2B;background:#121217;display:flex;align-items:flex-end;justify-content:space-between">
  <div style="display:flex;align-items:flex-end;gap:3px">
    <span style="font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.4em;color:#5C86C9;padding-bottom:4px">THE</span>
    <span style="font-family:'Metamorphous',serif;font-size:24px;line-height:1;color:#C6D2D3">99</span>
  </div>
  <div style="padding:3px;border-radius:15px;{{ halo }}">
    <span style="display:flex;align-items:center;justify-content:center;width:38px;height:38px;box-sizing:border-box;border-radius:12px;background:#121217;border:1px solid #5C86C9;font-family:'IBM Plex Mono',monospace;font-size:13px;color:#5C86C9">HD</span>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"halo":{"editor":"boolean","default":false},"$preview":{"width":390,"height":79}}'>
class Component extends DCLogic {
  renderVals() {
    const on = this.props.halo === true || this.props.halo === 'true';
    return { halo: on ? 'box-shadow:0 0 0 2px rgba(92,134,201,.6),0 0 0 6px rgba(92,134,201,.16);' : '' };
  }
}
</script>
</body>
</html>
