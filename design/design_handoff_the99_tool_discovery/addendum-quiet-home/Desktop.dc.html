<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quiet Home, desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Chakra+Petch:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:2480px;min-height:1720px;box-sizing:border-box;padding:48px 56px 64px;background:#0A0B0F;font-family:'IBM Plex Sans',sans-serif;color:#E6E8F0;display:flex;flex-direction:column;gap:36px">
<div style="display:flex;flex-direction:column;gap:10px">
<h2 style="margin:0;font:700 30px 'Chakra Petch',sans-serif">Desktop · 1300 · full pages</h2>
<p style="margin:0;font-size:15px;line-height:1.6;color:#B1B6C7">The same reader on four kinds of day. Rail 316px, main column the rest, as shipped.</p>
</div>

<div style="display:flex;flex-direction:column;gap:14px">
<span style="font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#FF6FAE">Quiet day: no table, no game to log, no lead</span>
<div style="display:flex;gap:40px;align-items:flex-start">
<figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:700px;flex:none">
<img src="art/qh-q-ship-1300.webp" alt="Shipped quiet Home at 1300" style="width:700px;height:779px;display:block;border-radius:12px;border:1px solid #262A35">
<figcaption style="display:flex;flex-direction:column;gap:6px"><p style="margin:0;font:600 15px 'IBM Plex Sans',sans-serif">Shipped</p><p style="margin:0;font-size:13px;line-height:1.55;color:#959AAD">The main column ends at All 5 decks; the rail runs on to Friends.</p></figcaption>
</figure>
<figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:700px;flex:none">
<img src="art/qh-q-prop-1300.webp" alt="Proposed quiet Home at 1300, What's new under the decks" style="width:700px;height:762px;display:block;border-radius:12px;border:1px solid #FF6FAE">
<figcaption style="display:flex;flex-direction:column;gap:6px"><p style="margin:0;font:600 15px 'IBM Plex Sans',sans-serif">Proposed (Q1 A, recommended)</p><p style="margin:0;font-size:13px;line-height:1.55;color:#959AAD">What's new under the decks in wide rows, its foot on one line. The rail is Commitments and Friends. The page is 30px shorter.</p></figcaption>
</figure>
<figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:700px;flex:none">
<img src="art/qh-qa-prop-1300.webp" alt="Alternative quiet Home at 1300, What's new above the decks" style="width:700px;height:762px;display:block;border-radius:12px;border:1px solid #262A35">
<figcaption style="display:flex;flex-direction:column;gap:6px"><p style="margin:0;font:600 15px 'IBM Plex Sans',sans-serif">Q1 B</p><p style="margin:0;font-size:13px;line-height:1.55;color:#959AAD">What's new above the decks, the one-column order. The decks start about 460px lower, under the fold at 900.</p></figcaption>
</figure>
</div>
</div>

<div style="display:flex;flex-direction:column;gap:14px">
<span style="font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#FF6FAE">In between and busy (Q2 A: two or more keep the rail)</span>
<div style="display:flex;gap:32px;align-items:flex-start">
<figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:440px;flex:none">
<img src="art/qh-l-prop-1300.webp" alt="Lead story only: What's new in the main column" style="width:440px;height:554px;display:block;border-radius:12px;border:1px solid #FF6FAE">
<figcaption style="display:flex;flex-direction:column;gap:6px"><p style="margin:0;font:600 15px 'IBM Plex Sans',sans-serif">Lead only · main column</p><p style="margin:0;font-size:13px;line-height:1.55;color:#959AAD">One card heads the column, so it still counts as quiet. The lead sits above the decks as shipped; the rest of the news follows them.</p></figcaption>
</figure>
<figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:440px;flex:none">
<img src="art/qh-t-prop-1300.webp" alt="Open table only: What's new in the main column" style="width:440px;height:523px;display:block;border-radius:12px;border:1px solid #FF6FAE">
<figcaption style="display:flex;flex-direction:column;gap:6px"><p style="margin:0;font:600 15px 'IBM Plex Sans',sans-serif">Table only · main column (Q2 A)</p><p style="margin:0;font-size:13px;line-height:1.55;color:#959AAD">One card, still quiet: the table on top, What's new under the decks.</p></figcaption>
</figure>
<figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:440px;flex:none">
<img src="art/qh-tb-prop-1300.webp" alt="Open table only under Q2 B: What's new stays in the rail" style="width:440px;height:489px;display:block;border-radius:12px;border:1px solid #262A35">
<figcaption style="display:flex;flex-direction:column;gap:6px"><p style="margin:0;font:600 15px 'IBM Plex Sans',sans-serif">Table only · rail (Q2 B)</p><p style="margin:0;font-size:13px;line-height:1.55;color:#959AAD">If any one card kept the rail, a table alone leaves the same hole under the decks.</p></figcaption>
</figure>
<figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:440px;flex:none">
<img src="art/qh-tl-prop-1300.webp" alt="Table and lead: What's new tops the rail" style="width:440px;height:489px;display:block;border-radius:12px;border:1px solid #262A35">
<figcaption style="display:flex;flex-direction:column;gap:6px"><p style="margin:0;font:600 15px 'IBM Plex Sans',sans-serif">Table and lead · rail</p><p style="margin:0;font-size:13px;line-height:1.55;color:#959AAD">Two cards: the columns end within about 220px of each other, so What's new keeps the top of the rail (R8).</p></figcaption>
</figure>
<figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:440px;flex:none">
<img src="art/qh-b-ship-1300.webp" alt="Busy day, unchanged" style="width:440px;height:512px;display:block;border-radius:12px;border:1px solid #262A35">
<figcaption style="display:flex;flex-direction:column;gap:6px"><p style="margin:0;font:600 15px 'IBM Plex Sans',sans-serif">Busy day · unchanged</p><p style="margin:0;font-size:13px;line-height:1.55;color:#959AAD">Banner, table, game to log, credits, lead. Pixel for pixel the shipped Home.</p></figcaption>
</figure>
</div>
</div>
</div>
</x-dc>

</html>
