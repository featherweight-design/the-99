<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Short-deck warning with chooser</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=IBM+Plex+Sans:wght@400;600&amp;family=IBM+Plex+Mono&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="box-sizing: border-box; width: 100%; padding: 20px; background: #1A1611; border: 1px solid #3A3229; border-radius: {{radius}}; font-family: 'IBM Plex Sans', sans-serif; color: #C0B8A6; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-family: Cinzel, serif; font-size: 20px; font-weight: 700; line-height: 1.3; color: #EDE6D8">{{title}}</h2>
<p style="margin: 0; font-size: 13.5px; line-height: 1.55; color: #C0B8A6">{{body}}</p>
<sc-if value="{{chooser}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 10px">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #948B78">{{heading}}</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #948B78">{{tally}}</span>
</div>
</sc-if>
<ul style="margin: 0; padding: 0; list-style: none; border: 1px solid #2B241B; border-radius: 10px; background: #14110E; overflow: hidden">
<sc-for list="{{rows}}" as="row" hint-placeholder-count="2">
<li style="border-bottom: {{row.rule}}">
<sc-if value="{{chooser}}" hint-placeholder-val="{{ true }}">
<button type="button" aria-pressed="{{row.picked}}" onClick="{{row.tap}}" style="all: unset; box-sizing: border-box; width: 100%; min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 8px 14px; cursor: pointer; background: {{row.bg}}; box-shadow: {{row.ring}}">
<span aria-hidden="true" style="flex: none; width: 18px; height: 18px; box-sizing: border-box; border-radius: {{row.markRadius}}; border: 1px solid {{row.markRing}}; display: flex; align-items: center; justify-content: center">
<span style="display: block; width: 8px; height: 8px; border-radius: {{row.dotRadius}}; background: {{row.dot}}"></span>
</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 14px; color: #EDE6D8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{row.name}}</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #948B78">{{row.sub}}</span>
</span>
<span style="flex: none; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: {{row.outColor}}">{{row.out}}</span>
</button>
</sc-if>
<sc-if value="{{plain}}" hint-placeholder-val="{{ false }}">
<div style="min-height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 8px 14px">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 14px; color: #EDE6D8">{{row.name}}</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #948B78">{{row.sub}}</span>
</span>
<span style="flex: none; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #C6533F">{{row.out}}</span>
</div>
</sc-if>
</li>
</sc-for>
</ul>
<sc-if value="{{refusal}}" hint-placeholder-val="{{ false }}">
<p role="status" style="margin: -4px 0 0; font-size: 12px; line-height: 1.5; color: #EDE6D8; padding-left: 9px; border-left: 2px solid #494037">{{refusal}}</p>
</sc-if>
<sc-if value="{{chooser}}" hint-placeholder-val="{{ true }}">
<div style="margin-top: -4px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; line-height: 1.5; color: #A59C89">
<span aria-live="polite">{{footer}}</span>
<sc-if value="{{custom}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{reset}}" style="all: unset; cursor: pointer; align-self: flex-start; min-height: 32px; display: flex; align-items: center; font-size: 12.5px; color: #CF8745; text-decoration: underline; text-underline-offset: 2px">Back to first committed</button>
</sc-if>
</div>
</sc-if>
<div style="display: flex; flex-direction: {{btnDir}}; justify-content: flex-end; gap: 10px; padding-top: 4px">
<button type="button" style="height: 44px; padding: 0 18px; border-radius: 8px; border: 1px solid #3A3229; background: transparent; color: #EDE6D8; font: 400 14px 'IBM Plex Sans', sans-serif; outline: 2px solid #CF8745; outline-offset: 2px">Cancel</button>
<button type="button" style="height: 44px; padding: 0 18px; border-radius: 8px; border: 1px solid #3A3229; background: #29241F; color: #EDE6D8; font: 600 14px 'IBM Plex Sans', sans-serif">Remove anyway</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"scene":{"editor":"enum","options":["default","picked","many","single"],"default":"default"},"desktop":{"editor":"boolean","default":false},"$preview":{"width":390,"height":640}}'>
class Component extends DCLogic {
  scenes() {
    return {
      one: {
        card: 'Counterspell', need: 1, left: 1,
        decks: [
          { id: 'atx', name: 'Atraxa Counters', sub: 'lists 1 · committed it Sept 12' },
          { id: 'mm', name: 'Mutant Menace', sub: 'lists 1 · committed it Oct 30' }
        ],
        def: ['mm']
      },
      many: {
        card: 'Counterspell', need: 2, left: 1,
        decks: [
          { id: 'atx', name: 'Atraxa Counters', sub: 'lists 1 · committed it Aug 4' },
          { id: 'knn', name: 'Kinnan Ramp', sub: 'lists 1 · committed it Sept 12' },
          { id: 'mm', name: 'Mutant Menace', sub: 'lists 1 · committed it Oct 30' }
        ],
        def: ['knn', 'mm']
      },
      single: {
        card: 'Counterspell', need: 1, left: 0,
        decks: [ { id: 'mm', name: 'Mutant Menace', sub: 'lists 1 · committed it Oct 30' } ],
        def: ['mm']
      }
    };
  }
  sceneKey() {
    const s = this.props.scene ?? 'default';
    return s === 'many' ? 'many' : s === 'single' ? 'single' : 'one';
  }
  picks() {
    const sc = this.scenes()[this.sceneKey()];
    if (this.state && this.state.picks && this.state.key === this.sceneKey()) return this.state.picks;
    if ((this.props.scene ?? 'default') === 'picked') return ['atx'];
    return sc.def;
  }
  names(list) {
    if (list.length === 1) return list[0];
    return list.slice(0, -1).join(', ') + ' and ' + list[list.length - 1];
  }
  renderVals() {
    const key = this.sceneKey();
    const sc = this.scenes()[key];
    const picks = this.picks();
    const chooser = key !== 'single';
    const isDefault = picks.length === sc.def.length && sc.def.every((d) => picks.includes(d));
    const square = sc.need > 1;
    const refusal = this.state && this.state.key === key ? this.state.refusal || '' : '';
    const set = (next, msg) => this.setState({ key, picks: next, refusal: msg || '' });
    const rows = sc.decks.map((d, i) => {
      const picked = picks.includes(d.id);
      const accent = picked && !isDefault;
      return {
        name: d.name,
        sub: d.sub,
        picked: picked ? 'true' : 'false',
        rule: i === sc.decks.length - 1 ? '0' : '1px solid #2B241B',
        bg: accent ? '#211D18' : 'transparent',
        ring: accent ? 'inset 0 0 0 1px #6B482A' : 'none',
        markRadius: square ? '4px' : '50%',
        dotRadius: square ? '2px' : '50%',
        markRing: picked ? (accent ? '#CF8745' : '#C0B8A6') : '#948B78',
        dot: picked ? (accent ? '#CF8745' : '#C0B8A6') : 'transparent',
        out: picked || !chooser ? 'short 1' : 'keeps it',
        outColor: picked ? '#C6533F' : '#948B78',
        tap: () => {
          if (sc.need === 1) return set([d.id]);
          if (picked) return set(picks.filter((p) => p !== d.id));
          if (picks.length >= sc.need) return set(picks, sc.need + ' decks are already going short. Untick one first.');
          return set(picks.concat(d.id));
        }
      };
    });
    const pickedNames = sc.decks.filter((d) => picks.includes(d.id)).map((d) => d.name);
    const keepNames = sc.decks.filter((d) => !picks.includes(d.id)).map((d) => d.name);
    const go = pickedNames.length === 1 ? 'goes' : 'go';
    let footer;
    if (picks.length < sc.need) footer = 'Pick ' + (sc.need - picks.length) + ' more to go short.';
    else if (isDefault) footer = this.names(pickedNames) + ' ' + go + ' short because ' + this.names(keepNames) + ' committed it first. Pick another deck to change that.';
    else footer = 'You picked ' + this.names(pickedNames) + ' to go short. ' + this.names(keepNames) + (keepNames.length === 1 ? ' keeps its copy.' : ' keep their copies.');
    const many = sc.need > 1;
    const title = 'Removing ' + sc.card + ' leaves ' + (sc.need === 1 ? '1 deck' : sc.need + ' decks') + ' short';
    const body = !chooser
      ? 'Nothing about this deck changes. It will show ' + sc.card + ' as short and put it on its shopping list.'
      : sc.decks.length + ' decks list ' + sc.card + ' and ' + (sc.left === 1 ? '1 copy' : sc.left + ' copies') + ' will be left. Pick ' + (many ? 'the ' + sc.need + ' that go' : 'the one that goes') + ' short. ' + (many ? 'Their lists stay the same, and ' + sc.card + ' goes on their shopping lists.' : 'Its list stays the same, and ' + sc.card + ' goes on its shopping list.');
    return {
      title, body, chooser, plain: !chooser, rows, footer, refusal,
      heading: many ? 'Which ' + sc.need + ' decks go short' : 'Which deck goes short',
      tally: many ? picks.length + ' of ' + sc.need + ' picked' : '',
      custom: chooser && !isDefault && picks.length === sc.need,
      reset: () => this.setState({ key, picks: sc.def, refusal: '' }),
      radius: this.props.desktop ? '12px' : '16px 16px 0 0',
      btnDir: this.props.desktop ? 'row' : 'column-reverse'
    };
  }
}
</script>
</body>
</html>
