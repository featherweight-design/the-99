<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Copy editor, desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Chakra+Petch:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:2340px;min-height:2860px;box-sizing:border-box;padding:48px 56px 64px;background:#0A0B0F;font-family:'IBM Plex Sans',sans-serif;color:#E6E8F0;display:flex;flex-direction:column;gap:32px">
<div style="display:flex;flex-direction:column;gap:10px"><h2 style="margin:0;font:700 30px 'Chakra Petch',sans-serif;color:#E6E8F0">Desktop · 1300 · every state</h2><p style="margin:0;font-size:15px;line-height:1.6;color:#B1B6C7;max-width:1400px">Editors are popovers anchored under the text (420px, flipping above when there is no room below). The tray opens above the bar, bottom right.</p></div><div style="display:flex;flex-direction:column;gap:14px"><span style="font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#E8A25C">States 1 to 3</span><div style="display:flex;gap:36px;align-items:flex-start"><figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:700px;flex:none">
<img src="art/ce-d-off.webp" alt="1 · Mode off" style="width:700px;height:485px;display:block;border-radius:14px;border:1px solid #262A35">
<figcaption style="display:flex;flex-direction:column;gap:6px">
<p style="margin:0;font:600 15px 'IBM Plex Sans',sans-serif;color:#E6E8F0">1 · Mode off</p>
<p style="margin:0;font-size:13px;line-height:1.55;color:#959AAD">Admin on staging: the page as players see it, plus the door. Desktop: the Edit copy pill, bottom right. Phone: a pencil in the header beside search. The amber dot says staging.</p>
</figcaption>
</figure><figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:700px;flex:none">
<img src="art/ce-d-on.webp" alt="2 · Mode on" style="width:700px;height:485px;display:block;border-radius:14px;border:1px solid #262A35">
<figcaption style="display:flex;flex-direction:column;gap:6px">
<p style="margin:0;font:600 15px 'IBM Plex Sans',sans-serif;color:#E6E8F0">2 · Mode on</p>
<p style="margin:0;font-size:13px;line-height:1.55;color:#959AAD">Every editable text gets a dashed outline. It is a CSS outline, so nothing moves. Read-only text (the Dinosaurs chip) is dotted grey. The pill becomes the bar: Editing copy, staging, Done.</p>
</figcaption>
</figure><figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:700px;flex:none">
<img src="art/ce-d-target.webp" alt="3 · Text targeted" style="width:700px;height:485px;display:block;border-radius:14px;border:1px solid #262A35">
<figcaption style="display:flex;flex-direction:column;gap:6px">
<p style="margin:0;font:600 15px 'IBM Plex Sans',sans-serif;color:#E6E8F0">3 · Text targeted</p>
<p style="margin:0;font-size:13px;line-height:1.55;color:#959AAD">Desktop hover, or a phone's first tap: a solid outline and a tag with the file and key. Desktop clicks to edit; a phone taps again, so scrolling never opens an editor.</p>
</figcaption>
</figure></div></div><div style="display:flex;flex-direction:column;gap:14px"><span style="font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#E8A25C">States 4 to 6</span><div style="display:flex;gap:36px;align-items:flex-start"><figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:700px;flex:none">
<img src="art/ce-d-ed-plain.webp" alt="4 · Editor · plain" style="width:700px;height:485px;display:block;border-radius:14px;border:1px solid #262A35">
<figcaption style="display:flex;flex-direction:column;gap:6px">
<p style="margin:0;font:600 15px 'IBM Plex Sans',sans-serif;color:#E6E8F0">4 · Editor · plain</p>
<p style="margin:0;font-size:13px;line-height:1.55;color:#959AAD">Now above, New below, the cap for the key's kind live as you type (title: up to 8 words). The page previews the new words in place.</p>
</figcaption>
</figure><figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:700px;flex:none">
<img src="art/ce-d-ed-fill.webp" alt="5 · Editor · with fill-ins" style="width:700px;height:485px;display:block;border-radius:14px;border:1px solid #262A35">
<figcaption style="display:flex;flex-direction:column;gap:6px">
<p style="margin:0;font:600 15px 'IBM Plex Sans',sans-serif;color:#E6E8F0">5 · Editor · with fill-ins</p>
<p style="margin:0;font-size:13px;line-height:1.55;color:#959AAD">{names} is a locked chip: it drags to a new spot and can’t be deleted. A line says what the app fills it with here, and a preview reads the whole sentence.</p>
</figcaption>
</figure><figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:700px;flex:none">
<img src="art/ce-d-ed-var.webp" alt="6 · Editor · with variations" style="width:700px;height:485px;display:block;border-radius:14px;border:1px solid #262A35">
<figcaption style="display:flex;flex-direction:column;gap:6px">
<p style="margin:0;font:600 15px 'IBM Plex Sans',sans-serif;color:#E6E8F0">6 · Editor · with variations</p>
<p style="margin:0;font-size:13px;line-height:1.55;color:#959AAD">One line’s variations edit together, each labelled by when it shows (n is 1 / otherwise) with today’s words beside it, and one preview of both.</p>
</figcaption>
</figure></div></div><div style="display:flex;flex-direction:column;gap:14px"><span style="font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#E8A25C">States 7 to 9</span><div style="display:flex;gap:36px;align-items:flex-start"><figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:700px;flex:none">
<img src="art/ce-d-ed-err.webp" alt="7 · Editor · rule error" style="width:700px;height:485px;display:block;border-radius:14px;border:1px solid #262A35">
<figcaption style="display:flex;flex-direction:column;gap:6px">
<p style="margin:0;font:600 15px 'IBM Plex Sans',sans-serif;color:#E6E8F0">7 · Editor · rule error</p>
<p style="margin:0;font-size:13px;line-height:1.55;color:#959AAD">Problems mark the text and list under the field as you type: the em dash, the exclamation mark, 9 words on an 8-word title. Add to edits waits until they clear.</p>
</figcaption>
</figure><figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:700px;flex:none">
<img src="art/ce-d-ed-ro.webp" alt="8 · Editor · read only" style="width:700px;height:485px;display:block;border-radius:14px;border:1px solid #262A35">
<figcaption style="display:flex;flex-direction:column;gap:6px">
<p style="margin:0;font:600 15px 'IBM Plex Sans',sans-serif;color:#E6E8F0">8 · Editor · read only</p>
<p style="margin:0;font-size:13px;line-height:1.55;color:#959AAD">Same frame, no field: a lock, today’s text and a one-line reason. Copy key and Close. Edit-in-code text gives the helper that builds it as its reason.</p>
</figcaption>
</figure><figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:700px;flex:none">
<img src="art/ce-d-tray.webp" alt="9 · Tray with edits" style="width:700px;height:485px;display:block;border-radius:14px;border:1px solid #262A35">
<figcaption style="display:flex;flex-direction:column;gap:6px">
<p style="margin:0;font:600 15px 'IBM Plex Sans',sans-serif;color:#E6E8F0">9 · Tray with edits</p>
<p style="margin:0;font-size:13px;line-height:1.55;color:#959AAD">The bar’s ‘3 edits ›’ opens it. Old struck through, new below, key on top; Edit and Remove per row; Clear all; Open pull request.</p>
</figcaption>
</figure></div></div><div style="display:flex;flex-direction:column;gap:14px"><span style="font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#E8A25C">States 10 to 12</span><div style="display:flex;gap:36px;align-items:flex-start"><figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:700px;flex:none">
<img src="art/ce-d-submitting.webp" alt="10 · Submitting" style="width:700px;height:485px;display:block;border-radius:14px;border:1px solid #262A35">
<figcaption style="display:flex;flex-direction:column;gap:6px">
<p style="margin:0;font:600 15px 'IBM Plex Sans',sans-serif;color:#E6E8F0">10 · Submitting</p>
<p style="margin:0;font-size:13px;line-height:1.55;color:#959AAD">Rows lock and dim; the button spins: ‘Checking the rules, then pushing a branch’.</p>
</figcaption>
</figure><figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:700px;flex:none">
<img src="art/ce-d-submitted.webp" alt="11 · Submitted" style="width:700px;height:485px;display:block;border-radius:14px;border:1px solid #262A35">
<figcaption style="display:flex;flex-direction:column;gap:6px">
<p style="margin:0;font:600 15px 'IBM Plex Sans',sans-serif;color:#E6E8F0">11 · Submitted</p>
<p style="margin:0;font-size:13px;line-height:1.55;color:#959AAD">PR number, branch, Open on GitHub. The page goes back to today’s staging text, and the bar keeps ‘PR #3301 open’ until it merges.</p>
</figcaption>
</figure><figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:700px;flex:none">
<img src="art/ce-d-failed.webp" alt="12 · Failed" style="width:700px;height:485px;display:block;border-radius:14px;border:1px solid #262A35">
<figcaption style="display:flex;flex-direction:column;gap:6px">
<p style="margin:0;font:600 15px 'IBM Plex Sans',sans-serif;color:#E6E8F0">12 · Failed</p>
<p style="margin:0;font-size:13px;line-height:1.55;color:#959AAD">No PR. Edits are kept. The edit at fault is flagged with its reason (here: changed on main since the page loaded) and Redo; Try again resubmits.</p>
</figcaption>
</figure></div></div>
</div>
</x-dc>

class Component extends DCLogic {

}
</script>
</body>
</html>
