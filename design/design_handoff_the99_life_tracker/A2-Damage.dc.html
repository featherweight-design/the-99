<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A2 · Controls on each panel, commander damage</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Cinzel";src:url(art/cinzel-variable.woff2) format("woff2");font-weight:400 900}
@font-face{font-family:"IBM Plex Sans";src:url(art/ibm-plex-sans-variable.woff2) format("woff2");font-weight:100 700}
@font-face{font-family:"IBM Plex Mono";src:url(art/ibm-plex-mono-500.woff2) format("woff2");font-weight:500}
body{margin:0}
.scr{--bg:#14110E;--surface:#1E1A15;--elevated:#29241F;--border:#2B241B;--border-strong:#3A3229;--fg:#EDE6D8;--fg-body:#C0B8A6;--fg-muted:#A59C89;--fg-faint:#948B78;--accent:#CF8745;--warning:#DEAA29;--fact:#8FA6BE;--danger:#C6533F;width:390px;height:844px;box-sizing:border-box;padding:6px;background:var(--bg);display:grid;grid-template-columns:186px 186px;grid-template-rows:413px 413px;gap:6px;position:relative;font-family:"IBM Plex Sans",system-ui,sans-serif;color:var(--fg)}
.cell{position:relative;overflow:hidden;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border)}
.rot{position:absolute;width:413px;height:186px;left:-113.5px;top:113.5px}
.r90{transform:rotate(90deg)}.r270{transform:rotate(-90deg)}
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.28}
.wash{position:absolute;inset:0;background:rgba(20,17,14,.62)}
.pane{position:absolute;inset:0;box-sizing:border-box;padding:10px 12px 10px;display:flex;flex-direction:column}
.who{display:flex;align-items:baseline;gap:8px;height:20px;white-space:nowrap;padding:0 30px}
.who b{font-weight:600;font-size:15px}
.who i{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--fg-body)}
.stp{flex:1;display:flex;align-items:center;justify-content:center;gap:18px}
.stp button{width:64px;height:64px;border-radius:14px;border:0;background:rgba(20,17,14,.8);box-shadow:inset 0 0 0 1px var(--border-strong);color:var(--fg);font-size:30px;font-family:"IBM Plex Sans",sans-serif}
.stp .v{font-family:"Cinzel",serif;font-weight:700;font-size:64px;min-width:96px;text-align:center;line-height:1}
.lbl{font-size:12.5px;color:var(--fg-body);text-align:center;height:16px}
.lbl b{color:var(--fg);font-weight:600}
.warn{color:var(--warning)}
.tgt{box-shadow:inset 0 0 0 2px var(--accent)}
.tgt .art{opacity:.5}
.tgt .wash{background:rgba(107,72,42,.66)}
.x{margin-left:auto;width:44px;height:44px;margin-top:-12px;background:none;border:0;color:var(--fg);font-size:22px;font-family:"IBM Plex Sans",sans-serif}
.big{font-family:"Cinzel",serif;font-weight:700;font-size:76px;line-height:1;text-align:center;flex:1;display:flex;align-items:center;justify-content:center}
.foot{font-size:12.5px;color:var(--fg);text-align:center}
.hub{position:absolute;left:165px;top:392px;width:60px;height:60px;border-radius:50%;border:0;background:var(--elevated);box-shadow:0 0 0 6px var(--bg),inset 0 0 0 2px var(--border-strong);display:flex;align-items:center;justify-content:center;color:var(--fg-faint)}
</style>
</helmet>
<div class="scr">
  <div class="cell">
    <div class="rot r90">
      <img class="art" src="art/ghalta.jpg" alt="">
      <div class="wash"></div>
      <div class="pane">
        <div class="who"><b>Colin</b><i>Ghalta Stompy</i></div>
        <div class="stp"><button aria-label="Ghalta dealt 1 less to Peter">−</button><span class="v">14</span><button aria-label="Ghalta dealt 1 more to Peter">+</button></div>
        <div class="lbl"><b>Ghalta</b> to Peter · <span class="warn">7 more is lethal</span></div>
      </div>
    </div>
  </div>
  <div class="cell tgt">
    <div class="rot r270">
      <img class="art" src="art/giada.jpg" alt="">
      <div class="wash"></div>
      <div class="pane">
        <div class="who"><b>Peter</b><i>taking commander damage</i><button class="x" aria-label="Done">✕</button></div>
        <div class="big">18</div>
        <div class="foot">Each point here comes off Peter's life too.</div>
      </div>
    </div>
  </div>
  <div class="cell">
    <div class="rot r90">
      <img class="art" src="art/sai.jpg" alt="">
      <div class="wash"></div>
      <div class="pane">
        <div class="who"><b>You</b><i>Sai Thopters</i></div>
        <div class="stp"><button aria-label="Sai dealt 1 less to Peter">−</button><span class="v">0</span><button aria-label="Sai dealt 1 more to Peter">+</button></div>
        <div class="lbl"><b>Sai</b> to Peter</div>
      </div>
    </div>
  </div>
  <div class="cell">
    <div class="rot r270">
      <img class="art" src="art/gisa.jpg" alt="">
      <div class="wash"></div>
      <div class="pane">
        <div class="who"><b>Max</b><i>Gisa Zombies</i></div>
        <div class="stp"><button aria-label="Gisa dealt 1 less to Peter">−</button><span class="v">0</span><button aria-label="Gisa dealt 1 more to Peter">+</button></div>
        <div class="lbl"><b>Gisa</b> to Peter</div>
      </div>
    </div>
  </div>
  <div class="hub" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 2.5l8.2 4.75v9.5L12 21.5l-8.2-4.75v-9.5z"/><path d="M12 2.5l-4.6 8.2h9.2zM7.4 10.7L3.8 16.75M16.6 10.7l3.6 6.05M7.4 10.7L12 21.5l4.6-10.8"/></svg></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
