<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>7 · Your sheet, Tax</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Cinzel";src:url(art/cinzel-variable.woff2) format("woff2");font-weight:400 900}
@font-face{font-family:"IBM Plex Sans";src:url(art/ibm-plex-sans-variable.woff2) format("woff2");font-weight:100 700}
@font-face{font-family:"IBM Plex Mono";src:url(art/ibm-plex-mono-500.woff2) format("woff2");font-weight:500}
body{margin:0}
.scr{--bg:#14110E;--surface:#1E1A15;--surface-raised:#211D18;--elevated:#29241F;--border:#2B241B;--border-strong:#3A3229;--fg:#EDE6D8;--fg-body:#C0B8A6;--fg-muted:#A59C89;--fg-faint:#948B78;--accent:#CF8745;--warning:#DEAA29;--danger:#C6533F;width:390px;height:844px;background:var(--bg);position:relative;overflow:hidden;font-family:"IBM Plex Sans",system-ui,sans-serif;color:var(--fg)}
.sheet{position:absolute;width:844px;height:390px;left:-227px;top:227px;transform:rotate(90deg);box-sizing:border-box;padding:12px 20px 14px;display:flex;flex-direction:column;gap:10px;background:var(--surface-raised)}
.hd{display:flex;align-items:center;gap:12px;height:44px}
.hd img{width:40px;height:40px;border-radius:50%;object-fit:cover}
.hd b{font-family:"Cinzel",serif;font-weight:700;font-size:21px}
.hd i{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--fg-muted)}
.x{margin-left:auto;width:44px;height:44px;background:none;border:0;color:var(--fg);font-size:22px;font-family:"IBM Plex Sans",sans-serif}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border)}
.tabs button{height:44px;padding:0 16px;background:none;border:0;border-bottom:2px solid transparent;color:var(--fg-muted);font-family:"IBM Plex Sans",sans-serif;font-weight:600;font-size:14px;margin-bottom:-1px}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.tabs button em{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--accent);margin-left:5px}
.tabs .sep{margin-left:auto}
.body{flex:1;display:flex;flex-direction:column;gap:8px;min-height:0}
.des{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tg{height:50px;border-radius:10px;border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border-strong);color:var(--fg-body);font-family:"IBM Plex Sans",sans-serif;text-align:left;padding:0 12px;display:flex;align-items:center;gap:10px}
.tg svg{flex:none}
.tg b{display:block;font-size:13.5px;font-weight:600;color:var(--fg)}
.tg small{display:block;font-size:11px;color:var(--fg-muted);line-height:1.3}
.tg.on{box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent)}
.cnt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.c{height:54px;border-radius:10px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);display:flex;align-items:center;gap:8px;padding:0 6px 0 12px}
.c div{flex:1;min-width:0}
.c b{display:block;font-size:13.5px;font-weight:600}
.c small{display:block;font-size:11px;color:var(--fg-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c button{width:44px;height:44px;border-radius:9px;border:0;background:var(--elevated);box-shadow:inset 0 0 0 1px var(--border-strong);color:var(--fg);font-size:20px;font-family:"IBM Plex Sans",sans-serif}
.c .v{font-family:"Cinzel",serif;font-weight:700;font-size:22px;min-width:30px;text-align:center}
.c.set{box-shadow:inset 0 0 0 1px var(--accent)}
.c.set .v{color:var(--accent)}
.tax{display:flex;gap:16px;flex:1}
.tc{flex:1;display:flex;gap:16px;align-items:center;border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);padding:14px 18px}
.tc img{width:150px;height:100px;border-radius:10px;object-fit:cover}
.tc .k{flex:1}
.tc b{display:block;font-size:16px;font-weight:600}
.tc small{display:block;font-size:12.5px;color:var(--fg-muted);margin-top:4px}
.stp{display:flex;align-items:center;gap:10px}
.stp button{width:52px;height:52px;border-radius:12px;border:0;background:var(--elevated);box-shadow:inset 0 0 0 1px var(--border-strong);color:var(--fg);font-size:26px;font-family:"IBM Plex Sans",sans-serif}
.stp .v{font-family:"Cinzel",serif;font-weight:700;font-size:40px;min-width:48px;text-align:center}
.due{width:150px;text-align:center}
.due span{display:block;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-muted)}
.due strong{display:block;font-family:"Cinzel",serif;font-weight:700;font-size:44px;color:var(--accent);line-height:1.1}
</style>
</helmet>
<div class="scr">
  <div class="sheet" role="dialog" aria-label="Your sheet">
    <div class="hd"><img src="art/sai.jpg" alt=""><b>You</b><i>Sai Thopters · 31 life</i><button class="x" aria-label="Close">✕</button></div>
    <div class="tabs"><button>Commander damage<em>6</em></button><button>Counters<em>1</em></button><button class="on">Tax<em>+4</em></button><button>Mana</button><button class="sep">Table</button></div>
    <div class="body">
      <div class="tax"><div class="tc"><img src="art/sai.jpg" alt=""><div class="k"><b>Sai</b><small>Times cast from the command zone</small></div><div class="stp"><button aria-label="One cast less">−</button><span class="v">2</span><button aria-label="One more cast">+</button></div><div class="due"><span>Next cast costs</span><strong>+4</strong></div></div></div>
      <p class="note" style="margin:0;font-size:12px;color:var(--fg-muted)">Tap + each time you cast your commander from the command zone. A partner deck shows one row per commander.</p>
    </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
