<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A1 · Controls on each panel, mid-game</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Cinzel";src:url(art/cinzel-variable.woff2) format("woff2");font-weight:400 900}
@font-face{font-family:"IBM Plex Sans";src:url(art/ibm-plex-sans-variable.woff2) format("woff2");font-weight:100 700}
@font-face{font-family:"IBM Plex Mono";src:url(art/ibm-plex-mono-500.woff2) format("woff2");font-weight:500}
body{margin:0}
.scr{--bg:#14110E;--surface:#1E1A15;--elevated:#29241F;--border:#2B241B;--border-strong:#3A3229;--fg:#EDE6D8;--fg-body:#C0B8A6;--fg-muted:#A59C89;--fg-faint:#948B78;--accent:#CF8745;--warning:#DEAA29;--fact:#8FA6BE;--danger:#C6533F;width:390px;height:844px;box-sizing:border-box;padding:6px;background:var(--bg);display:grid;grid-template-columns:186px 186px;grid-template-rows:413px 413px;gap:6px;position:relative;font-family:"IBM Plex Sans",system-ui,sans-serif;color:var(--fg)}
.cell{position:relative;overflow:hidden;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border)}
.rot{position:absolute;width:413px;height:186px;left:-113.5px;top:113.5px}
.r90{transform:rotate(90deg)}.r270{transform:rotate(-90deg)}
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.6}
.wash{position:absolute;inset:0;background:rgba(20,17,14,.52)}
.pane{position:absolute;inset:0;box-sizing:border-box;padding:10px 12px 10px;display:flex;flex-direction:column}
.who{display:flex;align-items:baseline;gap:8px;height:20px;white-space:nowrap;padding:0 30px}
.who b{font-weight:600;font-size:15px}
.who i{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--fg-body)}
.tag{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;padding:2px 7px;border-radius:999px;background:rgba(20,17,14,.8);box-shadow:inset 0 0 0 1px var(--border-strong);color:var(--fg-body)}
.tag.acc{color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.life{position:relative;flex:1;display:flex;align-items:center;justify-content:center}
.half{position:absolute;top:0;bottom:0;width:50%;background:none;border:0;color:var(--fg-muted);font-size:30px;font-family:"IBM Plex Sans",sans-serif;padding:0 6px;display:flex;align-items:center}
.minus{left:0;justify-content:flex-start}.plus{right:0;justify-content:flex-end}
.num{position:relative;font-family:"Cinzel",serif;font-weight:700;font-size:84px;line-height:1;pointer-events:none;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.delta{position:absolute;left:100%;top:6px;margin-left:6px;font-family:"IBM Plex Mono",monospace;font-size:16px;color:var(--accent);font-weight:500}
.tools{display:flex;gap:6px}
.tools button{flex:1;height:40px;border-radius:10px;border:0;background:rgba(20,17,14,.78);box-shadow:inset 0 0 0 1px var(--border-strong);color:var(--fg-body);font-family:"IBM Plex Sans",sans-serif;font-weight:600;font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:5px}
.tools button em{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--accent)}
.turn{box-shadow:inset 0 0 0 2px var(--accent)}
.hub{position:absolute;left:165px;top:392px;width:60px;height:60px;border-radius:50%;border:0;background:var(--elevated);box-shadow:0 0 0 6px var(--bg),inset 0 0 0 2px var(--accent);display:flex;align-items:center;justify-content:center;color:var(--accent)}
</style>
</helmet>
<div class="scr">
  <div class="cell turn">
    <div class="rot r90">
      <img class="art" src="art/ghalta.jpg" alt="">
      <div class="wash"></div>
      <div class="pane">
        <div class="who"><b>Colin</b><i>Ghalta Stompy</i><span class="tag acc">Turn 7</span></div>
        <div class="life"><button class="half minus" aria-label="Colin loses 1 life">−</button><span class="num">24</span><button class="half plus" aria-label="Colin gains 1 life">+</button></div>
        <div class="tools"><button>Tax <em>+2</em></button><button>Damage</button><button>Mana</button><button>Counters</button></div>
      </div>
    </div>
  </div>
  <div class="cell">
    <div class="rot r270">
      <img class="art" src="art/giada.jpg" alt="">
      <div class="wash"></div>
      <div class="pane">
        <div class="who"><b>Peter</b><i>Giada Angels</i><span class="tag">Poison 3</span></div>
        <div class="life"><button class="half minus" aria-label="Peter loses 1 life">−</button><span class="num">18</span><button class="half plus" aria-label="Peter gains 1 life">+</button></div>
        <div class="tools"><button>Tax</button><button>Damage <em>14</em></button><button>Mana</button><button>Counters <em>3</em></button></div>
      </div>
    </div>
  </div>
  <div class="cell">
    <div class="rot r90">
      <img class="art" src="art/sai.jpg" alt="">
      <div class="wash"></div>
      <div class="pane">
        <div class="who"><b>You</b><i>Sai Thopters</i></div>
        <div class="life"><button class="half minus" aria-label="You lose 1 life">−</button><span class="num">31<span class="delta">−3</span></span><button class="half plus" aria-label="You gain 1 life">+</button></div>
        <div class="tools"><button>Tax</button><button>Damage</button><button>Mana</button><button>Counters</button></div>
      </div>
    </div>
  </div>
  <div class="cell">
    <div class="rot r270">
      <img class="art" src="art/gisa.jpg" alt="">
      <div class="wash"></div>
      <div class="pane">
        <div class="who"><b>Max</b><i>Gisa Zombies</i><span class="tag acc">Monarch</span></div>
        <div class="life"><button class="half minus" aria-label="Max loses 1 life">−</button><span class="num">36</span><button class="half plus" aria-label="Max gains 1 life">+</button></div>
        <div class="tools"><button>Tax <em>+2</em></button><button>Damage</button><button>Mana</button><button>Counters</button></div>
      </div>
    </div>
  </div>
  <button class="hub" aria-label="Game options: turn, dice, day and night, undo, end game"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5l8.2 4.75v9.5L12 21.5l-8.2-4.75v-9.5z"/><path d="M12 2.5l-4.6 8.2h9.2zM7.4 10.7L3.8 16.75M16.6 10.7l3.6 6.05M7.4 10.7L12 21.5l4.6-10.8"/></svg></button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
