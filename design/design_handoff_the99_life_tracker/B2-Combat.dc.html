<style>
@font-face{font-family:"Cinzel";src:url(art/cinzel-variable.woff2) format("woff2");font-weight:400 900}
@font-face{font-family:"IBM Plex Sans";src:url(art/ibm-plex-sans-variable.woff2) format("woff2");font-weight:100 700}
@font-face{font-family:"IBM Plex Mono";src:url(art/ibm-plex-mono-500.woff2) format("woff2");font-weight:500}
body{margin:0}
.scr{--bg:#14110E;--surface:#1E1A15;--elevated:#29241F;--border:#2B241B;--border-strong:#3A3229;--fg:#EDE6D8;--fg-body:#C0B8A6;--fg-muted:#A59C89;--fg-faint:#948B78;--accent:#CF8745;--warning:#DEAA29;--fact:#8FA6BE;width:390px;height:844px;box-sizing:border-box;padding:6px;background:var(--bg);display:grid;grid-template-columns:148px 70px 148px;grid-template-rows:413px 413px;gap:6px;position:relative;font-family:"IBM Plex Sans",system-ui,sans-serif;color:var(--fg)}
.cell{position:relative;overflow:hidden;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border)}
.rot{position:absolute;width:413px;height:148px;left:-132.5px;top:132.5px}
.r90{transform:rotate(90deg)}.r270{transform:rotate(-90deg)}
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.28}
.wash{position:absolute;inset:0;background:rgba(20,17,14,.62)}
.pane{position:absolute;inset:0;box-sizing:border-box;padding:10px 14px;display:flex;flex-direction:column}
.who{display:flex;align-items:baseline;gap:8px;height:20px;white-space:nowrap}
.who b{font-weight:600;font-size:15px}
.who i{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--fg-body)}
.who .lf{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--fg-body)}
.stp{flex:1;display:flex;align-items:center;justify-content:center;gap:18px}
.stp button{width:60px;height:60px;border-radius:14px;border:0;background:rgba(20,17,14,.8);box-shadow:inset 0 0 0 1px var(--border-strong);color:var(--fg);font-size:30px;font-family:"IBM Plex Sans",sans-serif}
.stp .v{font-family:"Cinzel",serif;font-weight:700;font-size:60px;min-width:90px;text-align:center;line-height:1}
.lbl{font-size:12.5px;color:var(--fg-body);text-align:center;height:16px}
.lbl b{color:var(--fg);font-weight:600}
.warn{color:var(--warning)}
.atk{box-shadow:inset 0 0 0 2px var(--accent)}
.atk .art{opacity:.55}
.atk .wash{background:rgba(107,72,42,.62)}
.big{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.big strong{font-family:"Cinzel",serif;font-weight:700;font-size:30px;line-height:1.1}
.big span{font-size:12.5px;color:var(--fg)}
.done{align-self:center;height:44px;padding:0 26px;border-radius:10px;border:0;background:var(--accent);color:#14110E;font-family:"IBM Plex Sans",sans-serif;font-weight:600;font-size:14px}
.spine{grid-column:2;grid-row:1 / span 2;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.sb{position:relative;width:54px;height:54px;border-radius:50%;border:0;background:var(--elevated);box-shadow:inset 0 0 0 1px var(--border-strong);color:var(--fg-faint);display:flex;align-items:center;justify-content:center;font-family:"Cinzel",serif;font-weight:700;font-size:20px;opacity:.45}
.sb.on{color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent);opacity:1}
.rule{width:28px;height:1px;background:var(--border-strong)}
</style>
</helmet>

        <div class="lbl">From <b>Ghalta</b></div>

        <div class="stp"><button aria-label="1 less from Ghalta">−</button><span class="v">0</span><button aria-label="1 more from Ghalta">+</button></div>
        <div class="lbl">From <b>Ghalta</b></div>

    <div class="rule"></div>

    <div class="sb"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l3-3 3 3-3 3z"/></svg></div>

    <div class="sb"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="6" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="18" cy="12" r="1.8"/></svg></div>
  </div>
</div>
