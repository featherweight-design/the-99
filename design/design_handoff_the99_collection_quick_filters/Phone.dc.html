<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>R2 phone states</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Chakra+Petch:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:2206px;min-height:1360px;box-sizing:border-box;padding:48px 56px 64px;background:#0A0B0F;font-family:'IBM Plex Sans',sans-serif;color:#E6E8F0;display:flex;flex-direction:column;gap:36px">
<div style="display:flex;flex-direction:column;gap:10px"><h2 style="margin:0;font:700 30px 'Chakra Petch',sans-serif">R2 · Phone · 390 wide</h2><p style="margin:0;font-size:15px;line-height:1.6;color:#B1B6C7">One 30px strip under Filters that scrolls sideways, with the same chip rules as desktop.</p></div>
<div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:36px;align-items:start">
<figure style="margin:0;display:flex;flex-direction:column;gap:12px"><span style="font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.12em;color:#E8A25C">FULL COLLECTION</span><img src="art/qf-p-r2-full.webp" alt="Full strip" style="width:390px;height:1000px;display:block;border-radius:14px;border:1px solid #262A35"><figcaption style="font-size:13px;line-height:1.55;color:#959AAD">Seven chips, cut off at the right edge so it's clear the strip scrolls.</figcaption></figure>
<figure style="margin:0;display:flex;flex-direction:column;gap:12px"><span style="font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.12em;color:#E8A25C">ZERO CHIPS HIDDEN</span><img src="art/qf-p-r2-sparse.webp" alt="Sparse strip" style="width:390px;height:1000px;display:block;border-radius:14px;border:1px solid #262A35"><figcaption style="font-size:13px;line-height:1.55;color:#959AAD">The sample collection has four chips.</figcaption></figure>
<figure style="margin:0;display:flex;flex-direction:column;gap:12px"><span style="font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.12em;color:#E8A25C">OTHER FILTERS ON</span><img src="art/qf-p-r2-active.webp" alt="Active filters" style="width:390px;height:1000px;display:block;border-radius:14px;border:1px solid #262A35"><figcaption style="font-size:13px;line-height:1.55;color:#959AAD">With blue instants on (one card, Mystical Tutor), the counts drop and the Blue and Instant chips sit past the hairline, off screen. That's Q2.</figcaption></figure>
<figure style="margin:0;display:flex;flex-direction:column;gap:12px"><span style="font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.12em;color:#E8A25C">COMBOS · OWN BOTH</span><img src="art/qf-p-r2-combo-both.webp" alt="Combos own both" style="width:390px;height:1000px;display:block;border-radius:14px;border:1px solid #262A35"><figcaption style="font-size:13px;line-height:1.55;color:#959AAD">The pressed chip is solid with a ×, and the list shows pairs.</figcaption></figure>
<figure style="margin:0;display:flex;flex-direction:column;gap:12px"><span style="font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.12em;color:#E8A25C">COMBOS · OWN ONE</span><img src="art/qf-p-r2-combo-one.webp" alt="Combos own one" style="width:390px;height:1000px;display:block;border-radius:14px;border:1px solid #262A35"><figcaption style="font-size:13px;line-height:1.55;color:#959AAD">The missing half shows as a dashed slot, with its price or a draft that wants it.</figcaption></figure>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2206,"height":1360}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
