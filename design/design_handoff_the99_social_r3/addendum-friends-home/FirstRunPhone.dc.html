<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Part · First-run checklist at 390 with Friends</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=Cinzel:wght@500;600;700&amp;family=Chakra+Petch:wght@500;600;700&amp;family=Trirong:wght@500;600;700&amp;family=Syncopate:wght@400;700&amp;family=Cormorant+Garamond:wght@500;600;700&amp;family=Metamorphous&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="{{ s.frame }}">
  <dc-import name="PhoneChrome" theme="{{ theme }}" part="header" hint-size="390px,79px"></dc-import>
  <div style="padding:16px 16px 0">
    <p style="{{ s.kicker }}">STEP 1 OF 3</p>
    <h1 style="{{ s.h1 }}">Welcome to The 99</h1>
  </div>
  <div style="padding:16px 16px 20px;display:flex;flex-direction:column;gap:11px">
    <section aria-label="Step 1, Add your collection" style="{{ s.step1 }}">
      <div aria-hidden="true" style="position:relative;width:88px;height:92px">
        <span style="{{ s.c1 }}"></span><span style="{{ s.c2 }}"></span><span style="{{ s.c3 }}">99</span>
      </div>
      <h2 style="{{ s.s1Title }}">Add your collection</h2>
      <p style="{{ s.s1Body }}">Drop a CSV export from Moxfield, Archidekt, Deckbox or ManaBox.</p>
      <button type="button" style="{{ s.primary }}">Upload a CSV</button>
      <button type="button" style="{{ s.ghostBtn }}">Paste a list</button>
      <span style="{{ s.waysK }}">NO FILE? START ANOTHER WAY</span>
      <div style="{{ s.ways }}">
        <sc-for list="{{ wayRows }}" as="w" hint-placeholder-count="3">
          <a href="#" style="{{ w.row }}"><span style="display:flex;flex-direction:column;gap:2px"><span style="{{ s.wT }}">{{ w.title }}</span><span style="{{ s.wS }}">{{ w.sub }}</span></span><span aria-hidden="true" style="{{ s.wChev }}">›</span></a>
        </sc-for>
      </div>
    </section>
    <div role="group" aria-label="Pick a commander or import a deck, opens once your cards are in" style="{{ s.locked }}">
      <span aria-hidden="true" style="{{ s.num }}">2</span>
      <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><span style="{{ s.lTitle }}">Pick a commander or import a deck</span><span style="{{ s.lReason }}">Opens once your cards are in</span></span>
      <svg width="11" height="13" viewBox="0 0 10 12" fill="none" stroke="{{ lockInk }}" stroke-width="1.3" aria-hidden="true"><rect x="1" y="5" width="8" height="6" rx="1.2"></rect><path d="M3 5V3.5a2 2 0 0 1 4 0V5"></path></svg>
    </div>
    <dc-import name="ChecklistRow" theme="{{ theme }}" state="{{ row }}" context="{{ true }}" phone="{{ true }}" hint-size="358px,150px"></dc-import>
  </div>
  <div style="margin-top:auto"><dc-import name="PhoneChrome" theme="{{ theme }}" part="tabs" locked="{{ true }}" hint-size="390px,74px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["amonkhet","kamigawa","ixalan","phyrexia","eldraine","kaldheim"],"default":"amonkhet"},"row":{"editor":"enum","options":["todo","link","done"],"default":"todo"},"$preview":{"width":390,"height":1010}}'>
class Component extends DCLogic {
  renderVals() {
    const TH = {
      amonkhet: { bg:'#14110E', surface:'#1E1A15', rail:'#1A1611', inset:'#1B1712', elevated:'#29241F', border:'#2B241B', strong:'#3A3229', fg:'#EDE6D8', muted:'#A59C89', faint:'#8B8270', locked:'#6E6654', disabled:'#4A4033', accent:'#CF8745', disp:"'Cinzel',serif", dw:700 },
      kamigawa: { bg:'#0E0F14', surface:'#16181F', rail:'#12141B', inset:'#13151C', elevated:'#20222A', border:'#181C26', strong:'#262A35', fg:'#E6E8F0', muted:'#959AAD', faint:'#6F7486', locked:'#606476', disabled:'#3D404E', accent:'#FF4D9A', disp:"'Chakra Petch',sans-serif", dw:700 },
      ixalan:   { bg:'#0E1310', surface:'#171E19', rail:'#121814', inset:'#141B16', elevated:'#212A23', border:'#1D2620', strong:'#2C3830', fg:'#E0E7DE', muted:'#98A695', faint:'#808C7C', locked:'#626E5E', disabled:'#3E473A', accent:'#A3C445', disp:"'Trirong',serif", dw:700 },
      phyrexia: { bg:'#0D0B0E', surface:'#151317', rail:'#110F13', inset:'#131115', elevated:'#1E1C20', border:'#19161C', strong:'#262329', fg:'#E4E2E6', muted:'#9A96A0', faint:'#78747E', locked:'#64616A', disabled:'#403E45', accent:'#52827A', disp:"'Syncopate',sans-serif", dw:700 },
      eldraine: { bg:'#120E17', surface:'#1B1821', rail:'#15121B', inset:'#17141D', elevated:'#26232C', border:'#241D30', strong:'#342C41', fg:'#E4DEEE', muted:'#9C95A8', faint:'#898395', locked:'#6A6475', disabled:'#443F4D', accent:'#AE88E6', disp:"'Cormorant Garamond',serif", dw:700 },
      kaldheim: { bg:'#121217', surface:'#1E1F26', rail:'#181920', inset:'#1A1B22', elevated:'#2D2E35', border:'#1A1F2B', strong:'#2E3340', fg:'#C6D2D3', muted:'#95A4A6', faint:'#7C8A8C', locked:'#5F6D6E', disabled:'#3B4647', accent:'#5C86C9', disp:"'Metamorphous',serif", dw:400 },
    };
    const p = this.props;
    const theme = TH[p.theme] ? p.theme : 'amonkhet';
    const t = TH[theme];
    const mono = "font-family:'IBM Plex Mono',monospace;";
    const sans = "font-family:'IBM Plex Sans',sans-serif;";
    const card = (x, y, extra) => `position:absolute;left:${x}px;top:${y}px;width:50px;height:68px;box-sizing:border-box;border-radius:6px;border:1px solid ${t.strong};${extra}`;
    const wayRows = [
      ['Precons I own', 'Pick the boxes. We know every card in them.'],
      ['Import a deck', 'Paste a list you play.'],
      ['Add cards by hand', 'Search by name and add them one by one.'],
    ].map(([title, sub], i) => ({ title, sub, row: `display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:6px 14px;box-sizing:border-box;text-align:left;text-decoration:none;${i ? `border-top:1px solid ${t.border};` : ''}` }));
    const s = {
      frame: `width:390px;min-height:844px;display:flex;flex-direction:column;background:${t.bg};${sans}color:${t.muted}`,
      kicker: `margin:0 0 6px;${mono}font-size:10px;letter-spacing:.16em;color:${t.faint}`,
      h1: `margin:0;font-family:${t.disp};font-weight:${t.dw};font-size:23px;line-height:1.15;color:${t.fg}`,
      step1: `display:flex;flex-direction:column;align-items:center;text-align:center;padding:16px;border-radius:14px;border:1px solid ${t.accent};background:${t.inset}`,
      c1: card(8, 14, `background:${t.inset};transform:rotate(-14deg)`),
      c2: card(18, 10, `background:${t.elevated}`),
      c3: card(30, 14, `border-color:${t.accent};background:${t.surface};transform:rotate(13deg);display:flex;align-items:center;justify-content:center;font-family:${t.disp};font-weight:700;font-size:17px;color:${t.accent}`),
      s1Title: `margin:6px 0 0;font-family:${t.disp};font-weight:${t.dw};font-size:19px;color:${t.fg}`,
      s1Body: `margin:6px 0 14px;font-size:13px;line-height:1.55;color:${t.muted}`,
      primary: `width:100%;height:44px;border-radius:10px;border:0;background:${t.fg};color:${t.bg};${sans}font-size:14px;font-weight:600`,
      ghostBtn: `width:100%;height:44px;margin-top:8px;border-radius:10px;border:1px solid ${t.strong};background:transparent;color:${t.fg};${sans}font-size:14px`,
      waysK: `margin-top:16px;align-self:flex-start;${mono}font-size:10px;letter-spacing:.14em;color:${t.faint}`,
      ways: `margin-top:8px;width:100%;border:1px solid ${t.border};border-radius:10px;overflow:hidden;display:flex;flex-direction:column`,
      wT: `font-size:13.5px;font-weight:500;color:${t.fg}`, wS: `font-size:12px;color:${t.muted}`, wChev: `font-size:16px;color:${t.faint}`,
      locked: `display:flex;align-items:center;gap:12px;min-height:56px;box-sizing:border-box;padding:14px 15px;border-radius:14px;border:1px solid ${t.border};background:${t.rail}`,
      num: `flex:none;width:22px;height:22px;box-sizing:border-box;border-radius:6px;border:1px solid ${t.border};display:flex;align-items:center;justify-content:center;${mono}font-size:11px;color:${t.disabled}`,
      lTitle: `font-family:${t.disp};font-weight:${t.dw === 400 ? 400 : 600};font-size:15px;color:${t.locked}`,
      lReason: `font-size:12px;color:${t.locked}`,
    };
    return { theme, s, wayRows, lockInk: t.locked, row: p.row || 'todo' };
  }
}
</script>
</body>
</html>
